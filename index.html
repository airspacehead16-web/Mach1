      );
    }

    // =========================================================================
    // 7. STUDIO CMS PANEL (WITH GLOBAL SYNC & POINTS GRAPH EDITOR)
    // =========================================================================
    function AdminCMSPanel({
      teams, setTeams,
      drivers, setDrivers,
      airliners, setAirliners,
      articles, setArticles,
      glossaryTerms, setGlossaryTerms,
      customTrajectory, setCustomTrajectory,
      raceSummary, setRaceSummary,
      savedRaces, setSavedRaces,
      saveAllData, refreshFromCloud, notify,
      syncStatus, onLogout
    }) {
      const [tab, setTab] = useState('race');
      const [ghToken, setGhToken] = useState(() => getStoredGithubToken());
      const [showGhBox, setShowGhBox] = useState(false);

      // Season Trajectory Graph Editor State
      const [graphSeries, setGraphSeries] = useState('F1');
      const [graphTarget, setGraphTarget] = useState('drivers');
      const [graphRoundLabels, setGraphRoundLabels] = useState(['Mexico GP', 'Brazil GP', 'COTA GP']);
      const [graphMatrix, setGraphMatrix] = useState({});

      const graphContenders = (graphTarget === 'drivers'
        ? [...drivers].filter(d => d.series === graphSeries).sort((a, b) => Number(b.points || 0) - Number(a.points || 0))
        : [...teams].filter(t => t.series === graphSeries).sort((a, b) => Number(b.points || 0) - Number(a.points || 0))
      ).slice(0, 8);

      useEffect(() => {
        const key = `${graphSeries}_${graphTarget}`;
        const existing = customTrajectory?.[key];
        if (existing && Array.isArray(existing.roundLabels) && existing.roundLabels.length) {
          setGraphRoundLabels(existing.roundLabels);
          setGraphMatrix(existing.series || {});
        } else {
          const seriesRaces = [...savedRaces]
            .filter(r => {
              const s = String(r.series || 'Formula 1').toUpperCase();
              if (graphSeries === 'F1') return s.includes('1') || s === 'F1';
              if (graphSeries === 'F2') return s.includes('2') || s === 'F2';
              if (graphSeries === 'FE') return s.includes('E') || s === 'FE';
              return true;
            })
            .reverse();
          const defaultLabels = seriesRaces.length ? seriesRaces.map(r => r.shortTitle || 'Race') : ['Round 1', 'Round 2', 'Round 3'];
          const initMat = {};
          graphContenders.forEach(c => {
            if (seriesRaces.length) {
              let run = 0;
              const arr = seriesRaces.map(r => {
                const rows = r.standings || [];
                const earned = graphTarget === 'drivers'
                  ? Number(rows.find(row => String(row.code || '').toUpperCase() === String(c.code || '').toUpperCase())?.points || 0)
                  : rows.filter(row => String(row.team || '').toLowerCase().includes(String(c.name || '').toLowerCase())).reduce((a, m) => a + Number(m.points || 0), 0);
                run += earned;
                return run;
              });
              const offset = Math.max(0, Number(c.points || 0) - run);
              initMat[c.id] = arr.map(v => v + offset);
            } else {
              initMat[c.id] = defaultLabels.map((_, idx) => Math.round((Number(c.points || 0) * (idx + 1)) / defaultLabels.length));
            }
          });
          setGraphRoundLabels(defaultLabels);
          setGraphMatrix(initMat);
        }
      }, [graphSeries, graphTarget]);

      // Glossary Form State
      const [glCat, setGlCat] = useState('ACTIVE AERO');
      const [glTerm, setGlTerm] = useState('');
      const [glShort, setGlShort] = useState('');
      const [glDetail, setGlDetail] = useState('');

      // Article Form
      const [editingArticleId, setEditingArticleId] = useState(null);
      const [artSection, setArtSection] = useState('track');
      const [artBadge, setArtBadge] = useState('F1');
      const [artTag, setArtTag] = useState('ACTIVE AERODYNAMICS');
      const [artTitle, setArtTitle] = useState('');
      const [artSummary, setArtSummary] = useState('');
      const [artBody, setArtBody] = useState('');

      // Driver Form
      const [editingDriverId, setEditingDriverId] = useState(null);
      const [drvSeries, setDrvSeries] = useState('F1');
      const [drvNum, setDrvNum] = useState('');
      const [drvCode, setDrvCode] = useState('');
      const [drvName, setDrvName] = useState('');
      const [drvNationality, setDrvNationality] = useState('');
      const [drvTeam, setDrvTeam] = useState('');
      const [drvColor, setDrvColor] = useState('#FF1E00');
      const [drvPoints, setDrvPoints] = useState('0');
      const [drvChamp, setDrvChamp] = useState(false);
      const [drvPoles, setDrvPoles] = useState('—');
      const [drvPodiums, setDrvPodiums] = useState('—');
      const [drvWins, setDrvWins] = useState('—');
      const [drvLast, setDrvLast] = useState('—');
      const [drvBio, setDrvBio] = useState('');

      // Team Form
      const [editingTeamId, setEditingTeamId] = useState(null);
      const [teamSeries, setTeamSeries] = useState('F1');
      const [teamCode, setTeamCode] = useState('');
      const [teamName, setTeamName] = useState('');
      const [teamChassis, setTeamChassis] = useState('');
      const [teamPU, setTeamPU] = useState('');
      const [teamBase, setTeamBase] = useState('');
      const [teamColor, setTeamColor] = useState('#FF8000');
      const [teamRank, setTeamRank] = useState('1');
      const [teamPoints, setTeamPoints] = useState('0');
      const [teamChamp, setTeamChamp] = useState(false);
      const [teamBio, setTeamBio] = useState('');

      // Airliner Form
      const [editingAirlinerId, setEditingAirlinerId] = useState(null);
      const [airMfg, setAirMfg] = useState('Airbus');
      const [airModel, setAirModel] = useState('');
      const [airCode, setAirCode] = useState('');
      const [airColor, setAirColor] = useState('#005EB8');
      const [airStatus, setAirStatus] = useState('IN SERVICE');
      const [airSpeed, setAirSpeed] = useState('Mach 0.85');
      const [airRange, setAirRange] = useState('');
      const [airEngines, setAirEngines] = useState('');
      const [airMtow, setAirMtow] = useState('250,000 kg');
      const [airCeiling, setAirCeiling] = useState('43,100 ft');
      const [airBio, setAirBio] = useState('');

      // Race Summary Editor State
      const [editingRaceId, setEditingRaceId] = useState(null);
      const [raceName, setRaceName] = useState(raceSummary.raceName || '');
      const [raceShortTitle, setRaceShortTitle] = useState(raceSummary.shortTitle || 'Race');
      const [raceFlag, setRaceFlag] = useState(raceSummary.flag || '🏁');
      const [raceSeries, setRaceSeries] = useState(raceSummary.series || 'Formula 1');
      const [raceCircuit, setRaceCircuit] = useState(raceSummary.circuit || 'Circuit of the Americas');
      const [raceWeather, setRaceWeather] = useState(raceSummary.weather || 'Dry • Track 34°C / Air 26°C');
      const [raceStatus, setRaceStatus] = useState(raceSummary.status || 'OFFICIAL CLASSIFICATION');
      const [raceFastest, setRaceFastest] = useState(raceSummary.fastestLap || '');
      const [raceDebrief, setRaceDebrief] = useState(raceSummary.debrief || '');
      const [displayOnTicker, setDisplayOnTicker] = useState(true);
      const [syncPointsToStandings, setSyncPointsToStandings] = useState(false);

      const [standingRows, setStandingRows] = useState(() =>
        (raceSummary.standings || []).map((r, i) => ({
          id: `st-${i}-${Date.now()}`,
          pos: r.pos || String(i + 1),
          name: r.name || '',
          code: r.code || '',
          team: r.team || '',
          color: r.color || '#FF1E00',
          interval: r.interval || (i === 0 ? 'WINNER' : '+0.000s'),
          tyresStr: Array.isArray(r.tires) ? r.tires.join(',') : 'M',
          pits: String(r.pits ?? 1),
          points: String(r.points ?? 0)
        }))
      );

      const [dnfRows, setDnfRows] = useState(() => (raceSummary.dnfs || []).map((d, i) => ({ id: `dnf-${i}`, ...d })));
      const [penRows, setPenRows] = useState(() => (raceSummary.penalties || []).map((p, i) => ({ id: `pen-${i}`, ...p })));
      const [flagRows, setFlagRows] = useState(() => (raceSummary.flags || []).map((f, i) => ({ id: `flg-${i}`, ...f })));

      const loadRaceIntoForm = (r) => {
        setEditingRaceId(r.id || null);
        setRaceName(r.raceName || '');
        setRaceShortTitle(r.shortTitle || 'Race');
        setRaceFlag(r.flag || '🏁');
        setRaceSeries(r.series || 'Formula 1');
        setRaceCircuit(r.circuit || '');
        setRaceWeather(r.weather || '');
        setRaceStatus(r.status || 'OFFICIAL CLASSIFICATION');
        setRaceFastest(r.fastestLap || '');
        setRaceDebrief(r.debrief || '');
        setDisplayOnTicker(r.activeOnTicker !== false);
        setStandingRows(
          (r.standings || []).map((row, i) => ({
            id: `st-${i}-${Date.now()}`,
            pos: row.pos || String(i + 1),
            name: row.name || '',
            code: row.code || '',
            team: row.team || '',
            color: row.color || '#FF1E00',
            interval: row.interval || '',
            tyresStr: Array.isArray(row.tires) ? row.tires.join(',') : 'M',
            pits: String(row.pits ?? 1),
            points: String(row.points ?? 0)
          }))
        );
        setDnfRows((r.dnfs || []).map((d, i) => ({ id: `dnf-${i}`, ...d })));
        setPenRows((r.penalties || []).map((p, i) => ({ id: `pen-${i}`, ...p })));
        setFlagRows((r.flags || []).map((f, i) => ({ id: `flg-${i}`, ...f })));
      };

      const handleUpdateStandingRow = (idx, field, val) => {
        setStandingRows(prev => prev.map((row, i) => {
          if (i !== idx) return row;
          const updated = { ...row, [field]: val };
          if (field === 'name') {
            const matched = drivers.find(d => d.name.toLowerCase() === val.trim().toLowerCase());
            if (matched) {
              updated.code = matched.code;
              updated.team = matched.team;
              updated.color = matched.color;
            }
          }
          if (field === 'code') {
            const matched = drivers.find(d => d.code.toLowerCase() === val.trim().toLowerCase());
            if (matched) {
              if (!updated.name) updated.name = matched.name;
              updated.team = matched.team;
              updated.color = matched.color;
            }
          }
          return updated;
        }));
      };

      const handleSaveRace = (e) => {
        e.preventDefault();
        const formattedStandings = standingRows
          .filter(r => r.name.trim() || r.code.trim())
          .map((r, i) => {
            const matched = drivers.find(
              d => d.code.toLowerCase() === r.code.trim().toLowerCase() || d.name.toLowerCase() === r.name.trim().toLowerCase()
            );
            return {
              pos: r.pos.trim() || String(i + 1),
              code: (r.code.trim() || r.name.trim().slice(0, 3) || 'DRV').toUpperCase(),
              name: r.name.trim() || matched?.name || 'Driver',
              team: r.team.trim() || matched?.team || 'Constructor',
              color: r.color || matched?.color || '#FF1E00',
              interval: r.interval.trim() || (i === 0 ? 'WINNER' : '+0.000s'),
              tires: (r.tyresStr || 'M').split(',').map(t => t.trim().toUpperCase()).filter(Boolean),
              pits: Number(r.pits || 0),
              points: Number(r.points || 0)
            };
          });

        const formattedDnfs = dnfRows.filter(d => d.name.trim() || d.code.trim()).map(d => ({
          code: d.code.trim().toUpperCase() || 'DNF',
          name: d.name.trim() || 'Driver',
          status: d.status.trim() || 'DNF',
          lap: d.lap.trim() || 'Lap 1',
          reason: d.reason.trim()
        }));

        const formattedPens = penRows.filter(p => p.name.trim() || p.code.trim()).map(p => ({
          code: p.code.trim().toUpperCase() || 'PEN',
          name: p.name.trim() || 'Driver',
          penalty: p.penalty.trim() || '+5s Time Penalty',
          reason: p.reason.trim()
        }));

        const formattedFlags = flagRows.filter(f => f.type.trim() || f.note.trim()).map(f => ({
          type: f.type.trim().toUpperCase() || 'GREEN FLAG',
          lap: f.lap.trim() || 'Lap 1',
          note: f.note.trim()
        }));

        const raceRecord = {
          id: editingRaceId || `race-${Date.now()}`,
          raceName: raceName.trim() || 'Grand Prix Classification',
          shortTitle: raceShortTitle.trim() || 'Race',
          flag: raceFlag.trim() || '🏁',
          series: raceSeries,
          circuit: raceCircuit.trim(),
          date: new Date().toISOString().slice(0, 10),
          laps: raceSummary.laps || 'Official Race Distance',
          weather: raceWeather.trim() || 'Dry • 24°C',
          status: raceStatus,
          fastestLap: raceFastest.trim(),
          debrief: raceDebrief.trim(),
          activeOnTicker: displayOnTicker,
          standings: formattedStandings,
          dnfs: formattedDnfs,
          penalties: formattedPens,
          flags: formattedFlags
        };

        const nextSaved = editingRaceId
          ? savedRaces.map(item => (item.id === editingRaceId ? raceRecord : (displayOnTicker ? { ...item, activeOnTicker: false } : item)))
          : [raceRecord, ...savedRaces.map(item => (displayOnTicker ? { ...item, activeOnTicker: false } : item))];

        let nextDrivers = drivers;
        let nextTeams = teams;
        if (syncPointsToStandings) {
          nextDrivers = drivers.map(drv => {
            const match = formattedStandings.find(s => s.code === drv.code.toUpperCase());
            return match ? { ...drv, points: Number(drv.points || 0) + Number(match.points || 0) } : drv;
          });
          nextTeams = teams.map(tm => {
            const teamPts = formattedStandings
              .filter(s => s.team.toLowerCase().includes(tm.name.toLowerCase()) || tm.name.toLowerCase().includes(s.team.toLowerCase()))
              .reduce((acc, s) => acc + Number(s.points || 0), 0);
            return teamPts > 0 ? { ...tm, points: Number(tm.points || 0) + teamPts } : tm;
          });
          setDrivers(nextDrivers);
          setTeams(nextTeams);
        }

        setSavedRaces(nextSaved);
        const nextActiveRace = displayOnTicker ? raceRecord : raceSummary;
        setRaceSummary(nextActiveRace);
        saveAllData(nextTeams, nextDrivers, airliners, articles, nextActiveRace, nextSaved, glossaryTerms, customTrajectory);
      };

      const recalculateStandingsFromSavedRaces = () => {
        const f1Races = savedRaces.filter(r => {
          const s = String(r.series || 'Formula 1').toUpperCase();
          return s.includes('1') || s === 'F1';
        });
        if (!f1Races.length) return;
        const driverTotals = {};
        const teamTotals = {};
        f1Races.forEach(r => {
          (r.standings || []).forEach(row => {
            const code = String(row.code || '').toUpperCase();
            const pts = Number(row.points || 0);
            if (code) driverTotals[code] = (driverTotals[code] || 0) + pts;
            const matchedTeam = teams.find(t =>
              t.series === 'F1' && (
                String(row.team || '').toLowerCase().includes(t.name.toLowerCase()) ||
                t.name.toLowerCase().includes(String(row.team || '').toLowerCase())
              )
            );
            if (matchedTeam) teamTotals[matchedTeam.id] = (teamTotals[matchedTeam.id] || 0) + pts;
          });
        });

        const nextDrivers = drivers.map(d =>
          d.series === 'F1' && driverTotals[d.code.toUpperCase()] !== undefined
            ? { ...d, points: driverTotals[d.code.toUpperCase()] }
            : d
        );
        const nextTeams = teams.map(t =>
          t.series === 'F1' && teamTotals[t.id] !== undefined
            ? { ...t, points: teamTotals[t.id] }
            : t
        );
        setDrivers(nextDrivers);
        setTeams(nextTeams);
        saveAllData(nextTeams, nextDrivers, airliners, articles, raceSummary, savedRaces, glossaryTerms, customTrajectory);
        notify(`Standings synced across ${f1Races.length} saved races!`);
      };

      return (
        <div className="space-y-8">
          <div className="border-b border-line pb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <div className="font-mono text-xs uppercase tracking-[0.2em] text-crimson font-bold">MACH1 EDITORIAL STUDIO</div>
              <h1 className="font-syne text-3xl font-extrabold text-bone mt-1">Content, Race & Standings Control</h1>
            </div>
            <div className="flex flex-wrap gap-2">
              <button onClick={() => refreshFromCloud(false)} className="px-3.5 py-2 rounded-xl bg-panel border border-line hover:border-bone font-mono text-xs text-bone">
                ↻ Pull Cloud
              </button>
              <button onClick={() => setShowGhBox(prev => !prev)} className="px-3.5 py-2 rounded-xl bg-panel border border-ember/60 font-mono text-xs text-ember font-bold">
                {syncStatus === 'synced' ? '● GitHub Synced' : '+ GitHub Sync'}
              </button>
              <button onClick={onLogout} className="px-3.5 py-2 rounded-xl bg-panel border border-crimson/60 font-mono text-xs text-bone">
                Lock Studio
              </button>
            </div>
          </div>

          {showGhBox && (
            <div className="p-5 rounded-2xl bg-panel border border-ember/50 space-y-3">
              <div className="font-mono text-xs font-bold uppercase text-ember">
                DIRECT GITHUB REPOSITORY SYNC ({GH_OWNER}/{GH_REPO} → {GH_FILE})
              </div>
              <div className="flex flex-col sm:flex-row gap-2">
                <input
                  type="password"
                  value={ghToken}
                  onChange={e => setGhToken(e.target.value)}
                  placeholder="ghp_..."
                  className="flex-1 px-3.5 py-2 rounded-xl bg-void border border-line font-mono text-xs text-bone"
                />
                <button
                  onClick={() => {
                    try { localStorage.setItem(GH_TOKEN_KEY, ghToken.trim()); } catch (e) {}
                    saveAllData(teams, drivers, airliners, articles, raceSummary, savedRaces, glossaryTerms, customTrajectory);
                    setShowGhBox(false);
                  }}
                  className="px-4 py-2 rounded-xl bg-ember text-void font-mono text-xs font-extrabold uppercase"
                >
                  Save Token & Sync
                </button>
              </div>
            </div>
          )}

          {/* CMS Tabs */}
          <div className="flex flex-wrap gap-2 border-b border-line pb-4">
            {[
              { id: 'race', label: 'Race Results & Top Bar' },
              { id: 'graph', label: 'Points Graph Editor' },
              { id: 'articles', label: `Briefings & Articles (${articles.length})` },
              { id: 'glossary', label: `Glossary (${glossaryTerms.length})` },
              { id: 'drivers', label: `Drivers & WDC Gold (${drivers.length})` },
              { id: 'teams', label: `Constructors & WCC Gold (${teams.length})` },
              { id: 'airliners', label: `Airliners (${airliners.length})` }
            ].map(t => (
              <button
                key={t.id}
                onClick={() => setTab(t.id)}
                className={`px-4 py-2 rounded-xl font-mono text-xs uppercase border ${
                  tab === t.id ? 'bg-gradient-to-r from-crimson/20 to-ember/15 border-crimson text-bone font-bold' : 'bg-panel border-line text-dim hover:text-bone'
                }`}
              >
                {t.label}
              </button>
            ))}
          </div>

          {tab === 'graph' && (
            <div className="p-6 rounded-2xl bg-panel border border-line space-y-6">
              <div className="flex flex-wrap items-center justify-between gap-4 border-b border-line pb-4">
                <div>
                  <div className="font-mono text-[10px] uppercase tracking-[0.2em] text-crimson font-bold">SEASON TRAJECTORY EDITOR</div>
                  <h2 className="text-xl font-bold text-bone mt-0.5">Edit Championship Points Graph (Round-by-Round Cumulative Totals)</h2>
                </div>
                <div className="flex flex-wrap items-center gap-2">
                  <select value={graphSeries} onChange={e => setGraphSeries(e.target.value)} className="px-3 py-2 rounded-xl bg-void border border-line font-mono text-xs text-bone">
                    <option value="F1">Formula 1 (F1)</option>
                    <option value="F2">Formula 2 (F2)</option>
                    <option value="FE">Formula E (FE)</option>
                  </select>
                  <select value={graphTarget} onChange={e => setGraphTarget(e.target.value)} className="px-3 py-2 rounded-xl bg-void border border-line font-mono text-xs text-bone">
                    <option value="drivers">Top 8 Drivers</option>
                    <option value="teams">Top 8 Constructors</option>
                  </select>
                  <button
                    type="button"
                    onClick={() => {
                      const nextIdx = graphRoundLabels.length + 1;
                      setGraphRoundLabels(prev => [...prev, `Round ${nextIdx}`]);
                      setGraphMatrix(prev => {
                        const copy = { ...prev };
                        graphContenders.forEach(c => {
                          const arr = Array.isArray(copy[c.id]) ? [...copy[c.id]] : [];
                          const lastVal = arr.length ? Number(arr[arr.length - 1] || 0) : Number(c.points || 0);
                          arr.push(lastVal);
                          copy[c.id] = arr;
                        });
                        return copy;
                      });
                    }}
                    className="px-3 py-2 rounded-xl bg-void border border-ember/60 font-mono text-xs text-ember font-bold"
                  >
                    + Add Round
                  </button>
                  {graphRoundLabels.length > 1 && (
                    <button

                      <button

                          setArticles(next);

                        }}

                    nationality: drvNationality.trim() || 'International',
                    teamId: '',
                    team: drvTeam.trim() || 'Constructor',
                    color: drvColor,
                    flag: '🏁',
                    rank: drivers.filter(d => d.series === drvSeries).length + 1,
                    points: Number(drvPoints || 0),
                    isChampion: drvChamp,
                    poles: drvPoles.trim() || '—',
                    podiums: drvPodiums.trim() || '—',
                    wins: drvWins.trim() || '—',

                  <select value={drvSeries} onChange={e => setDrvSeries(e.target.value)} className="px-3 py-2 rounded-xl bg-void border border-line text-xs text-bone">
                    <option value="F1">Formula 1 (F1)</option>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">

                  <input type="text" value={drvPodiums} onChange={e => setDrvPodiums(e.target.value)} placeholder="Podiums" className="px-3 py-2 rounded-xl bg-void border border-line text-xs text-bone" />
                  <input type="text" value={drvWins} onChange={e => setDrvWins(e.target.value)} placeholder="Wins" className="px-3 py-2 rounded-xl bg-void border border-line text-xs text-bone" />

                    code: (teamCode || teamName.slice(0, 3)).toUpperCase(),
                    name: teamName.trim(),
                    chassis: teamChassis.trim() || '2026 Spec',
                    powerUnit: teamPU.trim() || 'Works Hybrid',
                    base: teamBase.trim() || 'HQ',
                    color: teamColor,
                    rank: Number(teamRank || 1),

                          setAirBio(ac.bio || '');

                        Edit
                      </button>
                      <button
                        onClick={() => {
                          const next = airliners.filter(item => item.id !== ac.id);
                          setAirliners(next);
                          saveAllData(teams, drivers, next, articles, raceSummary, savedRaces, glossaryTerms, customTrajectory);

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Mach1App />);
  </script>
