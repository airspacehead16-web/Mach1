    @keyframes tickerPass {

      display: inline-flex;
      align-items: center;

      padding-left: 100%;
      white-space: nowrap;

    // 1. CLOUD SYNC & PERSISTENCE (GITHUB DATA.JSON + LOCAL STORAGE)
    // =========================================================================
    const STORAGE_KEY = 'mach1_flagship_vlog_v4';
    const GH_TOKEN_KEY = 'mach1_github_pat_v1';
    const ADMIN_PIN = '2026';
    const GOLD = '#D4AF37';

    const GH_OWNER = 'airspacehead16-web';
    const GH_REPO = 'Mach1';
    const GH_BRANCH = 'main';
    const GH_FILE = 'data.json';

    const getStoredGithubToken = () => {
      try { return localStorage.getItem(GH_TOKEN_KEY) || ''; } catch (e) { return ''; }
    };

    const encodeUTF8Base64 = (str) => {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      bytes.forEach(b => { bin += String.fromCharCode(b); });
      return btoa(bin);
    };

    const decodeUTF8Base64 = (b64) => {
      const bin = atob(b64.replace(/\n/g, ''));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    };

    const fetchPublicGithubData = async () => {
      try {
        const rawUrl = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${GH_FILE}?t=${Date.now()}`;
        const res = await fetch(rawUrl, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data && typeof data === 'object') return data;
        }
      } catch (e) {}

      try {
        const apiUrl = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}&t=${Date.now()}`;
        const headers = { Accept: 'application/vnd.github+json' };
        const token = getStoredGithubToken();
        if (token) headers.Authorization = `Bearer ${token}`;
        const res = await fetch(apiUrl, { headers, cache: 'no-store' });
        if (res.ok) {
          const json = await res.json();
          if (json && json.content) return JSON.parse(decodeUTF8Base64(json.content));
        }
      } catch (e) {}
      return null;
    };

    const pushToGithubRepo = async (payloadObj) => {
      const token = getStoredGithubToken();
      if (!token) return { ok: false, noToken: true };

      const apiUrl = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`;
      const headers = {
        Authorization: `Bearer ${token}`,
        Accept: 'application/vnd.github+json',
        'Content-Type': 'application/json'
      };

      const attemptPut = async () => {
        let sha = null;
        const getRes = await fetch(`${apiUrl}?ref=${GH_BRANCH}&t=${Date.now()}`, { headers, cache: 'no-store' });
        if (getRes.ok) {
          const existing = await getRes.json();
          sha = existing.sha || null;
        }
        const body = {
          message: `MACH1 Studio: Sync intelligence data (${new Date().toISOString()})`,
          content: encodeUTF8Base64(JSON.stringify(payloadObj, null, 2)),
          branch: GH_BRANCH
        };
        if (sha) body.sha = sha;
        return fetch(apiUrl, { method: 'PUT', headers, body: JSON.stringify(body) });
      };

      try {
        let putRes = await attemptPut();
        if (putRes.status === 409) putRes = await attemptPut();
        if (!putRes.ok) {
          const errData = await putRes.json().catch(() => ({}));
          return { ok: false, error: errData.message || `GitHub API Error (${putRes.status})` };
        }
        return { ok: true };
      } catch (e) {
        return { ok: false, error: e?.message || 'Network error pushing to GitHub' };
      }
    };

        ? (drivers || []).filter(d => String(d?.name || '').toLowerCase().includes(term) || String(d?.code || '').toLowerCase().includes(term) || String(d?.team || '').toLowerCase().includes(term))

        ? (teams || []).filter(t => String(t?.name || '').toLowerCase().includes(term) || String(t?.chassis || '').toLowerCase().includes(term))
        : [];
      const matchedAirliners = term
        ? (airliners || []).filter(a => String(a?.model || '').toLowerCase().includes(term) || String(a?.manufacturer || '').toLowerCase().includes(term))
        : [];
      const matchedArticles = term

                  <div className="font-mono text-[10px] uppercase tracking-widest text-dim">DRIVERS</div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    {matchedDrivers.map(d => (
                      <button key={d.id} onClick={() => { onSelectDossier({ ...d, kind: 'driver' }); onClose(); }} className="p-2.5 rounded-xl bg-void border border-line hover:border-ember text-left flex items-center justify-between">
                        <div>
                          <div className="text-xs font-bold text-bone">{d.isChampion ? '👑 ' : ''}{d.name}</div>
                          <div className="font-mono text-[10px] text-dim">{d.series} • {d.team}</div>
                        </div>
                        <span className="font-mono text-xs font-bold" style={{ color: d.color }}>#{d.number}</span>
                      </button>
                    ))}
                  </div>
                </div>
              )}
              {matchedTeams.length > 0 && (
                <div className="space-y-1.5">
                  <div className="font-mono text-[10px] uppercase tracking-widest text-dim">CONSTRUCTORS</div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    {matchedTeams.map(t => (
                      <button key={t.id} onClick={() => { onSelectDossier({ ...t, kind: 'team' }); onClose(); }} className="p-2.5 rounded-xl bg-void border border-line hover:border-crimson text-left flex items-center justify-between">
                        <div>
                          <div className="text-xs font-bold text-bone">{t.isChampion ? '👑 ' : ''}{t.name}</div>
                          <div className="font-mono text-[10px] text-dim">{t.series} • {t.chassis}</div>
                        </div>
                        <span className="font-mono text-xs text-dim">→</span>
                      </button>
                    ))}
                  </div>
                </div>
              )}
              {matchedAirliners.length > 0 && (
                <div className="space-y-1.5">
                  <div className="font-mono text-[10px] uppercase tracking-widest text-dim">AIRLINERS</div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    {matchedAirliners.map(a => (
                      <button key={a.id} onClick={() => { onSelectDossier({ ...a, kind: 'airliner' }); onClose(); }} className="p-2.5 rounded-xl bg-void border border-line hover:border-ember text-left flex items-center justify-between">
                        <div>
                          <div className="text-xs font-bold text-bone">{a.manufacturer} {a.model}</div>
                          <div className="font-mono text-[10px] text-dim">{a.cruiseSpeed}</div>
                        </div>
                        <span className="font-mono text-xs text-ember">{a.code}</span>
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 7. MAIN APPLICATION
    // =========================================================================
    function Mach1App() {
      const [teams, setTeams] = useState(() => {
        try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (s?.teams?.length) return s.teams; } catch (e) {}
        return INITIAL_TEAMS;
      });
      const [drivers, setDrivers] = useState(() => {
        try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (s?.drivers?.length) return s.drivers; } catch (e) {}
        return INITIAL_DRIVERS;
      });
      const [airliners, setAirliners] = useState(() => {
        try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (s?.airliners?.length) return s.airliners; } catch (e) {}
        return INITIAL_AIRLINERS;
      });
      const [articles, setArticles] = useState(() => {
        try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (s?.articles?.length) return s.articles; } catch (e) {}
        return INITIAL_ARTICLES;
      });
      const [raceSummary, setRaceSummary] = useState(() => {
        try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (s?.raceSummary?.standings) return s.raceSummary; } catch (e) {}
        return INITIAL_RACE_SUMMARY;
      });
      const [savedRaces, setSavedRaces] = useState(() => {
        try {
          const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (Array.isArray(s?.savedRaces) && s.savedRaces.length) return s.savedRaces;
          const base = s?.raceSummary?.standings ? s.raceSummary : INITIAL_RACE_SUMMARY;
          return [{ id: 'race-initial', series: 'Formula 1', circuit: 'Circuit of the Americas', status: 'OFFICIAL CLASSIFICATION', activeOnTicker: true, ...base }];
        } catch (e) {
          return [{ id: 'race-initial', series: 'Formula 1', circuit: 'Circuit of the Americas', status: 'OFFICIAL CLASSIFICATION', activeOnTicker: true, ...INITIAL_RACE_SUMMARY }];
        }
      });

      const [route, setRoute] = useState({ view: 'home' });
      const [driverSeriesFilter, setDriverSeriesFilter] = useState('F1');
      const [standingsSeries, setStandingsSeries] = useState('F1');
      const [activeDossier, setActiveDossier] = useState(null);
      const [activeArticle, setActiveArticle] = useState(null);
      const [compareMode, setCompareMode] = useState(false);
      const [compareList, setCompareList] = useState([]);
      const [compareKind, setCompareKind] = useState('driver');
      const [searchOpen, setSearchOpen] = useState(false);
      const [mobileOpen, setMobileOpen] = useState(false);
      const [isAdmin, setIsAdmin] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [toastMsg, setToastMsg] = useState('');
      const [syncStatus, setSyncStatus] = useState(() => (getStoredGithubToken() ? 'synced' : 'local'));
      const [theme, setTheme] = useState(() => {
        try { return localStorage.getItem('mach1_theme') || 'dark'; } catch (e) { return 'dark'; }
      });

      const notify = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3400);
      };

      useEffect(() => {
        const rootEl = document.documentElement;
        if (theme === 'light') {
          rootEl.classList.add('light-theme');
          rootEl.classList.remove('dark');
        } else {
          rootEl.classList.remove('light-theme');
          rootEl.classList.add('dark');
        }
        try { localStorage.setItem('mach1_theme', theme); } catch (e) {}
      }, [theme]);

      useEffect(() => {
        const onKey = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setSearchOpen(prev => !prev);
          } else if (e.key === 'Escape') {
            setSearchOpen(false);
            setActiveDossier(null);
            setActiveArticle(null);
            setCompareList([]);
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        const syncHash = () => {
          const hash = (window.location.hash || '').replace(/^#/, '');
          if (!hash) return;
          const [prefix, entityId] = hash.split('/');
          if (['home', 'track', 'sky', 'race', 'standings', 'drivers', 'f1', 'f2', 'fe', 'airliners', 'admin'].includes(prefix)) {
            setRoute({ view: prefix });
          } else if (prefix === 'article' && entityId) {
            const found = articles.find(a => a.id === entityId);
            if (found) setActiveArticle(found);
          } else if (prefix === 'driver' && entityId) {
            const found = drivers.find(d => d.id === entityId);
            if (found) setActiveDossier({ ...found, kind: 'driver' });
          } else if (prefix === 'team' && entityId) {
            const found = teams.find(t => t.id === entityId);
            if (found) setActiveDossier({ ...found, kind: 'team' });
          } else if (prefix === 'airliner' && entityId) {
            const found = airliners.find(a => a.id === entityId);
            if (found) setActiveDossier({ ...found, kind: 'airliner' });
          }
        };
        syncHash();
        window.addEventListener('hashchange', syncHash);
        return () => window.removeEventListener('hashchange', syncHash);
      }, [drivers, teams, airliners, articles]);

      const refreshFromCloud = async (silent = false) => {
        setSyncStatus('syncing');
        const remote = await fetchPublicGithubData();
        if (remote) {
          if (Array.isArray(remote.teams) && remote.teams.length) setTeams(remote.teams);
          if (Array.isArray(remote.drivers) && remote.drivers.length) setDrivers(remote.drivers);
          if (Array.isArray(remote.airliners) && remote.airliners.length) setAirliners(remote.airliners);
          if (Array.isArray(remote.articles) && remote.articles.length) setArticles(remote.articles);
          if (remote.raceSummary && remote.raceSummary.standings) setRaceSummary(remote.raceSummary);
          if (Array.isArray(remote.savedRaces) && remote.savedRaces.length) setSavedRaces(remote.savedRaces);
          try {
            const existing = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...existing, ...remote }));
          } catch (e) {}
          setSyncStatus('synced');
          if (!silent) notify('Cloud data synced from GitHub!');
        } else {
          setSyncStatus(getStoredGithubToken() ? 'synced' : 'local');
          if (!silent) notify('Using local workspace data');
        }
      };

      useEffect(() => { refreshFromCloud(true); }, []);

      const navigate = (next) => {
        setRoute(next);
        setCompareMode(false);
        setCompareList([]);
        try { window.history.replaceState(null, '', `#${next.view}`); } catch (e) {}
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const openArticleReader = (art) => {
        setActiveArticle(art);
        try { window.history.replaceState(null, '', `#article/${art.id}`); } catch (e) {}
      };

      const openDossierWithHash = (item) => {
        setActiveDossier(item);
        try { window.history.replaceState(null, '', `#${item.kind}/${item.id}`); } catch (e) {}
      };

      const handleShareEntity = (item) => {
        const slug = item.kind ? `${item.kind}/${item.id}` : `article/${item.id}`;
        const shareUrl = `${window.location.origin}${window.location.pathname}#${slug}`;
        const ta = document.createElement('textarea');
        ta.value = shareUrl;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); notify('Direct link copied!'); } catch (e) { notify(shareUrl); }
        document.body.removeChild(ta);
      };

      const handleCubeClick = (item, kind) => {
        if (compareMode) {
          setCompareKind(kind);
          setCompareList(prev => {
            if (prev.some(x => x.id === item.id)) return prev.filter(x => x.id !== item.id);
            if (prev.length >= 2) return [prev[1], item];
            return [...prev, item];
          });
        } else {
          openDossierWithHash({ ...item, kind });
        }
      };

      const saveAllData = async (nextTeams, nextDrivers, nextAirliners, nextArticles, nextRace, nextSavedRaces = savedRaces) => {
        const payload = {
          teams: nextTeams,
          drivers: nextDrivers,
          airliners: nextAirliners,
          articles: nextArticles,
          raceSummary: nextRace,
          savedRaces: nextSavedRaces,
          updatedAt: new Date().toISOString()
        };
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); } catch (e) {}
        setSyncStatus('syncing');
        const res = await pushToGithubRepo(payload);
        if (res.ok) {
          setSyncStatus('synced');
          notify('Published & synced globally to GitHub!');
        } else if (!res.noToken && res.error) {
          setSyncStatus('error');
          notify(`Saved locally (GitHub note: ${res.error})`);
        } else {
          setSyncStatus('local');
          notify('Saved locally! Connect GitHub token in Studio to publish globally.');
        }
      };

      // =====================================================================
      // CUBE RENDERERS
      // =====================================================================
      const renderDriverCube = (drv) => {
        const selected = compareList.some(x => x.id === drv.id);
        const accent = drv.isChampion ? GOLD : drv.color;
        return (
          <button
            key={drv.id}
            onClick={() => handleCubeClick(drv, 'driver')}
            style={{
              borderColor: selected ? '#D2FF00' : drv.isChampion ? GOLD : `${drv.color}65`,
              borderLeftWidth: '4px',
              borderLeftColor: accent
            }}
            className={`mach-cube p-4 rounded-2xl border flex flex-col justify-between text-left ${
              drv.isChampion ? 'champ-foil' : 'card-gradient'
            }`}
          >
            <div>
              <div className="flex items-center justify-between w-full font-mono text-xs gap-2">
                <span className="text-dim truncate">{drv.team}</span>
                {drv.isChampion ? (
                  <span className="px-2 py-0.5 rounded bg-gold/20 text-gold border border-gold/50 text-[10px] font-bold shrink-0">👑 WDC</span>
                ) : (
                  <span className="font-bold shrink-0" style={{ color: drv.color }}>#{drv.number}</span>
                )}
              </div>
              <h3 className="text-base sm:text-lg font-bold text-bone leading-snug mt-1">{drv.name}</h3>
              <div className="font-mono text-[11px] text-dim mt-1">
                {drv.isChampion ? `#${drv.number} • ` : ''}{drv.nationality || drv.series}
              </div>
            </div>

            <div className="w-full h-px bg-line my-3"></div>

            <div className="grid grid-cols-4 gap-1.5 w-full font-mono text-center">
              <div className="py-1.5 px-1 rounded-lg bg-void border border-line/80"><div className="text-[9px] text-dim">POLES</div><div className="text-xs font-bold text-bone mt-0.5">{drv.poles ?? '—'}</div></div>
              <div className="py-1.5 px-1 rounded-lg bg-void border border-line/80"><div className="text-[9px] text-dim">PODS</div><div className="text-xs font-bold text-bone mt-0.5">{drv.podiums ?? '—'}</div></div>
              <div className="py-1.5 px-1 rounded-lg bg-void border border-line/80"><div className="text-[9px] text-dim">WINS</div><div className="text-xs font-bold text-bone mt-0.5">{drv.wins ?? '—'}</div></div>
              <div className="py-1.5 px-1 rounded-lg bg-void border border-line/80"><div className="text-[9px] text-dim">PTS</div><div className="text-xs font-bold text-gold mt-0.5">{drv.points ?? 0}</div></div>
            </div>
          </button>
        );
      };

      const renderTeamCube = (team) => {
        const selected = compareList.some(x => x.id === team.id);
        const accent = team.isChampion ? GOLD : team.color;
        return (
          <button
            key={team.id}
            onClick={() => handleCubeClick(team, 'team')}
            style={{
              borderColor: selected ? '#D2FF00' : team.isChampion ? GOLD : `${team.color}70`,
              borderTopWidth: '4px',
              borderTopColor: accent
            }}
            className={`mach-cube aspect-square p-5 rounded-2xl border flex flex-col justify-between text-left ${
              team.isChampion ? 'champ-foil' : 'card-gradient'
            }`}
          >
            <div className="flex items-center justify-between w-full font-mono text-xs">
              <span className="px-2 py-0.5 rounded bg-void border border-line font-bold" style={{ color: accent }}>{team.code}</span>
              {team.isChampion ? (
                <span className="px-2 py-0.5 rounded bg-gold/20 text-gold border border-gold/50 text-[10px] font-bold">👑 WCC</span>
              ) : (
                <span className="text-dim font-bold">P{team.rank}</span>
              )}
            </div>

            <div className="my-auto py-2">
              <div className="font-mono text-[10px] uppercase tracking-widest text-dim">{team.chassis}</div>
              <h3 className="text-lg font-bold text-bone leading-snug mt-1">{team.name}</h3>
              <div className="text-xs text-dim truncate mt-1">{team.powerUnit}</div>
            </div>

            <div className="w-full pt-3 border-t border-line/70 flex items-center justify-between font-mono text-[11px]">
              <span className={team.isChampion ? 'text-gold font-extrabold' : 'text-bone font-bold'}>{team.points} PTS</span>
              <span className="text-dim">{compareMode ? (selected ? '✓ Selected' : '+ Compare') : 'Dossier →'}</span>
            </div>
          </button>
        );
      };

      const renderAirlinerCube = (ac) => {
        const selected = compareList.some(x => x.id === ac.id);
        return (
          <button
            key={ac.id}
            onClick={() => handleCubeClick(ac, 'airliner')}
            style={{
              borderColor: selected ? '#D2FF00' : `${ac.color}70`,
              borderTopWidth: '4px',
              borderTopColor: ac.color
            }}
            className="mach-cube card-gradient aspect-square p-5 rounded-2xl border flex flex-col justify-between text-left"
          >
            <div className="flex items-center justify-between w-full font-mono text-xs">
              <span className="px-2 py-0.5 rounded bg-void border border-line text-bone font-bold">{ac.code}</span>
              <span className="text-[10px] uppercase text-ember font-semibold">{ac.status}</span>
            </div>

            <div className="my-auto py-2">
              <div className="font-mono text-[11px] uppercase tracking-wider text-dim">{ac.manufacturer}</div>
              <h3 className="text-lg font-bold text-bone leading-snug mt-0.5">{ac.model}</h3>
              <div className="font-mono text-xs text-ember mt-1">{ac.cruiseSpeed}</div>
            </div>

            <div className="w-full pt-3 border-t border-line/70 flex items-center justify-between font-mono text-[11px]">
              <span className="text-bone font-bold">{ac.range}</span>
              <span className="text-dim">{compareMode ? (selected ? '✓ Selected' : '+ Compare') : 'Specs →'}</span>
            </div>
          </button>
        );
      };

      // =====================================================================
      // CHAMPIONSHIP STANDINGS PAGE (WORLD CHAMPION GOLD)
      // =====================================================================
      const renderStandingsPage = () => {
        const seriesDrivers = [...drivers]
          .filter(d => d.series === standingsSeries)
          .sort((a, b) => Number(b.points || 0) - Number(a.points || 0) || Number(a.rank || 99) - Number(b.rank || 99));
        const seriesTeams = [...teams]
          .filter(t => t.series === standingsSeries)
          .sort((a, b) => Number(b.points || 0) - Number(a.points || 0) || Number(a.rank || 99) - Number(b.rank || 99));

        const wdcChamp = seriesDrivers.find(d => d.isChampion) || seriesDrivers[0];
        const wccChamp = seriesTeams.find(t => t.isChampion) || seriesTeams[0];

        return (
          <div className="space-y-8">
            <div className="border-b border-line pb-6 flex flex-col md:flex-row md:items-end justify-between gap-4">
              <div>
                <div className="font-mono text-xs uppercase tracking-[0.25em] text-gold font-bold">
                  WORLD CHAMPIONSHIP STANDINGS // WDC & WCC
                </div>
                <h1 className="font-syne text-3xl sm:text-4xl font-extrabold text-bone mt-1">
                  {standingsSeries} Championship Standings
                </h1>
              </div>
              <div className="flex gap-2">
                {['F1', 'F2', 'FE'].map(code => (
                  <button
                    key={code}
                    onClick={() => setStandingsSeries(code)}
                    className={`px-4 py-2 rounded-xl font-mono text-xs font-bold border transition-colors ${
                      standingsSeries === code
                        ? 'bg-gold text-void border-gold'
                        : 'bg-panel border-line text-dim hover:text-bone'
                    }`}
                  >
                    {code}
                  </button>
                ))}
              </div>
            </div>

            {/* Reigning World Champion Gold Spotlights */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              {wdcChamp && (
                <button
                  onClick={() => openDossierWithHash({ ...wdcChamp, kind: 'driver' })}
                  className="champ-foil p-6 rounded-2xl border-2 text-left flex items-center justify-between gap-4 transition-transform hover:-translate-y-0.5"
                >
                  <div>
                    <div className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded bg-gold/20 border border-gold/50 font-mono text-[10px] font-extrabold text-gold uppercase">
                      <span>👑</span>
                      <span>WORLD DRIVERS’ CHAMPION</span>
                    </div>
                    <h2 className="font-syne text-2xl font-extrabold text-bone mt-2">{wdcChamp.name}</h2>
                    <div className="font-mono text-xs text-dim mt-0.5">#{wdcChamp.number} • {wdcChamp.team}</div>
                  </div>
                  <div className="text-right font-mono shrink-0">
                    <div className="text-3xl font-extrabold text-gold">{wdcChamp.points}</div>
                    <div className="text-[10px] text-gold/80 uppercase">PTS</div>
                  </div>
                </button>
              )}

              {wccChamp && (
                <button
                  onClick={() => openDossierWithHash({ ...wccChamp, kind: 'team' })}
                  className="champ-foil p-6 rounded-2xl border-2 text-left flex items-center justify-between gap-4 transition-transform hover:-translate-y-0.5"
                >
                  <div>
                    <div className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded bg-gold/20 border border-gold/50 font-mono text-[10px] font-extrabold text-gold uppercase">
                      <span>👑</span>
                      <span>WORLD CONSTRUCTORS’ CHAMPION</span>
                    </div>
                    <h2 className="font-syne text-2xl font-extrabold text-bone mt-2">{wccChamp.name}</h2>
                    <div className="font-mono text-xs text-dim mt-0.5">{wccChamp.chassis} • {wccChamp.powerUnit}</div>
                  </div>
                  <div className="text-right font-mono shrink-0">
                    <div className="text-3xl font-extrabold text-gold">{wccChamp.points}</div>
                    <div className="text-[10px] text-gold/80 uppercase">PTS</div>
                  </div>
                </button>
              )}
            </div>

            {/* Tables */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              <div className="lg:col-span-7 rounded-2xl bg-panel border border-line overflow-hidden">
                <div className="px-5 py-3.5 border-b border-line flex items-center justify-between">
                  <h3 className="font-mono text-xs uppercase tracking-[0.2em] text-bone font-bold">DRIVERS’ CHAMPIONSHIP</h3>
                  <span className="font-mono text-[11px] text-dim">{seriesDrivers.length} Drivers</span>
                </div>
                <div className="divide-y divide-line/60">
                  {seriesDrivers.map((d, idx) => {
                    const isGold = Boolean(d.isChampion);
                    return (
                      <button
                        key={d.id}
                        onClick={() => openDossierWithHash({ ...d, kind: 'driver' })}
                        className={`w-full px-5 py-3 flex items-center justify-between gap-3 text-left transition-colors ${
                          isGold ? 'bg-gold/15 hover:bg-gold/20' : 'hover:bg-void/60'
                        }`}
                      >
                        <div className="flex items-center gap-3 min-w-0">
                          <span className={`font-mono text-xs font-extrabold w-6 ${isGold ? 'text-gold' : 'text-dim'}`}>
                            {idx + 1}
                          </span>
                          <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ backgroundColor: isGold ? GOLD : d.color }}></span>
                          <div className="truncate">
                            <span className={`text-sm font-bold ${isGold ? 'text-gold' : 'text-bone'}`}>
                              {isGold ? '👑 ' : ''}{d.name}
                            </span>
                            <span className="font-mono text-[11px] text-dim ml-2">{d.team}</span>
                          </div>
                        </div>
                        <span className={`font-mono text-xs font-extrabold shrink-0 ${isGold ? 'text-gold' : 'text-bone'}`}>
                          {d.points} PTS
                        </span>
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="lg:col-span-5 rounded-2xl bg-panel border border-line overflow-hidden">
                <div className="px-5 py-3.5 border-b border-line flex items-center justify-between">
                  <h3 className="font-mono text-xs uppercase tracking-[0.2em] text-bone font-bold">CONSTRUCTORS’ CHAMPIONSHIP</h3>
                  <span className="font-mono text-[11px] text-dim">{seriesTeams.length} Teams</span>
                </div>
                <div className="divide-y divide-line/60">
                  {seriesTeams.map((t, idx) => {
                    const isGold = Boolean(t.isChampion);
                    return (
                      <button

      // =====================================================================

                  if (pinInput.trim() === ADMIN_PIN) {

                    setPinInput('');

                    notify('Invalid PIN');
                  }

                className="space-y-3"

            raceSummary={raceSummary}
            setRaceSummary={setRaceSummary}
            savedRaces={savedRaces}

            saveAllData={saveAllData}
            refreshFromCloud={refreshFromCloud}

            syncStatus={syncStatus}
            onLogout={() => { setIsAdmin(false); navigate({ view: 'home' }); }}

    function AdminCMSPanel({
      teams, setTeams,
      drivers, setDrivers,
      airliners, setAirliners,
      articles, setArticles,
      raceSummary, setRaceSummary,
      savedRaces, setSavedRaces,
      saveAllData, refreshFromCloud, notify,
      syncStatus, onLogout
    }) {
      const [tab, setTab] = useState('race');
      const [ghToken, setGhToken] = useState(() => getStoredGithubToken());
      const [showGhBox, setShowGhBox] = useState(false);

      // Article Form
      const [editingArticleId, setEditingArticleId] = useState(null);
      const [artSection, setArtSection] = useState('track');
      const [artBadge, setArtBadge] = useState('F1');
      const [artTag, setArtTag] = useState('AERODYNAMICS');
      const [artEpisodeCode, setArtEpisodeCode] = useState('BRIEFING 015');
      const [artReadTime, setArtReadTime] = useState('5 MIN READ');
      const [artTitle, setArtTitle] = useState('');
      const [artSummary, setArtSummary] = useState('');
      const [artBody, setArtBody] = useState('');

      // Driver Form
      const [editingDriverId, setEditingDriverId] = useState(null);
      const [drvSeries, setDrvSeries] = useState('F1');
      const [drvNum, setDrvNum] = useState('');
      const [drvCode, setDrvCode] = useState('');
      const [drvName, setDrvName] = useState('');
      const [drvNationality, setDrvNationality] = useState('');
      const [drvTeam, setDrvTeam] = useState('');
      const [drvColor, setDrvColor] = useState('#FF1E00');
      const [drvPoints, setDrvPoints] = useState('0');
      const [drvIsChamp, setDrvIsChamp] = useState(false);
      const [drvPoles, setDrvPoles] = useState('—');
      const [drvPodiums, setDrvPodiums] = useState('—');
      const [drvWins, setDrvWins] = useState('—');
      const [drvLast, setDrvLast] = useState('—');
      const [drvBio, setDrvBio] = useState('');

      // Team Form
      const [editingTeamId, setEditingTeamId] = useState(null);
      const [teamSeries, setTeamSeries] = useState('F1');
      const [teamCode, setTeamCode] = useState('');
      const [teamName, setTeamName] = useState('');
      const [teamChassis, setTeamChassis] = useState('');
      const [teamPU, setTeamPU] = useState('');
      const [teamBase, setTeamBase] = useState('');
      const [teamColor, setTeamColor] = useState('#FF8000');
      const [teamRank, setTeamRank] = useState('1');
      const [teamPoints, setTeamPoints] = useState('0');
      const [teamIsChamp, setTeamIsChamp] = useState(false);
      const [teamBio, setTeamBio] = useState('');

      // Airliner Form
      const [editingAirlinerId, setEditingAirlinerId] = useState(null);
      const [airMfg, setAirMfg] = useState('Airbus');
      const [airModel, setAirModel] = useState('');
      const [airCode, setAirCode] = useState('');
      const [airColor, setAirColor] = useState('#005EB8');
      const [airStatus, setAirStatus] = useState('IN SERVICE');
      const [airSpeed, setAirSpeed] = useState('Mach 0.85');
      const [airRange, setAirRange] = useState('');
      const [airEngines, setAirEngines] = useState('');
      const [airMtow, setAirMtow] = useState('250,000 kg');
      const [airCeiling, setAirCeiling] = useState('43,100 ft');
      const [airBio, setAirBio] = useState('');

      // Race Editor State
      const [editingRaceId, setEditingRaceId] = useState(null);
      const [raceName, setRaceName] = useState(raceSummary.raceName || '');
      const [raceShortTitle, setRaceShortTitle] = useState(raceSummary.shortTitle || 'Race');
      const [raceFlag, setRaceFlag] = useState(raceSummary.flag || '🏁');
      const [raceSeries, setRaceSeries] = useState(raceSummary.series || 'Formula 1');
      const [raceCircuit, setRaceCircuit] = useState(raceSummary.circuit || '');
      const [raceWeather, setRaceWeather] = useState(raceSummary.weather || 'Dry • 24°C');
      const [raceStatus, setRaceStatus] = useState(raceSummary.status || 'OFFICIAL CLASSIFICATION');
      const [raceFastest, setRaceFastest] = useState(raceSummary.fastestLap || '');
      const [raceDebrief, setRaceDebrief] = useState(raceSummary.debrief || '');
      const [displayOnTicker, setDisplayOnTicker] = useState(true);
      const [applyPointsToStandings, setApplyPointsToStandings] = useState(false);

      const [standingRows, setStandingRows] = useState(() =>
        (raceSummary.standings || []).map((r, i) => ({
          id: `st-${i}-${Date.now()}`,
          pos: r.pos || String(i + 1),
          name: r.name || '',
          code: r.code || '',
          team: r.team || '',
          color: r.color || '#FF1E00',
          interval: r.interval || (i === 0 ? 'WINNER' : '+0.000s'),
          tyresStr: Array.isArray(r.tires) ? r.tires.join(',') : 'M',
          pits: String(r.pits ?? 1),
          points: String(r.points ?? 0)
        }))
      );

      const [dnfRows, setDnfRows] = useState(() => (raceSummary.dnfs || []).map((d, i) => ({ id: `dnf-${i}`, ...d })));
      const [penRows, setPenRows] = useState(() => (raceSummary.penalties || []).map((p, i) => ({ id: `pen-${i}`, ...p })));
      const [flagRows, setFlagRows] = useState(() => (raceSummary.flags || []).map((f, i) => ({ id: `flg-${i}`, ...f })));

      useEffect(() => {
        if (!editingRaceId && raceSummary?.standings) {
          setRaceName(raceSummary.raceName || '');
          setRaceShortTitle(raceSummary.shortTitle || 'Race');
          setRaceFlag(raceSummary.flag || '🏁');
          setRaceSeries(raceSummary.series || 'Formula 1');
          setRaceCircuit(raceSummary.circuit || '');
          setRaceWeather(raceSummary.weather || '');
          setRaceStatus(raceSummary.status || 'OFFICIAL CLASSIFICATION');
          setRaceFastest(raceSummary.fastestLap || '');
          setRaceDebrief(raceSummary.debrief || '');
          setStandingRows(
            (raceSummary.standings || []).map((r, i) => ({
              id: `st-${i}-${Date.now()}`,
              pos: r.pos || String(i + 1),
              name: r.name || '',
              code: r.code || '',
              team: r.team || '',
              color: r.color || '#FF1E00',
              interval: r.interval || '',
              tyresStr: Array.isArray(r.tires) ? r.tires.join(',') : 'M',
              pits: String(r.pits ?? 1),
              points: String(r.points ?? 0)
            }))
          );
          setDnfRows((raceSummary.dnfs || []).map((d, i) => ({ id: `dnf-${i}`, ...d })));
          setPenRows((raceSummary.penalties || []).map((p, i) => ({ id: `pen-${i}`, ...p })));
          setFlagRows((raceSummary.flags || []).map((f, i) => ({ id: `flg-${i}`, ...f })));
        }
      }, [raceSummary]);

      const loadRaceIntoForm = (r) => {
        setEditingRaceId(r.id || null);
        setRaceName(r.raceName || '');
        setRaceShortTitle(r.shortTitle || 'Race');
        setRaceFlag(r.flag || '🏁');
        setRaceSeries(r.series || 'Formula 1');
        setRaceCircuit(r.circuit || '');
        setRaceWeather(r.weather || '');
        setRaceStatus(r.status || 'OFFICIAL CLASSIFICATION');
        setRaceFastest(r.fastestLap || '');
        setRaceDebrief(r.debrief || '');
        setDisplayOnTicker(r.activeOnTicker !== false);
        setStandingRows(
          (r.standings || []).map((row, i) => ({
            id: `st-${i}-${Date.now()}`,
            pos: row.pos || String(i + 1),
            name: row.name || '',
            code: row.code || '',
            team: row.team || '',
            color: row.color || '#FF1E00',
            interval: row.interval || '',
            tyresStr: Array.isArray(row.tires) ? row.tires.join(',') : 'M',
            pits: String(row.pits ?? 1),
            points: String(row.points ?? 0)
          }))
        );
        setDnfRows((r.dnfs || []).map((d, i) => ({ id: `dnf-${i}`, ...d })));
        setPenRows((r.penalties || []).map((p, i) => ({ id: `pen-${i}`, ...p })));
        setFlagRows((r.flags || []).map((f, i) => ({ id: `flg-${i}`, ...f })));
      };

      const handleUpdateStandingRow = (idx, field, val) => {
        setStandingRows(prev => prev.map((row, i) => {
          if (i !== idx) return row;
          const updated = { ...row, [field]: val };
          if (field === 'name') {
            const matched = drivers.find(d => d.name.toLowerCase() === val.trim().toLowerCase());
            if (matched) { updated.code = matched.code; updated.team = matched.team; updated.color = matched.color; }
          }
          if (field === 'code') {
            const matched = drivers.find(d => d.code.toLowerCase() === val.trim().toLowerCase());
            if (matched) { if (!updated.name) updated.name = matched.name; updated.team = matched.team; updated.color = matched.color; }
          }
          return updated;
        }));
      };

      const handleSaveRace = (e) => {
        e.preventDefault();
        const formattedStandings = standingRows
          .filter(r => r.name.trim() || r.code.trim())
          .map((r, i) => {
            const matched = drivers.find(d => d.code.toLowerCase() === r.code.trim().toLowerCase() || d.name.toLowerCase() === r.name.trim().toLowerCase());
            return {
              pos: r.pos.trim() || String(i + 1),
              code: (r.code.trim() || r.name.trim().slice(0, 3) || 'DRV').toUpperCase(),
              name: r.name.trim() || matched?.name || 'Driver',
              team: r.team.trim() || matched?.team || 'Constructor',
              color: r.color || matched?.color || '#FF1E00',
              interval: r.interval.trim() || (i === 0 ? 'WINNER' : '+0.000s'),
              tires: (r.tyresStr || 'M').split(',').map(t => t.trim().toUpperCase()).filter(Boolean),
              pits: Number(r.pits || 0),
              points: Number(r.points || 0)
            };
          });

        const formattedDnfs = dnfRows.filter(d => d.name.trim() || d.code.trim()).map(d => ({
          code: d.code.trim().toUpperCase() || 'DNF',
          name: d.name.trim() || 'Driver',
          status: d.status.trim() || 'DNF',
          lap: d.lap.trim() || 'Lap 1',
          reason: d.reason.trim()
        }));
        const formattedPens = penRows.filter(p => p.name.trim() || p.code.trim()).map(p => ({
          code: p.code.trim().toUpperCase() || 'PEN',
          name: p.name.trim() || 'Driver',
          penalty: p.penalty.trim() || '+5s Time Penalty',
          reason: p.reason.trim()
        }));
        const formattedFlags = flagRows.filter(f => f.type.trim() || f.note.trim()).map(f => ({
          type: f.type.trim().toUpperCase() || 'GREEN FLAG',
          lap: f.lap.trim() || 'Lap 1',
          note: f.note.trim()
        }));

        const raceRecord = {
          id: editingRaceId || `race-${Date.now()}`,
          raceName: raceName.trim() || 'Grand Prix Classification',
          shortTitle: raceShortTitle.trim() || 'Race',
          flag: raceFlag.trim() || '🏁',
          series: raceSeries,
          circuit: raceCircuit.trim(),
          date: new Date().toISOString().slice(0, 10),
          laps: raceSummary.laps || 'Official Race Distance',
          weather: raceWeather.trim() || 'Dry • 24°C',
          status: raceStatus,
          fastestLap: raceFastest.trim(),
          debrief: raceDebrief.trim(),
          activeOnTicker: displayOnTicker,
          standings: formattedStandings,
          dnfs: formattedDnfs,
          penalties: formattedPens,
          flags: formattedFlags
        };

        const nextSaved = editingRaceId
          ? savedRaces.map(item => (item.id === editingRaceId ? raceRecord : (displayOnTicker ? { ...item, activeOnTicker: false } : item)))
          : [raceRecord, ...savedRaces.map(item => (displayOnTicker ? { ...item, activeOnTicker: false } : item))];

        const nextActiveRace = displayOnTicker ? raceRecord : raceSummary;
        setSavedRaces(nextSaved);
        setRaceSummary(nextActiveRace);

        let nextDrivers = drivers;
        let nextTeams = teams;
        if (applyPointsToStandings) {
          const seriesCode = raceSeries.includes('2') ? 'F2' : raceSeries.includes('E') ? 'FE' : 'F1';
          nextDrivers = drivers.map(d => {
            if (d.series !== seriesCode) return d;
            const res = formattedStandings.find(s => s.code === d.code);
            return res ? { ...d, points: Number(d.points || 0) + Number(res.points || 0) } : d;
          });
          nextTeams = teams.map(t => {
            if (t.series !== seriesCode) return t;
            const teamPts = formattedStandings
              .filter(s => s.team.toLowerCase().includes(t.name.toLowerCase()) || t.name.toLowerCase().includes(s.team.toLowerCase()))
              .reduce((acc, s) => acc + Number(s.points || 0), 0);
            return teamPts ? { ...t, points: Number(t.points || 0) + teamPts } : t;
          });
          setDrivers(nextDrivers);
          setTeams(nextTeams);
        }

        saveAllData(nextTeams, nextDrivers, airliners, articles, nextActiveRace, nextSaved);
      };

      return (
        <div className="space-y-8">
          <div className="border-b border-line pb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <div className="font-mono text-xs uppercase tracking-[0.2em] text-crimson">MACH1 STUDIO // GLOBAL CLOUD CMS</div>
              <h1 className="font-syne text-3xl font-extrabold text-bone mt-1">Editorial, Standings & Race Control</h1>
            </div>
            <div className="flex flex-wrap gap-2">
              <button onClick={() => refreshFromCloud(false)} className="px-3.5 py-2 rounded-xl bg-panel border border-line hover:border-bone font-mono text-xs text-bone">↻ Pull Cloud</button>
              <button onClick={() => setShowGhBox(prev => !prev)} className="px-3.5 py-2 rounded-xl bg-panel border border-ember/60 font-mono text-xs text-ember">
                {syncStatus === 'synced' ? '● GitHub Synced' : '+ Connect GitHub Sync'}
              </button>
              <button onClick={onLogout} className="px-3.5 py-2 rounded-xl bg-panel border border-crimson/60 font-mono text-xs text-bone">Lock Studio</button>
            </div>
          </div>

          {showGhBox && (
            <div className="p-5 rounded-2xl bg-panel border border-ember/50 space-y-3">
              <div className="font-mono text-xs font-bold uppercase text-ember">DIRECT GITHUB REPOSITORY SYNC ({GH_OWNER}/{GH_REPO} → {GH_FILE})</div>
              <p className="text-xs text-dim">Paste your GitHub Personal Access Token (<code className="text-bone">repo</code> scope) so every Race Result, Briefing, Standings update, and Cube syncs globally across all devices.</p>
              <div className="flex flex-col sm:flex-row gap-2">
                <input type="password" value={ghToken} onChange={e => setGhToken(e.target.value)} placeholder="ghp_..." className="flex-1 px-3.5 py-2 rounded-xl bg-void border border-line font-mono text-xs text-bone" />
                <button
                  onClick={() => {
                    try { localStorage.setItem(GH_TOKEN_KEY, ghToken.trim()); } catch (e) {}
                    saveAllData(teams, drivers, airliners, articles, raceSummary, savedRaces);
                    setShowGhBox(false);
                  }}
                  className="px-4 py-2 rounded-xl bg-ember text-void font-mono text-xs font-bold uppercase"
                >
                  Save Token & Sync Now
                </button>
              </div>
            </div>
          )}

          {/* CMS Tabs */}
          <div className="flex flex-wrap gap-2 border-b border-line pb-4">
            {[
              { id: 'race', label: 'Race Results & Top Bar' },
              { id: 'articles', label: `Briefings & Articles (${articles.length})` },
              { id: 'drivers', label: `Drivers & WDC Gold (${drivers.length})` },
              { id: 'teams', label: `Constructors & WCC Gold (${teams.length})` },
              { id: 'airliners', label: `Airliners (${airliners.length})` }
            ].map(t => (
              <button
                key={t.id}
                onClick={() => setTab(t.id)}
                className={`px-4 py-2 rounded-xl font-mono text-xs uppercase border ${
                  tab === t.id ? 'bg-gradient-to-r from-crimson/20 to-ember/15 border-crimson text-bone font-bold' : 'bg-panel border-line text-dim hover:text-bone'
                }`}
              >
                {t.label}
              </button>
            ))}
          </div>

          {tab === 'race' && (
            <div className="grid grid-cols-1 xl:grid-cols-3 gap-6 items-start">
              <form onSubmit={handleSaveRace} className="xl:col-span-2 p-6 rounded-2xl bg-panel border border-line space-y-6">
                <div className="flex flex-wrap items-center justify-between gap-3">
                  <h2 className="text-xl font-bold text-bone">{editingRaceId ? 'Edit Race Classification & Top Bar' : 'Post Race Classification & Top Bar'}</h2>
                  {editingRaceId && (
                    <button type="button" onClick={() => { setEditingRaceId(null); setRaceName(''); setRaceShortTitle('Race'); }} className="font-mono text-xs text-dim hover:text-bone">+ New Race Entry</button>
                  )}
                </div>

                <datalist id="mach1-drivers-datalist">
                  {drivers.map(d => <option key={d.id} value={d.name}>{d.series} • #{d.number} {d.team}</option>)}
                </datalist>

                <div className="grid grid-cols-1 md:grid-cols-12 gap-4">
                  <div className="md:col-span-7 space-y-1.5">
                    <label className="font-mono text-[10px] uppercase tracking-wider text-dim">FULL RACE NAME *</label>
                    <input type="text" value={raceName} onChange={e => setRaceName(e.target.value)} placeholder="e.g. Miami Grand Prix" className="w-full px-3.5 py-2.5 rounded-xl bg-void border border-line text-xs text-bone" />
                  </div>
                  <div className="md:col-span-5 space-y-1.5">
                    <label className="font-mono text-[10px] uppercase tracking-wider text-dim">TOP BAR SHORT TITLE & FLAG</label>
                    <div className="flex gap-2">
                      <input type="text" value={raceFlag} onChange={e => setRaceFlag(e.target.value)} placeholder="🏁" className="w-14 text-center px-2 py-2.5 rounded-xl bg-void border border-line text-sm text-bone" />
                      <input type="text" value={raceShortTitle} onChange={e => setRaceShortTitle(e.target.value)} placeholder="Miami GP" className="flex-1 px-3.5 py-2.5 rounded-xl bg-void border border-line text-xs text-bone" />
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                  <div className="space-y-1.5">
                    <label className="font-mono text-[10px] uppercase tracking-wider text-dim">SERIES</label>
                    <select value={raceSeries} onChange={e => setRaceSeries(e.target.value)} className="w-full px-3 py-2.5 rounded-xl bg-void border border-line text-xs text-bone">
                      <option value="Formula 1">Formula 1</option>
                      <option value="Formula 2">Formula 2</option>
                      <option value="Formula E">Formula E</option>
                    </select>
                  </div>
                  <div className="space-y-1.5">
                    <label className="font-mono text-[10px] uppercase tracking-wider text-dim">CIRCUIT</label>
                    <input type="text" value={raceCircuit} onChange={e => setRaceCircuit(e.target.value)} placeholder="Circuit Name" className="w-full px-3 py-2.5 rounded-xl bg-void border border-line text-xs text-bone" />
                  </div>
                  <div className="space-y-1.5">
                    <label className="font-mono text-[10px] uppercase tracking-wider text-dim">WEATHER / TRACK TEMP</label>
                    <input type="text" value={raceWeather} onChange={e => setRaceWeather(e.target.value)} placeholder="Dry • 24°C" className="w-full px-3 py-2.5 rounded-xl bg-void border border-line text-xs text-bone" />
                  </div>
                  <div className="space-y-1.5">
                    <label className="font-mono text-[10px] uppercase tracking-wider text-dim">RACE STATUS</label>
                    <select value={raceStatus} onChange={e => setRaceStatus(e.target.value)} className="w-full px-3 py-2.5 rounded-xl bg-void border border-line font-mono text-[11px] text-bone">
                      <option value="OFFICIAL CLASSIFICATION">OFFICIAL CLASSIFICATION</option>
                      <option value="PROVISIONAL">PROVISIONAL</option>
                      <option value="LIVE TELEMETRY">LIVE TELEMETRY</option>
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
                  <div className="md:col-span-6 space-y-1.5">
                    <label className="font-mono text-[10px] uppercase tracking-wider text-dim">FASTEST LAP</label>
                    <input type="text" value={raceFastest} onChange={e => setRaceFastest(e.target.value)} placeholder="e.g. Lando Norris — 1:29.708 (Lap 44)" className="w-full px-3.5 py-2.5 rounded-xl bg-void border border-line text-xs text-bone" />
                  </div>
                  <div className="md:col-span-6 space-y-1.5 pb-1">
                    <label className="flex items-center gap-2.5 cursor-pointer select-none">
                      <input type="checkbox" checked={displayOnTicker} onChange={e => setDisplayOnTicker(e.target.checked)} className="w-4 h-4 accent-crimson" />
                      <span className="font-mono text-xs text-bone">Display on Top Scrolling Broadcast Ticker</span>
                    </label>
                    <label className="flex items-center gap-2.5 cursor-pointer select-none">
                      <input type="checkbox" checked={applyPointsToStandings} onChange={e => setApplyPointsToStandings(e.target.checked)} className="w-4 h-4 accent-gold" />
                      <span className="font-mono text-xs text-gold">Add Race Points to WDC / WCC Standings</span>
                    </label>
                  </div>
                </div>

                <div className="space-y-3 pt-2 border-t border-line">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <label className="font-mono text-[10px] uppercase tracking-wider text-dim">FINISHING ORDER, INTERVALS, TYRES & PIT STOPS</label>
                    <button
                      type="button"
                      onClick={() => setStandingRows(prev => [...prev, { id: `st-${Date.now()}`, pos: String(prev.length + 1), name: '', code: '', team: '', color: '#FF1E00', interval: '+0.000s', tyresStr: 'M,H', pits: '1', points: '0' }])}
                      className="px-3 py-1.5 rounded-xl bg-void border border-ember/60 font-mono text-[11px] text-ember font-bold"
                    >
                      + Add Position Row
                    </button>
                  </div>
                  <div className="space-y-2 max-h-96 overflow-y-auto pr-1">
                    {standingRows.map((row, idx) => (
                      <div key={row.id} className="p-2.5 rounded-xl bg-void border border-line grid grid-cols-12 gap-2 items-center">
                        <input type="text" value={row.pos} onChange={e => handleUpdateStandingRow(idx, 'pos', e.target.value)} placeholder="1" className="col-span-2 sm:col-span-1 text-center px-1.5 py-2 rounded-lg bg-panel border border-line font-mono text-xs font-bold text-crimson" />
                        <input type="text" list="mach1-drivers-datalist" value={row.name} onChange={e => handleUpdateStandingRow(idx, 'name', e.target.value)} placeholder="Driver Name" className="col-span-6 sm:col-span-3 px-2.5 py-2 rounded-lg bg-panel border border-line text-xs text-bone" />
                        <input type="text" value={row.code} onChange={e => handleUpdateStandingRow(idx, 'code', e.target.value)} placeholder="VER" className="col-span-4 sm:col-span-1 text-center px-1.5 py-2 rounded-lg bg-panel border border-line font-mono text-xs uppercase text-bone" />
                        <input type="text" value={row.team} onChange={e => handleUpdateStandingRow(idx, 'team', e.target.value)} placeholder="Team" className="col-span-6 sm:col-span-2 px-2.5 py-2 rounded-lg bg-panel border border-line text-xs text-dim" />
                        <input type="text" value={row.interval} onChange={e => handleUpdateStandingRow(idx, 'interval', e.target.value)} placeholder="+4.210s" className="col-span-6 sm:col-span-2 px-2.5 py-2 rounded-lg bg-panel border border-line font-mono text-xs text-bone" />
                        <input type="text" value={row.tyresStr} onChange={e => handleUpdateStandingRow(idx, 'tyresStr', e.target.value)} placeholder="M,H" className="col-span-4 sm:col-span-1 text-center px-1.5 py-2 rounded-lg bg-panel border border-line font-mono text-xs uppercase text-ember font-bold" />

                          const next = drivers.filter(item => item.id !== dr.id);
                          setDrivers(next);
                          saveAllData(teams, next, airliners, articles, raceSummary, savedRaces);
                        }}
                        className="font-mono text-[10px] text-crimson hover:underline"
                      >
                        Del
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {tab === 'teams' && (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  if (!teamName.trim()) return;
                  const record = {
                    id: editingTeamId || 't-' + Date.now(),
                    series: teamSeries,
                    code: (teamCode || teamName.slice(0, 3)).toUpperCase(),
                    name: teamName.trim(),
                    chassis: teamChassis.trim() || '2026 Spec',
                    powerUnit: teamPU.trim() || 'Works Hybrid',
                    base: teamBase.trim() || 'HQ',
                    color: teamColor,
                    rank: Number(teamRank || 1),
                    points: Number(teamPoints || 0),
                    isChampion: teamIsChamp,
                    bio: teamBio.trim() || `${teamName.trim()} competing in ${teamSeries}.`
                  };
                  const next = editingTeamId
                    ? teams.map(t => (t.id === editingTeamId ? record : (teamIsChamp && t.series === teamSeries ? { ...t, isChampion: false } : t)))
                    : [...teams.map(t => (teamIsChamp && t.series === teamSeries ? { ...t, isChampion: false } : t)), record];
                  setTeams(next);
                  saveAllData(next, drivers, airliners, articles, raceSummary, savedRaces);
                  setEditingTeamId(null);
                  setTeamName('');
                  setTeamBio('');
                }}
                className="lg:col-span-2 p-6 rounded-2xl bg-panel border border-line space-y-4"
              >
                <div className="flex items-center justify-between">
                  <h2 className="text-lg font-bold text-bone">{editingTeamId ? `Edit Team: ${teamName}` : '+ Add Constructor Cube'}</h2>
                  {editingTeamId && <button type="button" onClick={() => { setEditingTeamId(null); setTeamName(''); }} className="font-mono text-xs text-dim hover:text-bone">Cancel</button>}
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <select value={teamSeries} onChange={e => setTeamSeries(e.target.value)} className="px-3 py-2 rounded-xl bg-void border border-line text-xs text-bone"><option value="F1">F1</option><option value="F2">F2</option><option value="FE">FE</option></select>
                  <input type="text" value={teamCode} onChange={e => setTeamCode(e.target.value)} placeholder="Code (MCL)" className="px-3 py-2 rounded-xl bg-void border border-line text-xs text-bone" />
                  <input type="text" value={teamName} onChange={e => setTeamName(e.target.value)} placeholder="Full Team Name" className="px-3 py-2 rounded-xl bg-void border border-line text-xs text-bone" />
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <input type="text" value={teamChassis} onChange={e => setTeamChassis(e.target.value)} placeholder="Chassis" className="px-3 py-2 rounded-xl bg-void border border-line text-xs text-bone" />
                  <input type="text" value={teamPU} onChange={e => setTeamPU(e.target.value)} placeholder="Power Unit" className="px-3 py-2 rounded-xl bg-void border border-line text-xs text-bone" />
                  <input type="text" value={teamBase} onChange={e => setTeamBase(e.target.value)} placeholder="Base" className="px-3 py-2 rounded-xl bg-void border border-line text-xs text-bone" />
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 items-center">
                  <div className="flex items-center gap-2"><input type="color" value={teamColor} onChange={e => setTeamColor(e.target.value)} className="h-9 w-12 rounded bg-void border border-line" /><input type="text" value={teamColor} onChange={e => setTeamColor(e.target.value)} className="flex-1 px-3 py-2 rounded-xl bg-void border border-line font-mono text-xs text-bone" /></div>
                  <input type="number" value={teamRank} onChange={e => setTeamRank(e.target.value)} placeholder="Rank" className="px-3 py-2 rounded-xl bg-void border border-line font-mono text-xs text-bone" />
                  <input type="number" value={teamPoints} onChange={e => setTeamPoints(e.target.value)} placeholder="Points" className="px-3 py-2 rounded-xl bg-void border border-line font-mono text-xs text-bone" />
                </div>
                <label className="inline-flex items-center gap-2.5 px-3.5 py-2 rounded-xl bg-gold/10 border border-gold/50 cursor-pointer">
                  <input type="checkbox" checked={teamIsChamp} onChange={e => setTeamIsChamp(e.target.checked)} className="accent-gold" />
                  <span className="font-mono text-xs font-bold text-gold">👑 Reigning World Constructors’ Champion (Gold Card & Crown)</span>
                </label>
                <textarea rows={2} value={teamBio} onChange={e => setTeamBio(e.target.value)} placeholder="Constructor Technical Profile..." className="w-full p-3 rounded-xl bg-void border border-line text-xs text-bone" />
                <button type="submit" className="px-5 py-2.5 rounded-xl bg-crimson text-white font-mono text-xs font-bold uppercase">{editingTeamId ? 'Save Team' : 'Add Team'}</button>
              </form>

              <div className="p-6 rounded-2xl bg-panel border border-line space-y-2.5 max-h-[34rem] overflow-y-auto">
                <h3 className="font-mono text-xs uppercase text-dim">CONSTRUCTORS & WCC GOLD ({teams.length})</h3>
                {[...teams].sort((a, b) => Number(a.rank || 99) - Number(b.rank || 99)).map(tm => (
                  <div key={tm.id} className={`p-2.5 rounded-xl bg-void border flex items-center justify-between gap-2 ${tm.isChampion ? 'border-gold' : 'border-line'}`}>
                    <div className="min-w-0">
                      <div className="font-mono text-[10px]" style={{ color: tm.isChampion ? GOLD : tm.color }}>{tm.series} • P{tm.rank} • {tm.points} PTS</div>
                      <div className={`text-xs font-semibold truncate ${tm.isChampion ? 'text-gold' : 'text-bone'}`}>{tm.isChampion ? '👑 ' : ''}{tm.name}</div>
                    </div>
                    <div className="flex items-center gap-2 shrink-0">
                      <button
                        onClick={() => {
                          const next = teams.map(item => (item.series === tm.series ? { ...item, isChampion: item.id === tm.id ? !item.isChampion : false } : item));
                          setTeams(next);
                          saveAllData(next, drivers, airliners, articles, raceSummary, savedRaces);
                        }}
                        className="font-mono text-[11px] text-gold"
                      >
                        👑
                      </button>
                      <button
                        onClick={() => {
                          setEditingTeamId(tm.id); setTeamSeries(tm.series); setTeamCode(tm.code); setTeamName(tm.name); setTeamChassis(tm.chassis);
                          setTeamPU(tm.powerUnit); setTeamBase(tm.base); setTeamColor(tm.color); setTeamRank(String(tm.rank)); setTeamPoints(String(tm.points));
                          setTeamIsChamp(Boolean(tm.isChampion)); setTeamBio(tm.bio || '');
                        }}
                        className="font-mono text-[10px] text-ember hover:underline"
                      >
                        Edit
                      </button>
                      <button
                        onClick={() => {
                          const next = teams.filter(item => item.id !== tm.id);
                          setTeams(next);
                          saveAllData(next, drivers, airliners, articles, raceSummary, savedRaces);
                        }}
                        className="font-mono text-[10px] text-crimson hover:underline"
                      >
                        Del
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {tab === 'airliners' && (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  if (!airModel.trim()) return;
                  const record = {
                    id: editingAirlinerId || 'air-' + Date.now(),
                    manufacturer: airMfg.trim() || 'Airbus',
                    model: airModel.trim(),
                    code: (airCode || 'ACFT').toUpperCase(),
                    color: airColor,
                    engines: airEngines.trim() || 'High-Bypass Twin Turbofan',
                    cruiseSpeed: airSpeed.trim() || 'Mach 0.85',
                    range: airRange.trim() || '12,000 km',
                    mtow: airMtow.trim() || '250,000 kg',
                    ceiling: airCeiling.trim() || '43,100 ft',
                    status: airStatus.trim() || 'IN SERVICE',
                    bio: airBio.trim() || `${airMfg} ${airModel}.`
                  };
                  const next = editingAirlinerId ? airliners.map(a => (a.id === editingAirlinerId ? record : a)) : [...airliners, record];
                  setAirliners(next);
                  saveAllData(teams, drivers, next, articles, raceSummary, savedRaces);
                  setEditingAirlinerId(null);
                  setAirModel('');
                  setAirBio('');
                }}
                className="lg:col-span-2 p-6 rounded-2xl bg-panel border border-line space-y-4"
              >
                <h2 className="text-lg font-bold text-bone">{editingAirlinerId ? `Edit Airliner: ${airModel}` : '+ Add Airliner Cube'}</h2>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <input type="text" value={airMfg} onChange={e => setAirMfg(e.target.value)} placeholder="Manufacturer" className="px-3 py-2 rounded-xl bg-void border border-line text-xs text-bone" />
                  <input type="text" value={airModel} onChange={e => setAirModel(e.target.value)} placeholder="Aircraft Model" className="px-3 py-2 rounded-xl bg-void border border-line text-xs text-bone" />
                  <input type="text" value={airCode} onChange={e => setAirCode(e.target.value)} placeholder="ICAO Code" className="px-3 py-2 rounded-xl bg-void border border-line text-xs text-bone" />
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <input type="text" value={airSpeed} onChange={e => setAirSpeed(e.target.value)} placeholder="Cruise Speed" className="px-3 py-2 rounded-xl bg-void border border-line text-xs text-bone" />
                  <input type="text" value={airRange} onChange={e => setAirRange(e.target.value)} placeholder="Range" className="px-3 py-2 rounded-xl bg-void border border-line text-xs text-bone" />
                  <input type="text" value={airEngines} onChange={e => setAirEngines(e.target.value)} placeholder="Engines" className="px-3 py-2 rounded-xl bg-void border border-line text-xs text-bone" />
                </div>
                <textarea rows={2} value={airBio} onChange={e => setAirBio(e.target.value)} placeholder="Technical Overview..." className="w-full p-3 rounded-xl bg-void border border-line text-xs text-bone" />
                <button type="submit" className="px-5 py-2.5 rounded-xl bg-ember text-void font-mono text-xs font-bold uppercase">{editingAirlinerId ? 'Save Airliner' : 'Add Airliner'}</button>
              </form>

              <div className="p-6 rounded-2xl bg-panel border border-line space-y-2.5 max-h-[34rem] overflow-y-auto">
                <h3 className="font-mono text-xs uppercase text-dim">AIRLINERS ({airliners.length})</h3>
                {airliners.map(ac => (
                  <div key={ac.id} className="p-2.5 rounded-xl bg-void border border-line flex items-center justify-between gap-2">
                    <div className="min-w-0">
                      <div className="font-mono text-[10px]" style={{ color: ac.color }}>{ac.manufacturer} • {ac.code}</div>
                      <div className="text-xs font-semibold text-bone truncate">{ac.model}</div>
                    </div>
                    <div className="flex items-center gap-2 shrink-0">
                      <button
                        onClick={() => {
                          setEditingAirlinerId(ac.id); setAirMfg(ac.manufacturer); setAirModel(ac.model); setAirCode(ac.code);
                          setAirColor(ac.color); setAirStatus(ac.status); setAirSpeed(ac.cruiseSpeed); setAirRange(ac.range);
                          setAirEngines(ac.engines); setAirMtow(ac.mtow); setAirCeiling(ac.ceiling); setAirBio(ac.bio || '');
                        }}
                        className="font-mono text-[10px] text-ember hover:underline"
                      >
                        Edit
                      </button>
                      <button
                        onClick={() => {
                          const next = airliners.filter(item => item.id !== ac.id);
                          setAirliners(next);
                          saveAllData(teams, drivers, next, articles, raceSummary, savedRaces);
                        }}
                        className="font-mono text-[10px] text-crimson hover:underline"
                      >
                        Del
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Mach1App />);
  </script>
</body>
</html>
