    }

    html.light-theme {
      --bg-carbon: #F4F4F6;
      --bg-charcoal: #FFFFFF;
      --border-graphite: #D6D8DF;
      --text-steel: #585D68;
      --text-offwhite: #121316;
      --grid-line: rgba(10, 10, 12, 0.055);
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-carbon);
      color: var(--text-offwhite);
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .engineering-grid {
      background-size: 44px 44px;
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
    }

    /* Telemetry Pulse Streaks aligned with the 44px grid */
    @keyframes pulseHorizontal {
      0% { transform: translateX(-180px); opacity: 0; }
      15% { opacity: 0.75; }
      85% { opacity: 0.75; }
      100% { transform: translateX(calc(100vw + 180px)); opacity: 0; }
    }

    @keyframes pulseVertical {
      0% { transform: translateY(-180px); opacity: 0; }
      15% { opacity: 0.65; }
      85% { opacity: 0.65; }
      100% { transform: translateY(calc(100vh + 180px)); opacity: 0; }
    }

    .telemetry-h-scarlet {
      position: fixed;
      height: 1px;
      width: 140px;
      background: linear-gradient(90deg, transparent, #E10600, transparent);
      animation: pulseHorizontal 8s linear infinite;
      pointer-events: none;
    }

    .telemetry-h-papaya {
      position: fixed;
      height: 1px;
      width: 160px;
      background: linear-gradient(90deg, transparent, #FF6B00, transparent);
      animation: pulseHorizontal 9.5s linear infinite;
      pointer-events: none;
    }

    .telemetry-v-scarlet {
      position: fixed;
      width: 1px;
      height: 140px;
      background: linear-gradient(180deg, transparent, #E10600, transparent);
      animation: pulseVertical 9s linear infinite;
      pointer-events: none;
    }

    .telemetry-v-papaya {
      position: fixed;
      width: 1px;
      height: 150px;
      background: linear-gradient(180deg, transparent, #FF6B00, transparent);
      animation: pulseVertical 10.5s linear infinite;
      pointer-events: none;
    }

    /* Opening Motion Intro Animations — Clean Telemetry Horizon Reveal */
    @keyframes scanScarlet {
      0% { transform: scaleX(0); opacity: 0; }
      35% { transform: scaleX(1); opacity: 1; }
      75% { transform: scaleX(1); opacity: 0.35; }
      100% { transform: scaleX(1); opacity: 0; }
    }

    @keyframes scanPapaya {
      0% { transform: scaleX(0); opacity: 0; }
      40% { transform: scaleX(1); opacity: 1; }
      75% { transform: scaleX(1); opacity: 0.35; }
      100% { transform: scaleX(1); opacity: 0; }
    }

    @keyframes cleanLogoReveal {
      0% { opacity: 0; transform: translateY(10px) scale(0.96); }
      22% { opacity: 1; transform: translateY(0) scale(1); }
      82% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-6px) scale(0.99); }
    }

    @keyframes introFadeOut {
      0%, 84% { opacity: 1; }
      100% { opacity: 0; }
    }

    .animate-scan-scarlet {
      transform-origin: left center;
      animation: scanScarlet 1.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .animate-scan-papaya {
      transform-origin: right center;
      animation: scanPapaya 1.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .animate-badge-reveal {
      animation: cleanLogoReveal 1.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

      animation: introFadeOut 1.95s ease-out forwards;

    // =========================================================================
    // 1. PERSISTENT RELATIONAL STORAGE & DIRECT GITHUB CLOUD SYNC ENGINE
    // =========================================================================
    const STORAGE_KEY = 'mach1_intelligence_db_v5';
    const GITHUB_TOKEN_KEY = 'mach1_github_pat_v1';
    const ADMIN_PIN = '2026';

    // Public GitHub Repository Target (Visitors read data.json automatically; Admin commits via token)
    const GITHUB_REPO_OWNER = 'airspacehead16-web';
    const GITHUB_REPO_NAME = 'Mach1';
    const GITHUB_BRANCH = 'main';
    const GITHUB_DATA_FILE = 'data.json';

    const getStoredGithubToken = () => {
      try {
        return localStorage.getItem(GITHUB_TOKEN_KEY) || '';
      } catch (e) {
        return '';
      }
    };

    const encodeUTF8Base64 = (str) => {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      bytes.forEach(b => { bin += String.fromCharCode(b); });
      return btoa(bin);
    };

    const decodeUTF8Base64 = (b64) => {
      const bin = atob(b64.replace(/\n/g, ''));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    };

    // Fetch public data.json from GitHub so all visitors worldwide see live updates
    const fetchPublicGithubData = async () => {
      try {
        const rawUrl = `https://raw.githubusercontent.com/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/${GITHUB_BRANCH}/${GITHUB_DATA_FILE}?t=${Date.now()}`;
        const res = await fetch(rawUrl, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data && typeof data === 'object') return data;
        }
      } catch (e) {}

      // Fallback to GitHub Contents API if raw CDN hasn't propagated yet
      try {
        const apiUrl = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/contents/${GITHUB_DATA_FILE}?ref=${GITHUB_BRANCH}&t=${Date.now()}`;
        const headers = { Accept: 'application/vnd.github+json' };
        const token = getStoredGithubToken();
        if (token) headers.Authorization = `Bearer ${token}`;
        const res = await fetch(apiUrl, { headers, cache: 'no-store' });
        if (res.ok) {
          const json = await res.json();
          if (json && json.content) {
            return JSON.parse(decodeUTF8Base64(json.content));
          }
        }
      } catch (e) {}
      return null;
    };

    // Commit data.json directly to GitHub when Admin saves changes
    const pushToGithubRepo = async (payloadObj) => {
      const token = getStoredGithubToken();
      if (!token) return { ok: false, noToken: true };

      const apiUrl = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/contents/${GITHUB_DATA_FILE}`;
      const headers = {
        Authorization: `Bearer ${token}`,
        Accept: 'application/vnd.github+json',
        'Content-Type': 'application/json'
      };

      try {
        let existingSha = null;
        const getRes = await fetch(`${apiUrl}?ref=${GITHUB_BRANCH}&t=${Date.now()}`, { headers, cache: 'no-store' });
        if (getRes.ok) {
          const existingJson = await getRes.json();
          existingSha = existingJson.sha || null;
        }

        const body = {
          message: `MACH1 CMS: Update live intelligence & race data (${new Date().toISOString()})`,
          content: encodeUTF8Base64(JSON.stringify(payloadObj, null, 2)),
          branch: GITHUB_BRANCH
        };
        if (existingSha) body.sha = existingSha;

        const putRes = await fetch(apiUrl, {
          method: 'PUT',
          headers,
          body: JSON.stringify(body)
        });

        if (!putRes.ok) {
          const errData = await putRes.json().catch(() => ({}));
          return { ok: false, error: errData.message || `GitHub API Error (${putRes.status})` };
        }
        return { ok: true };
      } catch (e) {
        return { ok: false, error: e?.message || 'Network error pushing to GitHub' };
      }
    };

    const persistDatabase = async (nextEntities, nextArticles, nextWeeklyLogs, nextRaceResults = [], onCloudStatus = null) => {
      const payload = {
        entities: nextEntities,
        articles: nextArticles,
        weeklyLogs: nextWeeklyLogs,
        raceResults: nextRaceResults,
        updatedAt: Date.now()
      };

      let localSaved = false;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        localSaved = true;
      } catch (e) {
        localSaved = false;
      }

      if (getStoredGithubToken()) {
        const res = await pushToGithubRepo(payload);
        if (onCloudStatus) {
          onCloudStatus(res);
        }
      }

      return localSaved;
    };

    // =========================================================================
    const getDriverTriCode = (name = '') => {
      const parts = name.trim().split(/\s+/);
      const last = parts[parts.length - 1] || name;
      return last.replace(/[^a-zA-Z]/g, '').slice(0, 3).toUpperCase() || 'DRV';
    };

    const getTireMeta = (compound = 'M') => {
      const c = (compound || 'M').trim().toUpperCase().charAt(0);
      if (c === 'S') return { letter: 'S', label: 'SOFT', color: '#E10600' };
      if (c === 'H') return { letter: 'H', label: 'HARD', color: '#EAEAEA' };
      if (c === 'I') return { letter: 'I', label: 'INTER', color: '#22C55E' };
      if (c === 'W') return { letter: 'W', label: 'WET', color: '#3B82F6' };
      return { letter: 'M', label: 'MEDIUM', color: '#FACC15' };
    };

    function RaceResultsTicker({ activeRace, entities, navigate }) {
      if (!activeRace || !Array.isArray(activeRace.standings) || activeRace.standings.length === 0) {
        return null;
      }

      const items = activeRace.standings.map((row, idx) => {
        const matchedEnt = entities.find(
          e => e.type === 'driver' && e.name.toLowerCase() === (row.driver || '').toLowerCase()
        );
        return {
          ...row,
          posLabel: row.pos || `${idx + 1}`,
          triCode: row.code || getDriverTriCode(row.driver),
          color: row.color || matchedEnt?.primaryColor || '#E10600',
          number: matchedEnt?.number || ''
        };
      });

      const trackStrip = [...items, ...items];

      return (
        <div className="sticky top-14 lg:top-0 z-30 bg-[#08080A] border-b border-graphite h-16 flex items-center overflow-hidden">
          {/* Left Pinned Broadcast "Race > Results" Card */}

            onClick={() => navigate({ view: 'races', raceId: activeRace.id })}
            className="shrink-0 h-full px-3.5 sm:px-4 bg-[#141519] hover:bg-[#1C1E24] border-r border-graphite flex flex-col justify-center text-left transition-colors z-10"
            title="Click to open full Race Summary, Penalties, DNF/DNS & Tyres"
          >
            <div className="flex items-center gap-1.5 text-xs sm:text-sm font-bold text-offwhite leading-none">
              <span className="text-sm">{activeRace.flag || '🏁'}</span>
              <span className="truncate max-w-[115px] sm:max-w-[145px]">
                {activeRace.shortTitle || 'Race'}
              </span>
              <span className="text-steel font-mono text-xs">›</span>
            </div>
            <div className="flex items-center gap-1.5 font-mono text-[11px] text-steel mt-1.5 leading-none">
              <span className="text-scarlet">⚑</span>
              <span>Results</span>
            </div>
          </button>

          {/* Scrolling Broadcast Circular Driver Badges */}
          <div className="flex-1 overflow-hidden">
            <div className="animate-race-ticker flex items-center gap-5 px-5 py-1.5">
              {trackStrip.map((row, i) => (
                <button
                  key={`${row.posLabel}-${row.triCode}-${i}`}
                  onClick={() => navigate({ view: 'races', raceId: activeRace.id })}
                  className="group flex flex-col items-center justify-center shrink-0 focus:outline-none"
                >
                  <div
                    style={{
                      borderColor: row.color,
                      background: `radial-gradient(circle at 50% 35%, ${row.color}38 0%, #141519 78%)`
                    }}
                    className="w-9 h-9 rounded-full border-2 flex items-center justify-center font-mono text-[11px] font-bold text-offwhite group-hover:scale-105 transition-transform"
                  >
                    {row.number ? `#${row.number}` : row.triCode}
                  </div>
                  <div className="mt-1 font-mono text-[11px] font-bold tracking-tight leading-none whitespace-nowrap">
                    <span className={String(row.posLabel).toUpperCase() === 'NC' || String(row.posLabel).toUpperCase() === 'DNF' ? 'text-scarlet' : 'text-steel'}>
                      {row.posLabel}{' '}
                    </span>
                    <span className="text-offwhite">{row.triCode}</span>
                  </div>
                </button>
              ))}
            </div>
          </div>
        </div>
      );

    function SearchModal({ isOpen, onClose, entities, articles, navigate }) {
      const [query, setQuery] = useState('');

      useEffect(() => {
        if (isOpen) setQuery('');
      }, [isOpen]);

      if (!isOpen) return null;

      const q = query.trim().toLowerCase();
      const matchedEntities = q
        ? entities.filter(
            e =>
              e.name.toLowerCase().includes(q) ||
              (e.fullName && e.fullName.toLowerCase().includes(q)) ||
              (e.teamName && e.teamName.toLowerCase().includes(q)) ||
              (e.companyName && e.companyName.toLowerCase().includes(q))
          )
        : [];

      const matchedArticles = q
        ? articles.filter(
            a =>
              a.headline.toLowerCase().includes(q) ||
              (a.summary && a.summary.toLowerCase().includes(q))
          )
        : [];

      return (
        <div className="fixed inset-0 z-50 bg-black/75 flex items-start justify-center pt-20 px-4" onClick={onClose}>
          <div
            className="w-full max-w-2xl rounded-lg bg-charcoal border border-graphite overflow-hidden"
            onClick={e => e.stopPropagation()}
          >

              <span className="font-mono text-scarlet text-sm">⌕</span>
              <input
                type="text"
                autoFocus
                value={query}
                onChange={e => setQuery(e.target.value)}
                placeholder="Search F1/F2/FE teams, drivers, Airbus, Boeing, aircraft models, or briefings..."
                className="flex-1 bg-transparent text-sm text-offwhite placeholder-steel focus:outline-none"

                <div className="text-center py-8 font-mono text-xs text-steel">

              )}

              {q && matchedEntities.length === 0 && matchedArticles.length === 0 && (
                <div className="text-center py-8 font-mono text-xs text-steel">

                    {matchedEntities.slice(0, 12).map(ent => (
                      <button
                        key={ent.id}

                          onClose();

                        style={{ borderColor: ent.primaryColor || '#24262A' }}
                        className="p-3 rounded bg-carbon border text-left hover:bg-charcoal transition-colors flex items-center justify-between"

                        <div>
                          <div className="text-sm font-semibold text-offwhite">{ent.name}</div>
                          <div className="font-mono text-[10px] uppercase text-steel">

                  </div>
                </div>

              {matchedArticles.length > 0 && (

                  <div className="font-mono text-[10px] uppercase tracking-widest text-steel">

    function Mach1App() {
      const [entities, setEntities] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved && Array.isArray(saved.entities) && saved.entities.length > 0) {
            return saved.entities;
          }
        } catch (e) {}
        return INITIAL_ENTITIES;
      });

      const [articles, setArticles] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved && Array.isArray(saved.articles)) {
            return saved.articles;
          }
        } catch (e) {}
        return INITIAL_ARTICLES;
      });

      const [weeklyLogs, setWeeklyLogs] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved && Array.isArray(saved.weeklyLogs)) {
            return saved.weeklyLogs;
          }
        } catch (e) {}
        return INITIAL_WEEKLY_LOGS;
      });

      const [raceResults, setRaceResults] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved && Array.isArray(saved.raceResults)) {
            return saved.raceResults;
          }
        } catch (e) {}
        return INITIAL_RACE_RESULTS;
      });

      const [route, setRoute] = useState({ view: 'home' });
      const [isAdmin, setIsAdmin] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [searchOpen, setSearchOpen] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [toastMsg, setToastMsg] = useState('');
      const [showIntro, setShowIntro] = useState(true);
      const [introKey, setIntroKey] = useState(0);
      const [wireFilter, setWireFilter] = useState('all');
      const [cloudConnected, setCloudConnected] = useState(() => Boolean(getStoredGithubToken()));
      const [cloudError, setCloudError] = useState('');
      const [lastCloudSync, setLastCloudSync] = useState(null);
      const isRemoteSnapshotRef = useRef(false);

      const [theme, setTheme] = useState(() => {
        try {
          return localStorage.getItem('mach1_theme') || 'dark';
        } catch (e) {
          return 'dark';
        }
      });

      useEffect(() => {
        const rootEl = document.documentElement;
        if (theme === 'light') {
          rootEl.classList.add('light-theme');
          rootEl.classList.remove('dark');
        } else {
          rootEl.classList.remove('light-theme');
          rootEl.classList.add('dark');
        }
        try {
          localStorage.setItem('mach1_theme', theme);
        } catch (e) {}
      }, [theme]);

      const notify = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3200);
      };

      const navigate = (nextRoute) => {
        setRoute(nextRoute);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // Keyboard shortcut Cmd/Ctrl + K for Search
      useEffect(() => {
        const onKeyDown = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setSearchOpen(prev => !prev);
          } else if (e.key === 'Escape') {
            setSearchOpen(false);
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, []);

      // Persist database changes to localStorage & GitHub Repo
      useEffect(() => {
        if (isRemoteSnapshotRef.current) {
          isRemoteSnapshotRef.current = false;
          return;
        }
        persistDatabase(entities, articles, weeklyLogs, raceResults, (status) => {
          if (status.ok) {
            setCloudConnected(true);
            setCloudError('');
            setLastCloudSync(new Date().toLocaleTimeString());
          } else if (!status.noToken) {
            setCloudError(status.error);
          }
        });
      }, [entities, articles, weeklyLogs, raceResults]);

      const forceCloudPull = async (silent = false) => {
        const remote = await fetchPublicGithubData();
        if (remote) {
          isRemoteSnapshotRef.current = true;
          if (Array.isArray(remote.entities) && remote.entities.length > 0) setEntities(remote.entities);
          if (Array.isArray(remote.articles)) setArticles(remote.articles);
          if (Array.isArray(remote.weeklyLogs)) setWeeklyLogs(remote.weeklyLogs);
          if (Array.isArray(remote.raceResults)) setRaceResults(remote.raceResults);
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(remote));
          } catch (e) {}
          setLastCloudSync(new Date().toLocaleTimeString());
          if (!silent) notify('Latest blogs & race results synced from GitHub!');
        } else if (!silent) {
          notify('No data.json in GitHub yet — connect your GitHub Token in CMS and save once to create it');
        }
      };

      // Automatically load public data.json from GitHub on initial visit so all viewers see updates
      useEffect(() => {
        forceCloudPull(true);
      }, []);

      const handleResetDatabase = () => {
        setEntities(INITIAL_ENTITIES);

      const [raceSeries, setRaceSeries] = useState('Formula 1');
      const [raceCircuit, setRaceCircuit] = useState('');
      const [raceDate, setRaceDate] = useState(() => new Date().toISOString().slice(0, 10));
      const [raceWeather, setRaceWeather] = useState('Dry • 24°C');
      const [raceStatus, setRaceStatus] = useState('OFFICIAL CLASSIFICATION');
      const [raceFastestLap, setRaceFastestLap] = useState('');
      const [raceSummary, setRaceSummary] = useState('');
      const [raceIsLiveTicker, setRaceIsLiveTicker] = useState(true);
      const [raceRows, setRaceRows] = useState(makeDefaultRaceRows);
      const [raceDnfs, setRaceDnfs] = useState([]);
      const [racePenalties, setRacePenalties] = useState([]);
      const [raceFlags, setRaceFlags] = useState([]);

      const resetRaceForm = () => {
        setEditingRaceId(null);
        setRaceName('');
        setRaceShortTitle('');
        setRaceFlag('🏁');
        setRaceSeries('Formula 1');
        setRaceCircuit('');
        setRaceDate(new Date().toISOString().slice(0, 10));
        setRaceWeather('Dry • 24°C');
        setRaceStatus('OFFICIAL CLASSIFICATION');
        setRaceFastestLap('');
        setRaceSummary('');
        setRaceIsLiveTicker(true);
        setRaceRows(makeDefaultRaceRows());
        setRaceDnfs([]);
        setRacePenalties([]);
        setRaceFlags([]);
      };

      const loadRaceIntoForm = (race) => {
        setEditingRaceId(race.id);
        setRaceName(race.raceName || '');
        setRaceShortTitle(race.shortTitle || '');
        setRaceFlag(race.flag || '🏁');
        setRaceSeries(race.series || 'Formula 1');
        setRaceCircuit(race.circuit || '');
        setRaceDate(race.date || new Date().toISOString().slice(0, 10));
        setRaceWeather(race.weather || 'Dry • 24°C');
        setRaceStatus(race.raceStatus || 'OFFICIAL CLASSIFICATION');
        setRaceFastestLap(race.fastestLap || '');
        setRaceSummary(race.summary || '');
        setRaceIsLiveTicker(Boolean(race.isLiveTicker));
        setRaceRows(
          Array.isArray(race.standings) && race.standings.length > 0
            ? race.standings.map((r, idx) => ({
                pos: r.pos || `${idx + 1}`,
                driver: r.driver || '',
                code: r.code || '',
                team: r.team || '',
                gap: r.gap || '',
                tires: r.tires || 'M',
                pits: r.pits ?? '1',
                points: r.points || '0',
                color: r.color || ''
              }))
            : makeDefaultRaceRows()
        );
        setRaceDnfs(Array.isArray(race.dnfs) ? race.dnfs : []);
        setRacePenalties(Array.isArray(race.penalties) ? race.penalties : []);
        setRaceFlags(Array.isArray(race.flags) ? race.flags : []);
      };

      const handleSaveRaceResult = (e) => {
        e.preventDefault();
        if (!raceName.trim()) {
          notify('Please enter the Race Name (e.g. Miami Grand Prix)');
          return;
        }
        const cleanedStandings = raceRows
          .filter(r => r.driver.trim() !== '')
          .map((r, idx) => {
            const matchedDriver = entities.find(
              ent => ent.type === 'driver' && ent.name.toLowerCase() === r.driver.trim().toLowerCase()
            );
            return {
              pos: (r.pos || `${idx + 1}`).trim(),
              driver: r.driver.trim(),
              code: (r.code || getDriverTriCode(r.driver)).trim().toUpperCase(),
              team: r.team.trim() || matchedDriver?.teamName || '',
              gap: r.gap.trim(),
              tires: (r.tires || 'M').trim(),
              pits: String(r.pits ?? '1').trim(),
              points: r.points.trim(),
              color: r.color || matchedDriver?.primaryColor || '#E10600'
            };
          });

        if (cleanedStandings.length === 0) {
          notify('Enter at least P1 driver in the finishing classification');
          return;
        }

        const cleanedDnfs = raceDnfs.filter(d => d.driver && d.driver.trim() !== '');
        const cleanedPenalties = racePenalties.filter(p => p.driver && p.driver.trim() !== '');
        const cleanedFlags = raceFlags.filter(f => f.flag && f.flag.trim() !== '');

        const raceObj = {
          id: editingRaceId || 'race-' + Date.now(),
          raceName: raceName.trim(),
          shortTitle: raceShortTitle.trim() || raceName.trim().replace(/Grand Prix/i, 'GP'),
          flag: raceFlag.trim() || '🏁',
          series: raceSeries.trim() || 'Formula 1',
          circuit: raceCircuit.trim(),
          date: raceDate.trim(),
          weather: raceWeather.trim(),
          raceStatus: raceStatus.trim(),
          fastestLap: raceFastestLap.trim(),
          summary: raceSummary.trim(),
          isLiveTicker: raceIsLiveTicker,
          standings: cleanedStandings,
          dnfs: cleanedDnfs,
          penalties: cleanedPenalties,
          flags: cleanedFlags
        };

        let nextRaces;
        if (editingRaceId) {
          nextRaces = raceResults.map(r =>
            r.id === editingRaceId
              ? raceObj
              : raceIsLiveTicker
              ? { ...r, isLiveTicker: false }
              : r
          );
        } else {
          const base = raceIsLiveTicker
            ? raceResults.map(r => ({ ...r, isLiveTicker: false }))
            : raceResults;
          nextRaces = [raceObj, ...base];
        }

        setRaceResults(nextRaces);
        persistDatabase(entities, articles, weeklyLogs, nextRaces);
        resetRaceForm();
        notify('Race classification, tyres, penalties & top ticker saved!');
      };

      // Weekly Log Form State
      const [wkDivision, setWkDivision] = useState('track');
      const [wkOrg, setWkOrg] = useState('');
      const [wkTitle, setWkTitle] = useState('');
      const [wkSig, setWkSig] = useState('');

      // Driver Stats Editor State
      const [driverCatFilter, setDriverCatFilter] = useState('f1');
      const driverEntities = entities.filter(e => e.type === 'driver' && e.category === driverCatFilter);
      const [selectedDriverId, setSelectedDriverId] = useState(() => driverEntities[0]?.id || '');

      useEffect(() => {
        const list = entities.filter(e => e.type === 'driver' && e.category === driverCatFilter);
        if (list.length > 0 && !list.some(d => d.id === selectedDriverId)) {
          setSelectedDriverId(list[0].id);
        }
      }, [driverCatFilter, entities]);

      const activeDriver = entities.find(e => e.id === selectedDriverId);

      // Aircraft Models Editor State
      const aircraftEntities = entities.filter(e => e.type === 'aircraft');
      const skyCompanies = entities.filter(e => e.division === 'sky' && e.type === 'manufacturer');
      const [selectedAircraftId, setSelectedAircraftId] = useState(() => aircraftEntities[0]?.id || '');
      const activeAircraft = entities.find(e => e.id === selectedAircraftId);

      // Teams & Identity Colours State
      const orgEntities = entities.filter(e => e.type === 'team' || e.type === 'manufacturer' || e.type === 'governing');
      const [selectedOrgId, setSelectedOrgId] = useState(() => orgEntities[0]?.id || '');
      const activeOrg = entities.find(e => e.id === selectedOrgId);

      const handlePublishArticle = (e) => {
        e.preventDefault();
        if (!headline.trim()) {
          notify('Headline is required');
          return;
        }
        const cat = CATEGORIES[categoryId] || CATEGORIES.f1;
        const newArt = {
          id: 'art-' + Date.now(),
          division: cat.division,
          categoryId: cat.id,
          categoryLabel: cat.name,
          headline: headline.trim(),
          summary: summary.trim(),
          body: body.trim(),
          verdict: verdict.trim(),
          imageUrl: imageUrl.trim(),
          isAnalysis,
          entityIds: selectedEntityIds,
          date: new Date().toISOString().slice(0, 10),
          author: 'MACH1 Editorial Desk',
          _updatedAt: Date.now()
        };
        const nextArticles = [newArt, ...articles];
        setArticles(nextArticles);
        persistDatabase(entities, nextArticles, weeklyLogs, raceResults);
        setHeadline('');
        setSummary('');
        setBody('');
        setVerdict('');
        setImageUrl('');
        setSelectedEntityIds([]);
        notify('Article published & synced across all tagged entities!');
      };

      const handleAddWeeklyLog = (e) => {
        e.preventDefault();
        if (!wkTitle.trim()) return;
        const newLog = {
          id: 'wk-' + Date.now(),
          division: wkDivision,
          organisation: wkOrg.trim() || 'General',
          title: wkTitle.trim(),
          significance: wkSig.trim(),
          date: new Date().toISOString().slice(0, 10)
        };
        const nextLogs = [newLog, ...weeklyLogs];
        setWeeklyLogs(nextLogs);
        persistDatabase(entities, articles, nextLogs, raceResults);
        setWkOrg('');
        setWkTitle('');
        setWkSig('');
        notify('Weekly upgrade entry added!');
      };

      const updateDriverField = (field, value) => {
        setEntities(prev => {
          const next = prev.map(ent => {
            if (ent.id !== selectedDriverId) return ent;
            if (field === 'name') {
              return { ...ent, name: value, fullName: value };
            }
            if (field === 'teamId') {
              const team = prev.find(t => t.id === value);
              return {
                ...ent,
                teamId: value,
                teamName: team ? team.name : ent.teamName,
                primaryColor: team ? team.primaryColor : ent.primaryColor
              };
            }
            return { ...ent, [field]: value };
          });
          persistDatabase(next, articles, weeklyLogs, raceResults);
          return next;
        });
      };

      const updateDriverStatValue = (label, value) => {
        setEntities(prev => {
          const next = prev.map(ent => {
            if (ent.id !== selectedDriverId) return ent;
            const currentStats = Array.isArray(ent.stats) ? [...ent.stats] : makeEmptyDriverStats();
            const idx = currentStats.findIndex(s => s.label === label);
            if (idx >= 0) {
              currentStats[idx] = { ...currentStats[idx], value };
            } else {
              currentStats.push({ label, value });
            }
            return { ...ent, stats: currentStats };
          });
          persistDatabase(next, articles, weeklyLogs, raceResults);
          return next;
        });
      };

      const handleAddDriver = () => {
        const seriesTeams = entities.filter(e => e.type === 'team' && e.category === driverCatFilter);
        const defaultTeam = seriesTeams[0];
        const newId = `drv-${driverCatFilter}-${Date.now()}`;
        const newDriver = {
          id: newId,
          division: 'track',
          category: driverCatFilter,
          type: 'driver',
          name: 'New Driver',
          fullName: 'New Driver',
          number: '99',
          teamId: defaultTeam?.id || '',
          teamName: defaultTeam?.name || 'Independent',
          primaryColor: defaultTeam?.primaryColor || '#E10600',
          nationality: '',
          overview: '',
          stats: makeEmptyDriverStats()
        };
        setEntities(prev => {
          const next = [...prev, newDriver];
          persistDatabase(next, articles, weeklyLogs, raceResults);
          return next;
        });
        setSelectedDriverId(newId);
        notify('New driver card added — edit name & stats below');
      };

      const updateAircraftField = (field, value) => {
        setEntities(prev => {
          const next = prev.map(ent => {
            if (ent.id !== selectedAircraftId) return ent;
            if (field === 'name') return { ...ent, name: value, fullName: value };
            if (field === 'companyId') {
              const comp = prev.find(c => c.id === value);
              return {
                ...ent,
                companyId: value,
                companyName: comp ? comp.name : ent.companyName,
                category: comp ? comp.category : ent.category,
                primaryColor: comp ? comp.primaryColor : ent.primaryColor
              };
            }
            return { ...ent, [field]: value };
          });
          persistDatabase(next, articles, weeklyLogs, raceResults);
          return next;
        });
      };

      const updateAircraftStatValue = (label, value) => {
        setEntities(prev => {
          const next = prev.map(ent => {
            if (ent.id !== selectedAircraftId) return ent;
            const currentStats = Array.isArray(ent.stats) ? [...ent.stats] : makeEmptyAircraftSpecs();
            const idx = currentStats.findIndex(s => s.label === label);
            if (idx >= 0) {
              currentStats[idx] = { ...currentStats[idx], value };
            } else {
              currentStats.push({ label, value });
            }
            return { ...ent, stats: currentStats };
          });
          persistDatabase(next, articles, weeklyLogs, raceResults);
          return next;
        });
      };

      const handleAddAircraft = () => {
        const defaultComp = skyCompanies[0];
        const newId = `ac-${Date.now()}`;
        const newAc = {
          id: newId,
          division: 'sky',
          category: defaultComp?.category || 'commercial',
          type: 'aircraft',
          name: 'New Aircraft Model',
          fullName: 'New Aircraft Model',
          code: 'NEW',
          companyId: defaultComp?.id || 'sky-airbus',
          companyName: defaultComp?.name || 'Airbus',
          outlineType: 'widebody',
          primaryColor: defaultComp?.primaryColor || '#005EB8',
          overview: '',
          stats: makeEmptyAircraftSpecs()
        };
        setEntities(prev => {
          const next = [...prev, newAc];
          persistDatabase(next, articles, weeklyLogs, raceResults);
          return next;
        });
        setSelectedAircraftId(newId);
        notify('New aircraft model added under ' + (defaultComp?.name || 'Airbus'));
      };

      return (
        <div className="space-y-8">
          <div className="border-b border-graphite pb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <div className="flex flex-wrap items-center gap-2.5 font-mono text-xs uppercase tracking-[0.2em]">
                <span className="text-scarlet">PERSISTENT RELATIONAL CONTENT MANAGEMENT</span>
                <span className="text-graphite">|</span>
                {cloudConnected ? (
                  <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded bg-carbon border border-emerald-500/40 text-emerald-400 text-[10px]">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    GitHub Sync Active ({GITHUB_REPO_OWNER}/{GITHUB_REPO_NAME}){lastCloudSync ? ` • ${lastCloudSync}` : ''}
                  </span>
                ) : (
                  <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded bg-carbon border border-papaya/40 text-papaya text-[10px]">
                    <span className="w-1.5 h-1.5 rounded-full bg-papaya"></span>
                    Local Mode (Connect GitHub Token to Publish Live)
                  </span>
                )}
              </div>
              <h1 className="text-3xl font-bold text-offwhite mt-1">MACH1 Editorial CMS</h1>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <button
                type="button"
                onClick={onForceCloudSync}
                className="px-3.5 py-2 rounded bg-charcoal border border-graphite hover:border-offwhite font-mono text-xs text-offwhite transition-colors"
              >
                ↻ Sync Now
              </button>
              <button
                type="button"
                onClick={() => setShowCloudSetup(prev => !prev)}
                className="px-3.5 py-2 rounded bg-charcoal border border-papaya/60 hover:border-papaya font-mono text-xs text-papaya transition-colors"
              >
                {cloudConnected ? 'GitHub Sync Settings' : '+ Connect GitHub Sync'}
              </button>
              <button
                type="button"
                onClick={handleResetDatabase}
                className="px-3.5 py-2 rounded bg-charcoal border border-graphite hover:border-steel font-mono text-xs text-steel hover:text-offwhite"
              >
                Reset Default Data
              </button>
              <button
                type="button"
                onClick={onLogout}
                className="px-3.5 py-2 rounded bg-charcoal border border-scarlet/60 font-mono text-xs text-offwhite"
              >
                Lock CMS
              </button>
            </div>
          </div>

          {/* Direct GitHub Cloud Sync Drawer */}
          {showCloudSetup && (
            <div className="p-5 rounded-lg bg-charcoal border border-papaya/50 space-y-4">
              <div className="flex items-center justify-between">
                <span className="font-mono text-xs font-semibold uppercase tracking-wider text-papaya">
                  DIRECT GITHUB REPOSITORY SYNC ({GITHUB_REPO_OWNER}/{GITHUB_REPO_NAME})
                </span>
                <button type="button" onClick={() => setShowCloudSetup(false)} className="font-mono text-xs text-steel">✕</button>
              </div>
              {cloudError && (
                <div className="p-3 rounded bg-scarlet/15 border border-scarlet font-mono text-xs text-scarlet">
                  GitHub Sync Error: {cloudError} — Make sure your token has <strong>repo</strong> (or Contents Read &amp; Write) permission.
                </div>
              )}
              <div className="space-y-1.5 text-xs text-steel leading-relaxed">
                <p>
                  Every save in your Admin CMS will automatically commit <code className="text-offwhite">data.json</code> straight into <strong className="text-offwhite">{GITHUB_REPO_OWNER}/{GITHUB_REPO_NAME}</strong>. Every visitor on any device will automatically load your live blogs &amp; race results!
                </p>
                <p>
                  <strong className="text-offwhite">How to get your free GitHub Token (30 sec):</strong> GitHub → Profile Icon → <strong className="text-offwhite">Settings → Developer settings → Personal access tokens → Tokens (classic) → Generate new token (classic)</strong> → check <code className="text-offwhite">repo</code> → Generate &amp; paste below.
                </p>
              </div>
              <div className="flex flex-col sm:flex-row gap-2">
                <input
                  type="password"
                  value={githubTokenInput}
                  onChange={e => setGithubTokenInput(e.target.value)}
                  placeholder="ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
                  className="flex-1 px-3.5 py-2 rounded bg-carbon border border-graphite font-mono text-xs text-offwhite focus:border-papaya focus:outline-none"
                />
                <button
                  type="button"
                  onClick={() => onConnectGithub(githubTokenInput)}
                  className="px-4 py-2 rounded bg-papaya text-carbon font-mono text-xs font-bold uppercase whitespace-nowrap"
                >
                  Save Token &amp; Sync Live
                </button>
                {cloudConnected && (
                  <button
                    type="button"
                    onClick={() => {
                      setGithubTokenInput('');
                      onConnectGithub('');
                    }}
                    className="px-3.5 py-2 rounded bg-carbon border border-graphite font-mono text-xs text-steel hover:text-offwhite whitespace-nowrap"
                  >
                    Disconnect
                  </button>
                )}
              </div>
            </div>
          )}

          {/* CMS Tabs */}
          <div className="flex flex-wrap gap-2 border-b border-graphite pb-4">
            {[
              { id: 'articles', label: `Articles (${articles.length})` },
              { id: 'races', label: `Race Results & Ticker (${raceResults.length})` },
              { id: 'drivers', label: 'Driver Stats & Names' },
              { id: 'aircraft', label: `Aircraft Models (${aircraftEntities.length})` },
              { id: 'teams', label: 'Teams & Identity Colours' },
              { id: 'weekly', label: `Weekly Tracker (${weeklyLogs.length})` }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`px-4 py-2 rounded font-mono text-xs uppercase border transition-colors ${
                  activeTab === tab.id
                    ? 'bg-scarlet/15 border-scarlet text-offwhite font-semibold'
                    : 'bg-charcoal border-graphite text-steel hover:text-offwhite'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </div>

          {/* TAB 1: ARTICLES */}
          {activeTab === 'articles' && (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
              <form onSubmit={handlePublishArticle} className="lg:col-span-2 p-6 rounded-lg bg-charcoal border border-graphite space-y-4">
                <h2 className="text-lg font-bold text-offwhite">Publish New Multi-Entity Briefing</h2>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block font-mono text-[10px] uppercase text-steel mb-1">Category</label>
                    <select
                      value={categoryId}
                      onChange={e => setCategoryId(e.target.value)}
                      className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                    >
                      {Object.values(CATEGORIES).map(c => (
                        <option key={c.id} value={c.id}>{c.name}</option>
                      ))}
                    </select>
                  </div>
                  <div className="flex items-end">
                    <label className="flex items-center gap-2 font-mono text-xs text-offwhite cursor-pointer pb-2">
                      <input
                        type="checkbox"
                        checked={isAnalysis}
                        onChange={e => setIsAnalysis(e.target.checked)}
                      />
                      <span>Mark as Technical Analysis</span>
                    </label>
                  </div>
                </div>

                <div>
                  <label className="block font-mono text-[10px] uppercase text-steel mb-1">Headline *</label>
                  <input
                    type="text"
                    value={headline}
                    onChange={e => setHeadline(e.target.value)}
                    placeholder="Enter briefing headline..."
                    className="w-full px-3.5 py-2 rounded bg-carbon border border-graphite text-sm text-offwhite"
                  />
                </div>

                <div>
                  <label className="block font-mono text-[10px] uppercase text-steel mb-1">Executive Summary</label>
                  <input
                    type="text"
                    value={summary}
                    onChange={e => setSummary(e.target.value)}
                    placeholder="Concise 1–2 sentence lead..."
                    className="w-full px-3.5 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                  />
                </div>

                <div>
                  <label className="block font-mono text-[10px] uppercase text-steel mb-1">Article Body</label>
                  <textarea
                    rows="5"
                    value={body}
                    onChange={e => setBody(e.target.value)}
                    placeholder="Full technical report..."
                    className="w-full px-3.5 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                  />
                </div>

                <div>
                  <label className="block font-mono text-[10px] uppercase text-papaya mb-1">OUR VERDICT (Editorial Interpretation)</label>
                  <textarea
                    rows="3"
                    value={verdict}
                    onChange={e => setVerdict(e.target.value)}
                    placeholder="Why this development matters and what to watch next..."
                    className="w-full px-3.5 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                  />
                </div>

                <div>
                  <label className="block font-mono text-[10px] uppercase text-steel mb-1">Header Image URL (Optional)</label>
                  <input
                    type="text"
                    value={imageUrl}
                    onChange={e => setImageUrl(e.target.value)}
                    placeholder="https://..."
                    className="w-full px-3.5 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                  />
                </div>

                <div>
                  <label className="block font-mono text-[10px] uppercase text-steel mb-2">
                    Tag Involved Teams, Drivers, Aircraft &amp; Organisations ({selectedEntityIds.length} selected)
                  </label>
                  <div className="max-h-44 overflow-y-auto p-3 rounded bg-carbon border border-graphite flex flex-wrap gap-1.5">
                    {entities.map(ent => {
                      const active = selectedEntityIds.includes(ent.id);
                      return (
                        <button
                          type="button"
                          key={ent.id}
                          onClick={() =>
                            setSelectedEntityIds(prev =>
                              prev.includes(ent.id) ? prev.filter(id => id !== ent.id) : [...prev, ent.id]
                            )
                          }
                          className={`px-2.5 py-1 rounded font-mono text-[11px] border transition-colors ${
                            active
                              ? 'bg-scarlet/20 border-scarlet text-offwhite'
                              : 'bg-charcoal border-graphite text-steel hover:text-offwhite'
                          }`}
                        >
                          {ent.name}
                        </button>
                      );
                    })}
                  </div>
                </div>

                <button
                  type="submit"
                  className="px-5 py-2.5 rounded bg-scarlet text-white font-mono text-xs font-bold uppercase tracking-wider"
                >
                  Publish Briefing
                </button>
              </form>

              {/* Published Articles List */}
              <div className="p-6 rounded-lg bg-charcoal border border-graphite space-y-4">
                <h3 className="font-mono text-xs uppercase tracking-widest text-steel">PUBLISHED ARTICLES ({articles.length})</h3>
                {articles.length === 0 ? (
                  <p className="font-mono text-xs text-steel">No published articles yet.</p>
                ) : (
                  <div className="space-y-2.5">
                    {articles.map(art => (
                      <div key={art.id} className="p-3 rounded bg-carbon border border-graphite flex items-start justify-between gap-2">
                        <div>
                          <div className="font-mono text-[10px] text-papaya">{art.categoryLabel}</div>
                          <div className="text-xs font-semibold text-offwhite">{art.headline}</div>
                        </div>
                        <button
                          type="button"
                          onClick={() => {

                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                      <label className="block font-mono text-[10px] uppercase text-steel mb-1">Car Number</label>
                      <input
                        type="text"
                        value={activeDriver.number || ''}
                        onChange={e => updateDriverField('number', e.target.value)}
                        className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                      />
                    </div>
                    <div>
                      <label className="block font-mono text-[10px] uppercase text-steel mb-1">Nationality</label>
                      <input
                        type="text"
                        value={activeDriver.nationality || ''}
                        onChange={e => updateDriverField('nationality', e.target.value)}
                        className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                      />
                    </div>
                    <div>
                      <label className="block font-mono text-[10px] uppercase text-steel mb-1">Biography / Dossier Note</label>
                      <input
                        type="text"
                        value={activeDriver.overview || ''}
                        onChange={e => updateDriverField('overview', e.target.value)}
                        className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 pt-2">
                    {[
                      'Pole Positions',
                      'Podiums',
                      'Race Wins',
                      'Recent Race / Standings',
                      'Career / Season Points'
                    ].map(statLabel => {
                      const val = activeDriver.stats?.find(s => s.label === statLabel)?.value || '';
                      return (
                        <div key={statLabel} className="p-3 rounded bg-carbon border border-graphite">
                          <label className="block font-mono text-[10px] uppercase text-steel mb-1">{statLabel}</label>
                          <input
                            type="text"
                            value={val}
                            onChange={e => updateDriverStatValue(statLabel, e.target.value)}
                            placeholder="Enter value..."
                            className="w-full px-2.5 py-1.5 rounded bg-charcoal border border-graphite font-mono text-xs text-offwhite"
                          />
                        </div>
                      );
                    })}
                  </div>

                  <div className="flex items-center justify-between pt-2">
                    <button
                      type="button"
                      onClick={() => {
                        const next = entities.filter(e => e.id !== activeDriver.id);
                        setEntities(next);
                        persistDatabase(next, articles, weeklyLogs, raceResults);
                        notify('Driver deleted');
                      }}
                      className="px-3.5 py-2 rounded bg-carbon border border-scarlet/60 font-mono text-xs text-scarlet"
                    >
                      Delete Driver
                    </button>

                    <button
                      type="button"
                      onClick={() => {
                        persistDatabase(entities, articles, weeklyLogs, raceResults);
                        notify(`Saved stats for ${activeDriver.name}`);
                      }}
                      className="px-5 py-2 rounded bg-scarlet text-white font-mono text-xs font-bold uppercase"
                    >
                      Save Driver Stats
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* TAB 3: AIRCRAFT MODELS EDITOR */}
          {activeTab === 'aircraft' && (
            <div className="p-6 rounded-lg bg-charcoal border border-graphite space-y-6">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <h2 className="text-lg font-bold text-offwhite">Aviation &amp; Aerospace Aircraft Programmes</h2>
                <button
                  type="button"
                  onClick={handleAddAircraft}
                  className="px-4 py-2 rounded bg-papaya text-carbon font-mono text-xs font-bold uppercase"
                >
                  + Add Aircraft Model
                </button>
              </div>

              {activeAircraft && (
                <div className="space-y-5">
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                      <label className="block font-mono text-[10px] uppercase text-steel mb-1">Select Aircraft Model</label>
                      <select
                        value={selectedAircraftId}
                        onChange={e => setSelectedAircraftId(e.target.value)}
                        className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                      >
                        {aircraftEntities.map(ac => (
                          <option key={ac.id} value={ac.id}>{ac.companyName} — {ac.name}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block font-mono text-[10px] uppercase text-steel mb-1">Aircraft Name</label>
                      <input
                        type="text"
                        value={activeAircraft.name}
                        onChange={e => updateAircraftField('name', e.target.value)}
                        className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                      />
                    </div>

                    <div>
                      <label className="block font-mono text-[10px] uppercase text-steel mb-1">Parent Aviation Company</label>
                      <select
                        value={activeAircraft.companyId || ''}
                        onChange={e => updateAircraftField('companyId', e.target.value)}
                        className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                      >
                        {skyCompanies.map(c => (
                          <option key={c.id} value={c.id}>{c.name}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block font-mono text-[10px] uppercase text-steel mb-1">Configuration Outline Schematic</label>
                      <select
                        value={activeAircraft.outlineType || 'widebody'}
                        onChange={e => updateAircraftField('outlineType', e.target.value)}
                        className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                      >
                        <option value="widebody">Widebody Twin-Aisle Airliner</option>
                        <option value="narrowbody">Narrowbody Single-Aisle Airliner</option>
                        <option value="bizjet">Rear-Engined Business Jet</option>
                        <option value="fighter">Stealth Delta Tactical Fighter</option>
                        <option value="supersonic">Supersonic / Orbital Vehicle</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-mono text-[10px] uppercase text-steel mb-1">Programme Overview</label>
                      <input
                        type="text"
                        value={activeAircraft.overview || ''}
                        onChange={e => updateAircraftField('overview', e.target.value)}
                        placeholder="General aerodynamic & programme summary..."
                        className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    {[
                      'Operating Empty Weight (OEW)',
                      'Max Takeoff Weight (MTOW)',
                      'Fuel Consumption Rate',
                      'Airframe Materials',
                      'Manufacturing / EIS Year',
                      'Propulsion & Range'
                    ].map(specLabel => {
                      const val = activeAircraft.stats?.find(s => s.label === specLabel)?.value || '';
                      return (
                        <div key={specLabel} className="p-3 rounded bg-carbon border border-graphite">
                          <label className="block font-mono text-[10px] uppercase text-steel mb-1">{specLabel}</label>
                          <input
                            type="text"
                            value={val}
                            onChange={e => updateAircraftStatValue(specLabel, e.target.value)}
                            placeholder="Enter value..."
                            className="w-full px-2.5 py-1.5 rounded bg-charcoal border border-graphite font-mono text-xs text-offwhite"
                          />
                        </div>
                      );
                    })}
                  </div>

                  <div className="flex justify-end">
                    <button
                      type="button"
                      onClick={() => {
                        persistDatabase(entities, articles, weeklyLogs, raceResults);
                        notify(`Saved specifications for ${activeAircraft.name}`);
                      }}
                      className="px-5 py-2 rounded bg-papaya text-carbon font-mono text-xs font-bold uppercase"
                    >
                      Save Aircraft Specs
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* TAB 4: TEAMS & IDENTITY COLOURS */}
          {activeTab === 'teams' && (
            <div className="p-6 rounded-lg bg-charcoal border border-graphite space-y-5">
              <h2 className="text-lg font-bold text-offwhite">Configure Team / Manufacturer Identity Colours &amp; Profiles</h2>
              {activeOrg && (
                <div className="space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                      <label className="block font-mono text-[10px] uppercase text-steel mb-1">Select Organisation</label>
                      <select
                        value={selectedOrgId}
                        onChange={e => setSelectedOrgId(e.target.value)}
                        className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                      >
                        {orgEntities.map(o => (
                          <option key={o.id} value={o.id}>{o.name} ({CATEGORIES[o.category]?.name})</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block font-mono text-[10px] uppercase text-steel mb-1">Display Name</label>
                      <input
                        type="text"
                        value={activeOrg.name}
                        onChange={e => {
                          const val = e.target.value;
                          setEntities(prev => {
                            const next = prev.map(ent => (ent.id === activeOrg.id ? { ...ent, name: val, fullName: val } : ent));
                            persistDatabase(next, articles, weeklyLogs, raceResults);
                            return next;
                          });
                        }}
                        className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                      />
                    </div>
                    <div>
                      <label className="block font-mono text-[10px] uppercase text-steel mb-1">Livery Outline Colour</label>
                      <div className="flex items-center gap-2">
                        <input
                          type="color"
                          value={activeOrg.primaryColor || '#E10600'}
                          onChange={e => {
                            const col = e.target.value;
                            setEntities(prev => {
                              const next = prev.map(ent =>
                                ent.id === activeOrg.id || ent.teamId === activeOrg.id || ent.companyId === activeOrg.id
                                  ? { ...ent, primaryColor: col }
                                  : ent
                              );
                              persistDatabase(next, articles, weeklyLogs, raceResults);
                              return next;
                            });
                          }}
                          className="h-9 w-14 rounded bg-carbon border border-graphite cursor-pointer"
                        />
                        <span className="font-mono text-xs text-offwhite">{activeOrg.primaryColor}</span>
                      </div>
                    </div>
                  </div>

                  <div>
                    <label className="block font-mono text-[10px] uppercase text-steel mb-1">Organisation Overview</label>
                    <textarea
                      rows="3"
                      value={activeOrg.overview || ''}
                      onChange={e => {
                        const ov = e.target.value;
                        setEntities(prev => {
                          const next = prev.map(ent => (ent.id === activeOrg.id ? { ...ent, overview: ov } : ent));
                          persistDatabase(next, articles, weeklyLogs, raceResults);
                          return next;
                        });
                      }}
                      placeholder="Technical profile, headquarters, and engineering focus..."
                      className="w-full px-3.5 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                    />
                  </div>
                </div>
              )}
            </div>
          )}

          {/* TAB 5: WEEKLY TRACKER */}
          {activeTab === 'weekly' && (
            <form onSubmit={handleAddWeeklyLog} className="p-6 rounded-lg bg-charcoal border border-graphite space-y-4 max-w-2xl">
              <h2 className="text-lg font-bold text-offwhite">Add Weekly Upgrade / Evolution Log Entry</h2>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block font-mono text-[10px] uppercase text-steel mb-1">Division</label>
                  <select
                    value={wkDivision}
                    onChange={e => setWkDivision(e.target.value)}
                    className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                  >
                    <option value="track">TRACK (Motorsport Upgrades)</option>
                    <option value="sky">SKY (Aviation &amp; Sustainable Propulsion)</option>
                  </select>
                </div>
                <div>
                  <label className="block font-mono text-[10px] uppercase text-steel mb-1">Team / Manufacturer</label>
                  <input
                    type="text"
                    value={wkOrg}
                    onChange={e => setWkOrg(e.target.value)}
                    placeholder="e.g. McLaren, Ferrari, Airbus, Rolls-Royce..."
                    className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                  />
                </div>
              </div>
              <div>
                <label className="block font-mono text-[10px] uppercase text-steel mb-1">Development Title *</label>
                <input
                  type="text"
                  value={wkTitle}
                  onChange={e => setWkTitle(e.target.value)}
                  placeholder="e.g. Revised front wing endplate / 100% SAF test flight..."
                  className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                />
              </div>
              <div>
                <label className="block font-mono text-[10px] uppercase text-steel mb-1">Technical Significance</label>
                <textarea
                  rows="3"
                  value={wkSig}
                  onChange={e => setWkSig(e.target.value)}
                  placeholder="Aerodynamic, efficiency, or emissions impact..."
                  className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                />
              </div>
              <button
                type="submit"
                className="px-5 py-2.5 rounded bg-scarlet text-white font-mono text-xs font-bold uppercase"
              >
                + Save Weekly Entry
              </button>
            </form>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Mach1App />);
  </script>
</body>
</html>
