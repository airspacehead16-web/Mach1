    @keyframes tickerPass {
      0% { transform: translateX(0%); }

      display: inline-flex;
      align-items: center;

      padding-left: 100%;
      white-space: nowrap;

    // 1. CLOUD SYNC & PERSISTENCE (GITHUB DATA.JSON + LOCAL STORAGE)

    const STORAGE_KEY = 'mach1_flagship_vlog_v4';
    const GH_TOKEN_KEY = 'mach1_github_pat_v1';
    const ADMIN_PIN = '2026';
    const GOLD = '#D4AF37';

    const GH_OWNER = 'airspacehead16-web';
    const GH_REPO = 'Mach1';
    const GH_BRANCH = 'main';
    const GH_FILE = 'data.json';

    const getStoredGithubToken = () => {
      try { return localStorage.getItem(GH_TOKEN_KEY) || ''; } catch (e) { return ''; }
    };

    const encodeUTF8Base64 = (str) => {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      bytes.forEach(b => { bin += String.fromCharCode(b); });
      return btoa(bin);
    };

    const decodeUTF8Base64 = (b64) => {
      const bin = atob(b64.replace(/\n/g, ''));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    };

    const fetchPublicGithubData = async () => {
      try {
        const rawUrl = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${GH_FILE}?t=${Date.now()}`;
        const res = await fetch(rawUrl, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data && typeof data === 'object') return data;
        }
      } catch (e) {}

      try {
        const apiUrl = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}&t=${Date.now()}`;
        const headers = { Accept: 'application/vnd.github+json' };
        const token = getStoredGithubToken();
        if (token) headers.Authorization = `Bearer ${token}`;
        const res = await fetch(apiUrl, { headers, cache: 'no-store' });
        if (res.ok) {
          const json = await res.json();
          if (json && json.content) return JSON.parse(decodeUTF8Base64(json.content));
        }
      } catch (e) {}
      return null;
    };

    const pushToGithubRepo = async (payloadObj) => {
      const token = getStoredGithubToken();
      if (!token) return { ok: false, noToken: true };

      const apiUrl = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`;
      const headers = {
        Authorization: `Bearer ${token}`,
        Accept: 'application/vnd.github+json',
        'Content-Type': 'application/json'
      };

      const attemptPut = async () => {
        let sha = null;
        const getRes = await fetch(`${apiUrl}?ref=${GH_BRANCH}&t=${Date.now()}`, { headers, cache: 'no-store' });
        if (getRes.ok) {
          const existing = await getRes.json();
          sha = existing.sha || null;
        }
        const body = {
          message: `MACH1 Studio: Sync intelligence data (${new Date().toISOString()})`,
          content: encodeUTF8Base64(JSON.stringify(payloadObj, null, 2)),
          branch: GH_BRANCH
        };
        if (sha) body.sha = sha;
        return fetch(apiUrl, { method: 'PUT', headers, body: JSON.stringify(body) });
      };

      try {
        let putRes = await attemptPut();
        if (putRes.status === 409) putRes = await attemptPut();
        if (!putRes.ok) {
          const errData = await putRes.json().catch(() => ({}));
          return { ok: false, error: errData.message || `GitHub API Error (${putRes.status})` };
        }
        return { ok: true };
      } catch (e) {
        return { ok: false, error: e?.message || 'Network error pushing to GitHub' };
      }

    function CompareModal({ items, onClose }) {
      if (!items || items.length < 2) return null;
      const [a, b] = items;
      const rows =
        a.kind === 'driver'
          ? [
              { label: 'Series', v1: a.series, v2: b.series },
              { label: 'Team', v1: a.team, v2: b.team },
              { label: 'Points', v1: `${a.points ?? 0} PTS`, v2: `${b.points ?? 0} PTS` },
              { label: 'Wins', v1: a.wins ?? '—', v2: b.wins ?? '—' },
              { label: 'Podiums', v1: a.podiums ?? '—', v2: b.podiums ?? '—' },
              { label: 'Poles', v1: a.poles ?? '—', v2: b.poles ?? '—' }
            ]
          : a.kind === 'team'
          ? [
              { label: 'Series', v1: a.series, v2: b.series },
              { label: 'Rank', v1: `P${a.rank}`, v2: `P${b.rank}` },
              { label: 'Points', v1: `${a.points} PTS`, v2: `${b.points} PTS` },
              { label: 'Chassis', v1: a.chassis, v2: b.chassis },
              { label: 'Power Unit', v1: a.powerUnit, v2: b.powerUnit }
            ]
          : [
              { label: 'Manufacturer', v1: a.manufacturer, v2: b.manufacturer },
              { label: 'Cruise Speed', v1: a.cruiseSpeed, v2: b.cruiseSpeed },
              { label: 'Max Range', v1: a.range, v2: b.range },
              { label: 'Propulsion', v1: a.engines, v2: b.engines },
              { label: 'MTOW', v1: a.mtow, v2: b.mtow }
            ];

      return (
        <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4" onClick={onClose}>
          <div className="w-full max-w-2xl rounded-2xl bg-panel border border-ember/60 p-6 space-y-5 shadow-2xl" onClick={e => e.stopPropagation()}>

                <div className="font-mono text-[10px] uppercase tracking-widest text-ember">HEAD-TO-HEAD COMPARISON</div>

                <div className="text-base text-bone">{a.kind === 'airliner' ? a.model : a.name}</div>

              <div className="font-mono text-xs text-dim">VS</div>

              {rows.map((r, i) => (
                <div key={i} className="grid grid-cols-3 p-3 bg-void/60 text-xs items-center">

    function SearchModal({ isOpen, onClose, teams, drivers, airliners, articles, onSelectDossier, onOpenArticle }) {
      const [q, setQ] = useState('');
      useEffect(() => { if (isOpen) setQ(''); }, [isOpen]);
      if (!isOpen) return null;

      const term = q.trim().toLowerCase();
      const mDrivers = term ? (drivers || []).filter(d => String(d?.name || '').toLowerCase().includes(term) || String(d?.code || '').toLowerCase().includes(term) || String(d?.team || '').toLowerCase().includes(term)) : [];
      const mTeams = term ? (teams || []).filter(t => String(t?.name || '').toLowerCase().includes(term) || String(t?.chassis || '').toLowerCase().includes(term)) : [];
      const mAirliners = term ? (airliners || []).filter(a => String(a?.model || '').toLowerCase().includes(term) || String(a?.manufacturer || '').toLowerCase().includes(term)) : [];
      const mArticles = term ? (articles || []).filter(a => String(a?.title || '').toLowerCase().includes(term) || String(a?.summary || '').toLowerCase().includes(term)) : [];

      return (
        <div className="fixed inset-0 z-50 bg-black/80 flex items-start justify-center pt-20 px-4" onClick={onClose}>
          <div className="w-full max-w-2xl rounded-2xl bg-panel border border-line overflow-hidden shadow-2xl" onClick={e => e.stopPropagation()}>
            <div className="flex items-center px-4 py-3.5 border-b border-line gap-3">
              <span className="font-mono text-crimson">⌕</span>
              <input
                type="text"
                autoFocus
                value={q}
                onChange={e => setQ(e.target.value)}
                placeholder="Search Drivers, F1/F2/FE Constructors, Airliners, or Technical Briefings..."
                className="flex-1 bg-transparent text-sm text-bone placeholder-dim focus:outline-none"
              />
              <button onClick={onClose} className="font-mono text-xs text-dim hover:text-bone">ESC</button>
            </div>
            <div className="max-h-96 overflow-y-auto p-4 space-y-4">
              {!term && <div className="text-center py-8 font-mono text-xs text-dim">Type any driver, team, aircraft, or briefing keyword...</div>}
              {mArticles.map(art => (
                <button key={art.id} onClick={() => { onOpenArticle(art); onClose(); }} className="w-full p-3 rounded-xl bg-void border border-line hover:border-crimson text-left">
                  <div className="font-mono text-[10px] uppercase text-crimson">{String(art.section || 'track').toUpperCase()} • {art.seriesBadge}</div>
                  <div className="text-xs font-bold text-bone mt-0.5">{art.title}</div>
                </button>
              ))}
              {mDrivers.map(d => (
                <button key={d.id} onClick={() => { onSelectDossier({ ...d, kind: 'driver' }); onClose(); }} className="w-full p-2.5 rounded-xl bg-void border border-line hover:border-ember text-left flex items-center justify-between">
                  <div>
                    <div className="text-xs font-bold text-bone">{d.isChampion ? '👑 ' : ''}{d.name}</div>
                    <div className="font-mono text-[10px] text-dim">{d.series} • {d.team}</div>
                  </div>
                  <span className="font-mono text-xs font-bold" style={{ color: d.isChampion ? GOLD : d.color }}>#{d.number}</span>
                </button>
              ))}
              {mTeams.map(t => (
                <button key={t.id} onClick={() => { onSelectDossier({ ...t, kind: 'team' }); onClose(); }} className="w-full p-2.5 rounded-xl bg-void border border-line hover:border-crimson text-left flex items-center justify-between">
                  <div>
                    <div className="text-xs font-bold text-bone">{t.isChampion ? '👑 ' : ''}{t.name}</div>
                    <div className="font-mono text-[10px] text-dim">{t.series} • {t.chassis}</div>
                  </div>
                  <span className="font-mono text-xs text-dim">→</span>
                </button>
              ))}
              {mAirliners.map(a => (
                <button key={a.id} onClick={() => { onSelectDossier({ ...a, kind: 'airliner' }); onClose(); }} className="w-full p-2.5 rounded-xl bg-void border border-line hover:border-ember text-left flex items-center justify-between">
                  <div>
                    <div className="text-xs font-bold text-bone">{a.manufacturer} {a.model}</div>
                    <div className="font-mono text-[10px] text-dim">{a.cruiseSpeed}</div>
                  </div>
                  <span className="font-mono text-xs text-ember">{a.code}</span>
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 6. MAIN APPLICATION
    // =========================================================================
    function Mach1App() {
      const [teams, setTeams] = useState(() => {
        try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (s?.teams?.length) return s.teams; } catch (e) {}
        return INITIAL_TEAMS;
      });
      const [drivers, setDrivers] = useState(() => {
        try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (s?.drivers?.length) return s.drivers; } catch (e) {}
        return INITIAL_DRIVERS;
      });
      const [airliners, setAirliners] = useState(() => {
        try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (s?.airliners?.length) return s.airliners; } catch (e) {}
        return INITIAL_AIRLINERS;
      });
      const [articles, setArticles] = useState(() => {
        try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (s?.articles?.length) return s.articles; } catch (e) {}
        return INITIAL_ARTICLES;
      });
      const [glossaryTerms, setGlossaryTerms] = useState(() => {
        try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (Array.isArray(s?.glossaryTerms) && s.glossaryTerms.length) return s.glossaryTerms; } catch (e) {}
        return GLOSSARY_TERMS;
      });
      const [customTrajectory, setCustomTrajectory] = useState(() => {
        try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (s?.customTrajectory && typeof s.customTrajectory === 'object') return s.customTrajectory; } catch (e) {}
        return {};
      });
      const [raceSummary, setRaceSummary] = useState(() => {
        try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (s?.raceSummary?.standings) return s.raceSummary; } catch (e) {}
        return INITIAL_RACE_SUMMARY;
      });
      const [savedRaces, setSavedRaces] = useState(() => {
        try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (Array.isArray(s?.savedRaces) && s.savedRaces.length) return s.savedRaces; } catch (e) {}
        return INITIAL_SAVED_RACES;
      });

      const [route, setRoute] = useState({ view: 'home' });
      const [driverSeriesFilter, setDriverSeriesFilter] = useState('F1');
      const [standingsSeries, setStandingsSeries] = useState('F1');
      const [standingsTab, setStandingsTab] = useState('drivers');
      const [trajectoryTarget, setTrajectoryTarget] = useState('drivers');
      const [hoveredRoundIdx, setHoveredRoundIdx] = useState(null);
      const [highlightedContenderId, setHighlightedContenderId] = useState(null);
      const [glossaryCategory, setGlossaryCategory] = useState('ALL');
      const [activeGlossaryTerm, setActiveGlossaryTerm] = useState(GLOSSARY_TERMS[0]);
      const [activeDossier, setActiveDossier] = useState(null);
      const [compareMode, setCompareMode] = useState(false);
      const [compareSelection, setCompareSelection] = useState([]);
      const [searchOpen, setSearchOpen] = useState(false);
      const [mobileOpen, setMobileOpen] = useState(false);
      const [isAdmin, setIsAdmin] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [toastMsg, setToastMsg] = useState('');
      const [syncStatus, setSyncStatus] = useState(() => (getStoredGithubToken() ? 'synced' : 'local'));
      const [theme, setTheme] = useState(() => {
        try { return localStorage.getItem('mach1_theme') || 'dark'; } catch (e) { return 'dark'; }
      });

      useEffect(() => {
        const rootEl = document.documentElement;
        if (theme === 'light') {
          rootEl.classList.add('light-theme');
          rootEl.classList.remove('dark');
        } else {
          rootEl.classList.remove('light-theme');
          rootEl.classList.add('dark');
        }
        try { localStorage.setItem('mach1_theme', theme); } catch (e) {}
      }, [theme]);

      useEffect(() => {
        const onKey = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setSearchOpen(prev => !prev);
          } else if (e.key === 'Escape') {
            setSearchOpen(false);
            setActiveDossier(null);
            setCompareSelection([]);
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      // Hash routing support
      useEffect(() => {
        const syncHash = () => {
          const hash = (window.location.hash || '').replace(/^#/, '');
          if (!hash) return;
          const [prefix, entityId] = hash.split('/');
          if (['home', 'glossary', 'track', 'sky', 'race', 'standings', 'drivers', 'f1', 'f2', 'fe', 'airliners', 'admin'].includes(prefix)) {
            setRoute({ view: prefix });
          } else if (prefix === 'article' && entityId) {
            setRoute({ view: 'article', articleId: entityId });
          } else if (prefix === 'driver' && entityId) {
            const found = drivers.find(d => d.id === entityId);
            if (found) setActiveDossier({ ...found, kind: 'driver' });
          } else if (prefix === 'team' && entityId) {
            const found = teams.find(t => t.id === entityId);
            if (found) setActiveDossier({ ...found, kind: 'team' });
          } else if (prefix === 'airliner' && entityId) {
            const found = airliners.find(a => a.id === entityId);
            if (found) setActiveDossier({ ...found, kind: 'airliner' });
          }
        };
        syncHash();
        window.addEventListener('hashchange', syncHash);
        return () => window.removeEventListener('hashchange', syncHash);
      }, [drivers, teams, airliners]);

      const refreshFromCloud = async (silent = false) => {
        const remote = await fetchPublicGithubData();
        if (remote) {
          if (Array.isArray(remote.teams) && remote.teams.length) setTeams(remote.teams);
          if (Array.isArray(remote.drivers) && remote.drivers.length) setDrivers(remote.drivers);
          if (Array.isArray(remote.airliners) && remote.airliners.length) setAirliners(remote.airliners);
          if (Array.isArray(remote.articles) && remote.articles.length) setArticles(remote.articles);
          if (Array.isArray(remote.glossaryTerms) && remote.glossaryTerms.length) setGlossaryTerms(remote.glossaryTerms);
          if (remote.customTrajectory && typeof remote.customTrajectory === 'object') setCustomTrajectory(remote.customTrajectory);
          if (remote.raceSummary && remote.raceSummary.standings) setRaceSummary(remote.raceSummary);
          if (Array.isArray(remote.savedRaces) && remote.savedRaces.length) setSavedRaces(remote.savedRaces);
          try {
            const localExisting = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...localExisting, ...remote }));
          } catch (e) {}
          setSyncStatus('synced');
          if (!silent) notify('Pulled latest data from GitHub data.json');
        }
      };

      useEffect(() => { refreshFromCloud(true); }, []);

      const notify = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3200);
      };

      const navigate = (next) => {
        setRoute(next);
        setCompareMode(false);
        setCompareSelection([]);
        if (next.view === 'article' && next.articleId) {
          window.history.replaceState(null, '', `#article/${next.articleId}`);
        } else {
          window.history.replaceState(null, '', `#${next.view}`);
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const copyShareLink = (prefix, id) => {
        const url = `${window.location.origin}${window.location.pathname}#${prefix}/${id}`;
        try {
          const el = document.createElement('textarea');
          el.value = url;
          document.body.appendChild(el);
          el.select();
          document.execCommand('copy');
          document.body.removeChild(el);
          notify(`Copied share link: #${prefix}/${id}`);
        } catch (e) {
          notify(`Link ready: #${prefix}/${id}`);
        }
      };

      const saveAllData = async (
        nextTeams,
        nextDrivers,
        nextAirliners,
        nextArticles,
        nextRace,
        nextSavedRaces = savedRaces,
        nextGlossary = glossaryTerms,
        nextTrajectory = customTrajectory
      ) => {
        const payload = {
          teams: nextTeams,
          drivers: nextDrivers,
          airliners: nextAirliners,
          articles: nextArticles,
          glossaryTerms: nextGlossary,
          customTrajectory: nextTrajectory,
          raceSummary: nextRace,
          savedRaces: nextSavedRaces,
          updatedAt: new Date().toISOString()
        };
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); } catch (e) {}
        const res = await pushToGithubRepo(payload);
        if (res.ok) {
          setSyncStatus('synced');
          notify('Synced globally to GitHub data.json!');
        } else if (!res.noToken && res.error) {
          notify(`Saved locally (GitHub note: ${res.error})`);
        } else {
          notify('Saved to local storage!');
        }
      };

      const handleCubeSelect = (entity, kind) => {
        const payload = { ...entity, kind };
        if (compareMode) {
          setCompareSelection(prev => {
            const exists = prev.find(i => i.id === payload.id);
            if (exists) return prev.filter(i => i.id !== payload.id);
            if (prev.length >= 2) return [prev[1], payload];
            return [...prev, payload];
          });
        } else {
          setActiveDossier(payload);
        }
      };

      // =====================================================================
      // CUBE CARD RENDERERS
      // =====================================================================
      const renderDriverCube = (drv) => {
        const isChamp = Boolean(drv.isChampion);
        const accent = isChamp ? GOLD : drv.color;
        const selected = compareSelection.some(i => i.id === drv.id);
        return (
          <button
            key={drv.id}
            onClick={() => handleCubeSelect(drv, 'driver')}
            style={{ borderColor: selected ? '#D2FF00' : `${accent}65`, borderLeftWidth: '4px', borderLeftColor: accent }}
            className={`mach-cube p-4 rounded-2xl border flex flex-col justify-between text-left ${
              isChamp ? 'champ-foil' : 'card-gradient'
            }`}
          >
            <div>
              <div className="flex items-center justify-between w-full font-mono text-xs gap-2">
                <span className="text-dim truncate">{drv.team}</span>
                <span className="font-extrabold shrink-0" style={{ color: accent }}>
                  {isChamp ? '👑 ' : ''}#{drv.number}
                </span>
              </div>
              <h3 className="font-display text-base sm:text-lg font-extrabold text-bone leading-snug mt-1">
                {drv.name}
              </h3>
              <div className="flex items-center justify-between font-mono text-[11px] text-dim mt-0.5">
                <span>{drv.nationality || drv.flag}</span>
                <span className="font-bold" style={{ color: isChamp ? GOLD : undefined }}>
                  {drv.points ?? 0} PTS
                </span>
              </div>
            </div>

            <div className="w-full h-px bg-line my-3"></div>

            <div className="grid grid-cols-4 gap-1.5 w-full font-mono text-center">
              <div className="py-1.5 px-1 rounded-lg bg-void/90 border border-line/80">
                <div className="text-[9px] text-dim">POLES</div>
                <div className="text-xs font-bold text-bone mt-0.5">{drv.poles ?? '—'}</div>
              </div>
              <div className="py-1.5 px-1 rounded-lg bg-void/90 border border-line/80">
                <div className="text-[9px] text-dim">PODS</div>
                <div className="text-xs font-bold text-bone mt-0.5">{drv.podiums ?? '—'}</div>
              </div>
              <div className="py-1.5 px-1 rounded-lg bg-void/90 border border-line/80">
                <div className="text-[9px] text-dim">WINS</div>
                <div className="text-xs font-bold text-bone mt-0.5">{drv.wins ?? '—'}</div>
              </div>
              <div className="py-1.5 px-1 rounded-lg bg-void/90 border border-line/80">
                <div className="text-[9px] text-dim">LAST</div>
                <div className="text-xs font-bold text-bone mt-0.5">{drv.last ?? '—'}</div>
              </div>
            </div>
          </button>
        );
      };

      const renderTeamCube = (team) => {
        const isChamp = Boolean(team.isChampion);
        const accent = isChamp ? GOLD : team.color;
        const selected = compareSelection.some(i => i.id === team.id);
        return (
          <button
            key={team.id}
            onClick={() => handleCubeSelect(team, 'team')}
            style={{ borderColor: selected ? '#D2FF00' : `${accent}70`, borderTopWidth: '4px', borderTopColor: accent }}
            className={`mach-cube aspect-square p-5 rounded-2xl border flex flex-col justify-between text-left ${
              isChamp ? 'champ-foil' : 'card-gradient'
            }`}
          >
            <div className="flex items-center justify-between w-full font-mono text-xs">
              <span className="px-2 py-0.5 rounded-lg bg-void border border-line font-extrabold" style={{ color: accent }}>
                {isChamp ? '👑 ' : ''}{team.code}
              </span>
              <span className="font-bold" style={{ color: isChamp ? GOLD : undefined }}>P{team.rank}</span>
            </div>

            <div className="my-auto py-2">
              <div className="font-mono text-[10px] uppercase tracking-widest text-dim">{team.chassis}</div>
              <h3 className="font-display text-lg sm:text-xl font-extrabold text-bone leading-snug mt-1">
                {team.name}
              </h3>
              <div className="text-xs text-dim truncate mt-1">{team.powerUnit}</div>
            </div>

            <div className="w-full pt-3 border-t border-line flex items-center justify-between font-mono text-[11px]">
              <span className="font-extrabold" style={{ color: isChamp ? GOLD : undefined }}>{team.points} PTS</span>
              <span className="text-dim">{compareMode ? (selected ? '✓ Selected' : '+ Compare') : 'Dossier →'}</span>
            </div>
          </button>
        );
      };

      const renderAirlinerCube = (ac) => {
        const selected = compareSelection.some(i => i.id === ac.id);
        return (
          <button
            key={ac.id}
            onClick={() => handleCubeSelect(ac, 'airliner')}
            style={{ borderColor: selected ? '#D2FF00' : `${ac.color}70`, borderTopWidth: '4px', borderTopColor: ac.color }}
            className="mach-cube aspect-square p-5 rounded-2xl card-gradient border flex flex-col justify-between text-left"
          >
            <div className="flex items-center justify-between w-full font-mono text-xs">
              <span className="px-2 py-0.5 rounded-lg bg-void border border-line text-bone font-extrabold">{ac.code}</span>

            <div className="my-auto py-2">
              <div className="font-mono text-[11px] uppercase tracking-wider text-dim">{ac.manufacturer}</div>
              <h3 className="font-display text-lg sm:text-xl font-extrabold text-bone leading-snug mt-0.5">{ac.model}</h3>

            <div className="w-full pt-3 border-t border-line flex items-center justify-between font-mono text-[11px]">

              <span className="text-dim">{compareMode ? (selected ? '✓ Selected' : '+ Compare') : 'Specs →'}</span>
            </div>
          </button>
        );
      };

      // =====================================================================
      // FULL ARTICLE READER PAGE
      // =====================================================================
      const renderArticleReader = () => {
        const art = articles.find(a => a.id === route.articleId) || articles[0];
        if (!art) return null;
        const isTrack = String(art.section || 'track').toLowerCase() === 'track';
        const linkedDrivers = drivers.filter(d => (art.relatedDriverIds || []).includes(d.id));
        const linkedTeams = teams.filter(t => (art.relatedTeamIds || []).includes(t.id));
        const linkedAirliners = airliners.filter(a => (art.relatedAirlinerIds || []).includes(a.id));

        return (
          <div className="max-w-4xl mx-auto space-y-6">
            <div className="flex items-center justify-between gap-3">
              <button
                onClick={() => navigate({ view: isTrack ? 'track' : 'sky' })}
                className="px-3.5 py-2 rounded-xl bg-panel border border-line hover:border-bone font-mono text-xs text-bone"
              >
                ← Back to {isTrack ? 'Track Briefings' : 'Sky & Mach'}
              </button>
              <button
                onClick={() => copyShareLink('article', art.id)}
                className="px-3.5 py-2 rounded-xl bg-panel border border-line hover:border-ember font-mono text-xs text-ember"
              >
                🔗 Share Briefing
              </button>
            </div>

            <article className="p-6 sm:p-10 rounded-3xl card-gradient border border-line space-y-6 shadow-2xl">
              <div className="flex flex-wrap items-center gap-2 font-mono text-xs">
                <span className={`px-2.5 py-0.5 rounded-lg font-extrabold ${
                  isTrack ? 'bg-crimson text-white' : 'bg-ember text-void'
                }`}>
                  {art.seriesBadge}
                </span>
                <span className="text-dim">{art.tag}</span>
                <span className="text-dim">• {art.date} • {art.readTime}</span>
              </div>

              <h1 className="font-syne text-2xl sm:text-4xl font-extrabold text-bone leading-tight">{art.title}</h1>
              <p className="text-base text-dim font-medium leading-relaxed border-l-2 border-crimson pl-4">
                {art.summary}
              </p>

              <div className="space-y-4 text-sm sm:text-base text-bone/90 leading-relaxed pt-4 border-t border-line">
                {(art.content || []).map((para, i) => (
                  <p key={i}>{para}</p>
                ))}
              </div>

              {(linkedDrivers.length > 0 || linkedTeams.length > 0 || linkedAirliners.length > 0) && (
                <div className="pt-5 border-t border-line flex flex-wrap items-center gap-2">
                  <span className="font-mono text-[10px] uppercase tracking-wider text-dim mr-1">REFERENCED CUBES:</span>
                  {linkedTeams.map(t => (
                    <button key={t.id} onClick={() => setActiveDossier({ ...t, kind: 'team' })} style={{ borderColor: t.color }} className="px-3 py-1 rounded-lg bg-void border font-mono text-xs text-bone hover:bg-panel">
                      {t.name} →
                    </button>
                  ))}
                  {linkedDrivers.map(d => (
                    <button key={d.id} onClick={() => setActiveDossier({ ...d, kind: 'driver' })} style={{ borderColor: d.color }} className="px-3 py-1 rounded-lg bg-void border font-mono text-xs text-bone hover:bg-panel">
                      #{d.number} {d.name} →
                    </button>
                  ))}
                  {linkedAirliners.map(a => (
                    <button key={a.id} onClick={() => setActiveDossier({ ...a, kind: 'airliner' })} style={{ borderColor: a.color }} className="px-3 py-1 rounded-lg bg-void border font-mono text-xs text-bone hover:bg-panel">
                      {a.manufacturer} {a.model} →
                    </button>
                  ))}
                </div>
              )}
            </article>
          </div>
        );
      };

      // =====================================================================
      // TRACK OR SKY BRIEFINGS SECTION
      // =====================================================================
      const renderArticlesSection = (sectionKey) => {
        const isTrack = sectionKey === 'track';
        const sectionArticles = articles.filter(a => String(a.section || 'track').toLowerCase() === sectionKey);

        return (
          <div className="space-y-8">
            <div className="border-b border-line pb-6 flex flex-col md:flex-row md:items-end justify-between gap-4">
              <div>
                <div className={`font-mono text-xs uppercase tracking-[0.25em] font-bold ${isTrack ? 'text-crimson' : 'text-ember'}`}>
                  {isTrack ? 'MOTORSPORT TECHNICAL BRIEFINGS // F1 • F2 • FE' : 'COMMERCIAL & SUPERSONIC AEROSPACE'}
                </div>
                <h1 className="font-syne text-3xl sm:text-4xl font-extrabold text-bone mt-1">
                  {isTrack ? 'Track Intelligence Briefings' : 'Sky & Mach Briefings'}
                </h1>
              </div>

              <div className="flex flex-wrap gap-2">
                {isTrack ? (
                  <>
                    <button onClick={() => navigate({ view: 'standings' })} className="px-3.5 py-2 rounded-xl bg-panel border border-gold/60 font-mono text-xs text-gold font-bold">
                      👑 Standings →
                    </button>
                    <button onClick={() => navigate({ view: 'drivers' })} className="px-3.5 py-2 rounded-xl bg-panel border border-line hover:border-crimson font-mono text-xs text-bone">
                      Driver Cubes →
                    </button>
                  </>
                ) : (
                  <button onClick={() => navigate({ view: 'airliners' })} className="px-4 py-2 rounded-xl bg-panel border border-ember/60 font-mono text-xs text-ember font-bold">
                    Airliners Cubes →
                  </button>
                )}
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {sectionArticles.map(art => (
                <button
                  key={art.id}
                  onClick={() => navigate({ view: 'article', articleId: art.id })}
                  className="mach-cube p-6 rounded-2xl card-gradient border border-line hover:border-crimson text-left flex flex-col justify-between gap-4"
                >
                  <div className="space-y-3">
                    <div className="flex items-center justify-between font-mono text-[11px]">
                      <span className={`px-2.5 py-0.5 rounded-lg font-extrabold ${
                        isTrack ? 'bg-crimson text-white' : 'bg-ember text-void'
                      }`}>
                        {art.seriesBadge}
                      </span>
                      <span className="text-dim">{art.date} • {art.readTime}</span>
                    </div>
                    <h2 className="font-display text-xl font-extrabold text-bone leading-snug">{art.title}</h2>
                    <p className="text-xs sm:text-sm text-dim line-clamp-3">{art.summary}</p>
                  </div>
                  <div className="pt-3 border-t border-line flex items-center justify-between font-mono text-xs text-bone font-bold">
                    <span>Read Full Technical Briefing</span>
                    <span className="text-crimson">→</span>
                  </div>
                </button>
              ))}
            </div>
          </div>

      };

      // =====================================================================
      // CHAMPIONSHIP STANDINGS + SEASON TRAJECTORY POINTS & FORM GRAPH
      // =====================================================================
      const renderStandingsPage = () => {
        const seriesDrivers = [...drivers]
          .filter(d => d.series === standingsSeries)
          .sort((a, b) => Number(b.points || 0) - Number(a.points || 0));
        const seriesTeams = [...teams]
          .filter(t => t.series === standingsSeries)
          .sort((a, b) => Number(b.points || 0) - Number(a.points || 0));

        const champDriver = seriesDrivers.find(d => d.isChampion) || seriesDrivers[0];
        const champTeam = seriesTeams.find(t => t.isChampion) || seriesTeams[0];

        // Chronological races for this championship (oldest -> newest)
        const seriesSavedRaces = [...savedRaces]
          .filter(r => {
            const s = String(r.series || 'Formula 1').toUpperCase();
            if (standingsSeries === 'F1') return s.includes('1') || s === 'F1';
            if (standingsSeries === 'F2') return s.includes('2') || s === 'F2';
            if (standingsSeries === 'FE') return s.includes('E') || s === 'FE';
            return true;
          })
          .reverse();

        const contenders = (trajectoryTarget === 'drivers' ? seriesDrivers : seriesTeams).slice(0, 8);
        const roundsList = seriesSavedRaces.length > 0
          ? seriesSavedRaces
          : [{ id: 'fallback-r1', shortTitle: raceSummary.shortTitle || 'R1', raceName: raceSummary.raceName, standings: raceSummary.standings || [] }];

        const DISTINCT_PALETTE = ['#9333EA', '#FF8000', '#FF1E00', '#16A34A', '#0EA5E9', '#EC4899', '#94A3B8', '#FACC15'];

        const overrideKey = `${standingsSeries}_${trajectoryTarget}`;
        const activeOverride = customTrajectory?.[overrideKey];
        const useManualGraph = Boolean(activeOverride && Array.isArray(activeOverride.roundLabels) && activeOverride.roundLabels.length > 0 && activeOverride.series);

        const chartData = contenders.map((entity, cIdx) => {
          const lastName = trajectoryTarget === 'drivers'
            ? String(entity.name || '').trim().split(' ').slice(-1)[0]
            : (entity.code || entity.name);

          let fullSeriesPoints = [];
          if (useManualGraph) {
            const rawArr = Array.isArray(activeOverride.series[entity.id])
              ? activeOverride.series[entity.id]
              : activeOverride.roundLabels.map((_, idx) => Math.round((Number(entity.points || 0) * (idx + 1)) / activeOverride.roundLabels.length));
            fullSeriesPoints = [
              { roundIdx: 0, ptsEarned: 0, cumulative: 0, finishPos: 'START' },
              ...activeOverride.roundLabels.map((_, rIdx) => {
                const cum = Number(rawArr[rIdx] ?? 0);
                const prevCum = rIdx === 0 ? 0 : Number(rawArr[rIdx - 1] ?? 0);
                return {
                  roundIdx: rIdx + 1,
                  ptsEarned: Math.max(0, cum - prevCum),
                  cumulative: cum,
                  finishPos: `R${rIdx + 1}`
                };
              })
            ];
          } else {
            let runningTotal = 0;
            const roundPoints = roundsList.map((r, rIdx) => {
              const rows = r.standings || [];
              let ptsEarned = 0;
              let finishPos = '—';
              if (trajectoryTarget === 'drivers') {
                const match = rows.find(row => String(row.code || '').toUpperCase() === String(entity.code || '').toUpperCase());
                if (match) {
                  ptsEarned = Number(match.points || 0);
                  finishPos = match.pos || '—';
                }
              } else {
                const teamMatches = rows.filter(row =>
                  String(row.team || '').toLowerCase().includes(String(entity.name || '').toLowerCase()) ||
                  String(entity.name || '').toLowerCase().includes(String(row.team || '').toLowerCase())
                );
                ptsEarned = teamMatches.reduce((acc, m) => acc + Number(m.points || 0), 0);
                if (teamMatches.length) finishPos = `P${teamMatches[0].pos}`;
              }
              runningTotal += ptsEarned;
              return { roundIdx: rIdx + 1, ptsEarned, cumulative: runningTotal, finishPos };
            });

            const totalFromRounds = roundPoints[roundPoints.length - 1]?.cumulative || 0;
            const baseOffset = Math.max(0, Number(entity.points || 0) - totalFromRounds);
            const adjustedRounds = roundPoints.map(pt => ({
              ...pt,
              cumulative: pt.cumulative + baseOffset
            }));

            fullSeriesPoints = [
              { roundIdx: 0, ptsEarned: 0, cumulative: 0, finishPos: 'START' },
              ...adjustedRounds
            ];
          }

          return {
            id: entity.id,
            code: entity.code,
            name: entity.name,
            shortLabel: lastName,
            color: entity.isChampion ? GOLD : (DISTINCT_PALETTE[cIdx % DISTINCT_PALETTE.length] || entity.color || '#FF1E00'),
            isChampion: Boolean(entity.isChampion),
            points: fullSeriesPoints
          };
        });

        const effectiveRoundsMeta = useManualGraph
          ? activeOverride.roundLabels.map((lbl, idx) => ({ shortTitle: lbl || `R${idx + 1}`, raceName: `${standingsSeries} Round ${idx + 1} — ${lbl || ''}` }))
          : roundsList;

        const totalSteps = effectiveRoundsMeta.length;
        const rawMax = Math.max(25, ...chartData.flatMap(c => c.points.map(p => p.cumulative)));
        const niceStep = rawMax <= 80 ? 20 : rawMax <= 160 ? 25 : 50;
        const maxPoints = Math.ceil(rawMax / niceStep) * niceStep;
        const yTicks = [];
        for (let v = 0; v <= maxPoints; v += niceStep) yTicks.push(v);

        const svgW = 720;
        const svgH = 290;
        const padLeft = 58;
        const padRight = 24;
        const padTop = 18;
        const padBottom = 42;
        const plotW = svgW - padLeft - padRight;
        const plotH = svgH - padTop - padBottom;

        const getX = (stepIdx) => padLeft + (totalSteps === 0 ? 0 : (stepIdx / totalSteps) * plotW);
        const getY = (pts) => padTop + plotH - (pts / maxPoints) * plotH;

        const activeStepIdx = hoveredRoundIdx !== null && hoveredRoundIdx <= totalSteps ? hoveredRoundIdx : totalSteps;

        return (
          <div className="space-y-8">
            <div className="border-b border-line pb-6 flex flex-col md:flex-row md:items-end justify-between gap-4">
              <div>
                <div className="font-mono text-xs uppercase tracking-[0.25em] text-gold font-bold">
                  WORLD CHAMPIONSHIP STANDINGS // WDC & WCC
                </div>
                <h1 className="font-syne text-3xl sm:text-4xl font-extrabold text-bone mt-1">
                  {standingsSeries} Championship Standings
                </h1>
              </div>

              <div className="flex flex-wrap gap-2">
                {['F1', 'F2', 'FE'].map(s => (
                  <button

                    onClick={() => { setStandingsSeries(s); setHoveredRoundIdx(null); setHighlightedContenderId(null); }}

                      standingsSeries === s
                        ? 'bg-gradient-to-r from-crimson to-ember text-white border-crimson'
                        : 'bg-panel border-line text-dim hover:text-bone'
                    }`}
                  >
                    {s}
                  </button>
                ))}
              </div>
            </div>

            {/* Reigning World Champions Gold Banner */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {champDriver && (
                <button
                  onClick={() => setActiveDossier({ ...champDriver, kind: 'driver' })}
                  className="champ-foil p-5 rounded-2xl border-2 text-left flex items-center justify-between transition-transform hover:-translate-y-0.5"
                >
                  <div>
                    <div className="font-mono text-[10px] uppercase tracking-widest text-gold font-extrabold">
                      👑 {standingsSeries} DRIVERS’ CHAMPION
                    </div>
                    <div className="font-display text-2xl font-extrabold text-bone mt-0.5">{champDriver.name}</div>
                    <div className="font-mono text-xs text-dim mt-0.5">{champDriver.team} • #{champDriver.number}</div>
                  </div>
                  <div className="text-right font-mono">
                    <div className="text-2xl font-extrabold text-gold">{champDriver.points}</div>
                    <div className="text-[10px] text-gold/80">PTS</div>
                  </div>
                </button>
              )}

              {champTeam && (
                <button
                  onClick={() => setActiveDossier({ ...champTeam, kind: 'team' })}
                  className="champ-foil p-5 rounded-2xl border-2 text-left flex items-center justify-between transition-transform hover:-translate-y-0.5"
                >
                  <div>
                    <div className="font-mono text-[10px] uppercase tracking-widest text-gold font-extrabold">
                      👑 {standingsSeries} CONSTRUCTORS’ CHAMPION
                    </div>
                    <div className="font-display text-2xl font-extrabold text-bone mt-0.5">{champTeam.name}</div>
                    <div className="font-mono text-xs text-dim mt-0.5">{champTeam.chassis} • {champTeam.powerUnit}</div>
                  </div>
                  <div className="text-right font-mono">
                    <div className="text-2xl font-extrabold text-gold">{champTeam.points}</div>
                    <div className="text-[10px] text-gold/80">PTS</div>
                  </div>
                </button>

            </div>

            {/* Season Trajectory Points & Form Graph */}
            <section className="p-5 sm:p-6 rounded-2xl card-gradient border border-line space-y-4">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-line pb-4">
                <div>
                  <div className="font-mono text-[10px] uppercase tracking-[0.22em] text-crimson font-bold">
                    CHAMPIONSHIP POINTS PROGRESSION // ROUND 0 TO ROUND {totalSteps}
                  </div>
                  <h2 className="font-display text-lg sm:text-xl font-extrabold text-bone mt-0.5">
                    {standingsSeries} {trajectoryTarget === 'drivers' ? 'Drivers' : 'Constructors'} Points Trajectory
                  </h2>
                </div>

                <div className="flex items-center gap-2">
                  <button
                    onClick={() => { setTrajectoryTarget('drivers'); setHighlightedContenderId(null); }}
                    className={`px-3 py-1.5 rounded-lg font-mono text-[11px] font-bold border ${
                      trajectoryTarget === 'drivers'

                    Drivers

                  <button
                    onClick={() => { setTrajectoryTarget('teams'); setHighlightedContenderId(null); }}
                    className={`px-3 py-1.5 rounded-lg font-mono text-[11px] font-bold border ${
                      trajectoryTarget === 'teams'

                        : 'bg-void border-line text-dim hover:text-bone'

                    Constructors

                </div>
              </div>

              {/* Multi-Row Top Colored Dot Legend */}
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-x-4 gap-y-2 py-2 px-3 rounded-xl bg-void/70 border border-line/80">

                  return (
                    <button

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-center">

                    <text

                      fill="var(--text-bone)"
                      fontSize="12"
                      fontFamily="Inter, sans-serif"
                      fontWeight="600"

                    {/* X-Axis Round Numbers (0, 1, 2, 3...) & Hover Hit Columns */}

                      const x = getX(stepIdx);
                      const isActive = stepIdx === activeStepIdx;
                      const colW = plotW / Math.max(1, totalSteps + 1);
                      return (
                        <g
                          key={stepIdx}
                          className="cursor-pointer"
                          onMouseEnter={() => setHoveredRoundIdx(stepIdx)}
                          onClick={() => setHoveredRoundIdx(stepIdx)}
                        >
                          <rect
                            x={x - colW / 2}
                            y={padTop}
                            width={colW}
                            height={plotH + 22}
                            fill="transparent"
                          />
                          {isActive && (
                            <line
                              x1={x}
                              y1={padTop}
                              x2={x}
                              y2={padTop + plotH}
                              stroke="var(--text-dim)"
                              strokeWidth="1.2"
                              strokeDasharray="3 3"
                            />
                          )}
                          <text
                            x={x}
                            y={padTop + plotH + 18}
                            textAnchor="middle"
                            fill={isActive ? '#FF6B00' : 'var(--text-bone)'}
                            fontSize="11"
                            fontFamily="JetBrains Mono, monospace"
                            fontWeight={isActive ? '800' : '600'}
                          >
                            {stepIdx}
                          </text>
                        </g>
                      );
                    })}

                    {/* Centered X-Axis Title */}
                    <text
                      x={padLeft + plotW / 2}
                      y={svgH - 4}
                      textAnchor="middle"
                      fill="var(--text-bone)"
                      fontSize="12"
                      fontFamily="Inter, sans-serif"
                      fontWeight="600"
                    >
                      Round
                    </text>

                    {/* Trajectory Polylines & Nodes */}
                    {chartData.map((contender) => {
                      const isDimmed = highlightedContenderId && highlightedContenderId !== contender.id;
                      const isHighlighted = highlightedContenderId === contender.id;
                      const coords = contender.points.map(pt => `${getX(pt.roundIdx)},${getY(pt.cumulative)}`).join(' ');
                      return (
                        <g key={contender.id} style={{ opacity: isDimmed ? 0.2 : 1, transition: 'opacity 0.2s ease' }}>
                          <polyline
                            fill="none"
                            stroke={contender.color}
                            strokeWidth={isHighlighted || contender.isChampion ? '3' : '2.2'}
                            strokeLinecap="round"
                            strokeLinejoin="round"
                            points={coords}
                          />
                          {contender.points.map((pt) => {
                            const cx = getX(pt.roundIdx);
                            const cy = getY(pt.cumulative);
                            const isActive = pt.roundIdx === activeStepIdx;
                            return (
                              <circle
                                key={pt.roundIdx}
                                cx={cx}
                                cy={cy}
                                r={isActive ? '4.5' : '3'}
                                fill={contender.color}
                              />
                            );
                          })}
                        </g>
                      );
                    })}
                  </svg>
                </div>

                {/* Round-by-Round Telemetry Readout Card */}
                <div className="lg:col-span-4 p-4 rounded-xl bg-void border border-line space-y-2.5">
                  <div className="flex items-center justify-between font-mono text-[10px] uppercase tracking-wider">
                    <span className="text-ember font-bold">
                      {activeStepIdx === 0 ? 'ROUND 0 // SEASON START' : `ROUND ${activeStepIdx} SNAPSHOT`}
                    </span>
                    <span className="text-dim">
                      {activeStepIdx === 0 ? 'GRID 0 PTS' : (effectiveRoundsMeta[activeStepIdx - 1]?.shortTitle || 'RACE')}
                    </span>
                  </div>
                  <div className="text-xs font-semibold text-bone truncate">
                    {activeStepIdx === 0
                      ? `${standingsSeries} Pre-Season Baseline`
                      : (effectiveRoundsMeta[activeStepIdx - 1]?.raceName || raceSummary.raceName)}
                  </div>
                  <div className="space-y-1.5 pt-2 border-t border-line max-h-52 overflow-y-auto pr-1">
                    {chartData
                      .slice()
                      .sort((a, b) => (b.points[activeStepIdx]?.cumulative || 0) - (a.points[activeStepIdx]?.cumulative || 0))
                      .map((c) => {
                        const snap = c.points[activeStepIdx] || { ptsEarned: 0, cumulative: 0, finishPos: '—' };
                        return (
                          <div key={c.id} className="flex items-center justify-between font-mono text-xs">
                            <div className="flex items-center gap-2 min-w-0">
                              <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ backgroundColor: c.color }}></span>
                              <span className="text-bone font-bold truncate">{c.shortLabel}</span>
                              {activeStepIdx > 0 && (
                                <span className="text-[10px] text-dim">
                                  ({snap.finishPos === 'NC' ? 'NC' : `P${snap.finishPos}`})
                                </span>
                              )}
                            </div>
                            <div className="flex items-center gap-2 shrink-0">
                              {activeStepIdx > 0 && snap.ptsEarned > 0 && (
                                <span className="text-[10px] text-emerald-400">+{snap.ptsEarned}</span>
                              )}
                              <span className="font-extrabold" style={{ color: c.isChampion ? GOLD : undefined }}>
                                {snap.cumulative} PTS
                              </span>
                            </div>
                          </div>
                        );
                      })}
                  </div>
                </div>
              </div>
            </section>

            {/* Drivers vs Constructors Toggle */}
            <div className="flex gap-2">
              <button
                onClick={() => setStandingsTab('drivers')}
                className={`px-4 py-2 rounded-xl font-mono text-xs uppercase border ${
                  standingsTab === 'drivers' ? 'bg-panel border-crimson text-bone font-bold' : 'bg-void border-line text-dim'
                }`}
              >
                Drivers’ Championship ({seriesDrivers.length})
              </button>
              <button
                onClick={() => setStandingsTab('teams')}
                className={`px-4 py-2 rounded-xl font-mono text-xs uppercase border ${
                  standingsTab === 'teams' ? 'bg-panel border-ember text-bone font-bold' : 'bg-void border-line text-dim'
                }`}
              >
                Constructors’ Championship ({seriesTeams.length})
              </button>
            </div>

            {standingsTab === 'drivers' ? (
              <div className="rounded-2xl bg-panel border border-line overflow-hidden">
                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="border-b border-line bg-void/70 font-mono text-[10px] uppercase text-dim">
                        <th className="py-3.5 px-4">POS</th>
                        <th className="py-3.5 px-4">DRIVER</th>
                        <th className="py-3.5 px-4">TEAM</th>
                        <th className="py-3.5 px-4">RECENT FORM</th>
                        <th className="py-3.5 px-4">WINS</th>
                        <th className="py-3.5 px-4 text-right">POINTS</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-line/60 text-sm">
                      {seriesDrivers.map((d, idx) => {
                        const isChamp = Boolean(d.isChampion);
                        const formList = roundsList.slice(-5).map(r => {
                          const m = (r.standings || []).find(row => String(row.code || '').toUpperCase() === String(d.code || '').toUpperCase());
                          return m ? (m.pos === 'NC' ? 'NC' : `P${m.pos}`) : '—';
                        });
                        return (
                          <tr
                            key={d.id}
                            onClick={() => setActiveDossier({ ...d, kind: 'driver' })}
                            className={`cursor-pointer transition-colors ${
                              isChamp ? 'bg-gold/15 hover:bg-gold/20' : 'hover:bg-void/60'
                            }`}
                          >
                            <td className={`py-3.5 px-4 font-mono font-extrabold ${isChamp ? 'text-gold' : 'text-bone'}`}>
                              {isChamp ? '👑 1' : idx + 1}
                            </td>
                            <td className="py-3.5 px-4 font-bold text-bone">
                              <span className="inline-block w-2.5 h-2.5 rounded-full mr-2" style={{ backgroundColor: isChamp ? GOLD : d.color }}></span>
                              {d.name}
                              {isChamp && (
                                <span className="ml-2 px-2 py-0.5 rounded bg-gold/20 border border-gold/60 font-mono text-[9px] text-gold">
                                  WORLD CHAMPION
                                </span>
                              )}
                            </td>
                            <td className="py-3.5 px-4 text-xs text-dim">{d.team}</td>
                            <td className="py-3.5 px-4">
                              <div className="flex items-center gap-1 font-mono text-[10px]">

                                    key={fi}

                                        ? 'bg-ember/15 border-ember/50 text-ember font-bold'

        const categories = ['ALL', ...Array.from(new Set(glossaryTerms.map(g => g.category)))];
        const filteredTerms = glossaryCategory === 'ALL'
          ? glossaryTerms
          : glossaryTerms.filter(g => g.category === glossaryCategory);
        const currentTerm = glossaryTerms.find(g => g.term === activeGlossaryTerm?.term) || filteredTerms[0] || glossaryTerms[0];

        return (
          <div className="space-y-8">

                    <h1 className="font-syne text-2xl font-extrabold text-bone">Unlock Studio CMS</h1>
                    <p className="text-xs text-dim">Enter Administrator PIN to publish briefings, edit race classifications, and update championship points.</p>
                    <form
                      onSubmit={(e) => {
                        e.preventDefault();
                        if (pinInput.trim() === ADMIN_PIN) {
                          setIsAdmin(true);

                      }}
                      className="space-y-3"
                    >
                      <input
                        type="password"
                        value={pinInput}
                        onChange={e => setPinInput(e.target.value)}
                        placeholder="Enter Administrator PIN"
                        className="w-full px-4 py-2.5 rounded-xl bg-void border border-line font-mono text-sm text-bone focus:border-crimson focus:outline-none"
                      />
                      <button type="submit" className="w-full py-2.5 rounded-xl bg-gradient-to-r from-crimson to-ember text-white font-mono text-xs font-extrabold uppercase tracking-wider">

                    teams={teams}
                    setTeams={setTeams}
                    drivers={drivers}
                    setDrivers={setDrivers}
                    airliners={airliners}
                    setAirliners={setAirliners}
                    articles={articles}
                    setArticles={setArticles}
                    glossaryTerms={glossaryTerms}
                    setGlossaryTerms={setGlossaryTerms}
                    customTrajectory={customTrajectory}
                    setCustomTrajectory={setCustomTrajectory}

                    savedRaces={savedRaces}

          <EntityDossierModal item={activeDossier} onClose={() => setActiveDossier(null)} onCopyShare={copyShareLink} />
          <CompareModal items={compareSelection} onClose={() => setCompareSelection([])} />

          <SearchModal
            isOpen={searchOpen}
            onClose={() => setSearchOpen(false)}
            teams={teams}
            drivers={drivers}

          {toastMsg && (

          )}
