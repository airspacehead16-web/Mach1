    const GITHUB_REPO_OWNER = 'airspacehead16-web';
    const GITHUB_REPO_NAME = 'Mach1';
    const GITHUB_BRANCH = 'main';
    const GITHUB_DATA_FILE = 'data.json';

    const getStoredGithubToken = () => {
      try { return localStorage.getItem(GITHUB_TOKEN_KEY) || ''; } catch (e) { return ''; }
    };

    const encodeUTF8Base64 = (str) => {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      bytes.forEach(b => { bin += String.fromCharCode(b); });
      return btoa(bin);
    };

    const decodeUTF8Base64 = (b64) => {
      const bin = atob(b64.replace(/\n/g, ''));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    };

    const fetchPublicGithubData = async () => {
      try {
        const rawUrl = `https://raw.githubusercontent.com/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/${GITHUB_BRANCH}/${GITHUB_DATA_FILE}?t=${Date.now()}`;
        const res = await fetch(rawUrl, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data && typeof data === 'object') return data;
        }
      } catch (e) {}

      try {
        const apiUrl = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/contents/${GITHUB_DATA_FILE}?ref=${GITHUB_BRANCH}&t=${Date.now()}`;
        const headers = { Accept: 'application/vnd.github+json' };
        const token = getStoredGithubToken();
        if (token) headers.Authorization = `Bearer ${token}`;
        const res = await fetch(apiUrl, { headers, cache: 'no-store' });
        if (res.ok) {
          const json = await res.json();
          if (json && json.content) return JSON.parse(decodeUTF8Base64(json.content));
        }
      } catch (e) {}
      return null;
    };

    const pushToGithubRepo = async (payloadObj) => {
      const token = getStoredGithubToken();
      if (!token) return { ok: false, noToken: true };

      const apiUrl = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/contents/${GITHUB_DATA_FILE}`;
      const headers = {
        Authorization: `Bearer ${token}`,
        Accept: 'application/vnd.github+json',
        'Content-Type': 'application/json'
      };

      try {
        let existingSha = null;
        const getRes = await fetch(`${apiUrl}?ref=${GITHUB_BRANCH}&t=${Date.now()}`, { headers, cache: 'no-store' });
        if (getRes.ok) {
          const existingJson = await getRes.json();
          existingSha = existingJson.sha || null;
        }

        const body = {
          message: `MACH1 CMS: Sync intelligence data (${new Date().toISOString()})`,
          content: encodeUTF8Base64(JSON.stringify(payloadObj, null, 2)),
          branch: GITHUB_BRANCH
        };
        if (existingSha) body.sha = existingSha;

        const putRes = await fetch(apiUrl, {
          method: 'PUT',
          headers,
          body: JSON.stringify(body)
        });

        if (!putRes.ok) {
          const errData = await putRes.json().catch(() => ({}));
          return { ok: false, error: errData.message || `GitHub API Error (${putRes.status})` };
        }
        return { ok: true };
      } catch (e) {
        return { ok: false, error: e?.message || 'Network error pushing to GitHub' };

    function SearchModal({ isOpen, onClose, teams, drivers, airliners, articles, onSelectDossier, navigate }) {
      const [q, setQ] = useState('');
      useEffect(() => { if (isOpen) setQ(''); }, [isOpen]);
      if (!isOpen) return null;

      const term = q.trim().toLowerCase();
      const matchedDrivers = term
        ? (drivers || []).filter(d =>
            String(d?.name || '').toLowerCase().includes(term) ||
            String(d?.code || '').toLowerCase().includes(term) ||
            String(d?.team || '').toLowerCase().includes(term)
          )
        : [];
      const matchedTeams = term
        ? (teams || []).filter(t =>
            String(t?.name || '').toLowerCase().includes(term) ||
            String(t?.chassis || '').toLowerCase().includes(term)
          )
        : [];
      const matchedAirliners = term
        ? (airliners || []).filter(a =>
            String(a?.model || '').toLowerCase().includes(term) ||
            String(a?.manufacturer || '').toLowerCase().includes(term)
          )
        : [];
      const matchedArticles = term
        ? (articles || []).filter(a =>
            String(a?.title || '').toLowerCase().includes(term) ||
            String(a?.summary || '').toLowerCase().includes(term)
          )
        : [];

      return (
        <div className="fixed inset-0 z-50 bg-black/75 flex items-start justify-center pt-20 px-4" onClick={onClose}>
          <div className="w-full max-w-2xl rounded-xl bg-charcoal border border-graphite overflow-hidden shadow-2xl" onClick={e => e.stopPropagation()}>
            <div className="flex items-center px-4 py-3.5 border-b border-graphite gap-3">
              <span className="font-mono text-scarlet">⌕</span>
              <input
                type="text"
                autoFocus
                value={q}
                onChange={e => setQ(e.target.value)}
                placeholder="Search Drivers, Teams, Airliners (A350, 777X, Overture), or Articles..."
                className="flex-1 bg-transparent text-sm text-offwhite placeholder-steel focus:outline-none"
              />
              <button onClick={onClose} className="font-mono text-xs text-steel hover:text-offwhite">ESC</button>
            </div>

            <div className="max-h-96 overflow-y-auto p-4 space-y-4">
              {!term && (
                <div className="text-center py-8 font-mono text-xs text-steel">
                  Start typing to jump to any Driver Cube, Team Cube, Airliner Cube, or Track/Sky Article.
                </div>
              )}

              {matchedDrivers.length > 0 && (
                <div className="space-y-1.5">
                  <div className="font-mono text-[10px] uppercase tracking-widest text-steel">DRIVER CUBES</div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    {matchedDrivers.map(d => (
                      <button
                        key={d.id}
                        onClick={() => { onSelectDossier({ ...d, kind: 'driver' }); onClose(); }}
                        className="p-2.5 rounded-lg bg-carbon border border-graphite hover:border-papaya text-left flex items-center justify-between"
                      >
                        <div>
                          <div className="text-xs font-bold text-offwhite">{d.name}</div>
                          <div className="font-mono text-[10px] text-steel">{d.series} • {d.team}</div>
                        </div>
                        <span className="font-mono text-xs font-bold" style={{ color: d.isChampion ? CHAMPION_GOLD : d.color }}>#{d.number}</span>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {matchedTeams.length > 0 && (
                <div className="space-y-1.5">
                  <div className="font-mono text-[10px] uppercase tracking-widest text-steel">CONSTRUCTOR CUBES</div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    {matchedTeams.map(t => (
                      <button
                        key={t.id}
                        onClick={() => { onSelectDossier({ ...t, kind: 'team' }); onClose(); }}
                        className="p-2.5 rounded-lg bg-carbon border border-graphite hover:border-scarlet text-left flex items-center justify-between"
                      >
                        <div>
                          <div className="text-xs font-bold text-offwhite">{t.name}</div>
                          <div className="font-mono text-[10px] text-steel">{t.series} • {t.chassis}</div>
                        </div>
                        <span className="font-mono text-xs text-steel">→</span>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {matchedAirliners.length > 0 && (
                <div className="space-y-1.5">
                  <div className="font-mono text-[10px] uppercase tracking-widest text-steel">AIRLINER CUBES</div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    {matchedAirliners.map(a => (
                      <button
                        key={a.id}
                        onClick={() => { onSelectDossier({ ...a, kind: 'airliner' }); onClose(); }}
                        className="p-2.5 rounded-lg bg-carbon border border-graphite hover:border-papaya text-left flex items-center justify-between"
                      >
                        <div>
                          <div className="text-xs font-bold text-offwhite">{a.manufacturer} {a.model}</div>
                          <div className="font-mono text-[10px] text-steel">{a.cruiseSpeed}</div>
                        </div>
                        <span className="font-mono text-xs text-papaya">{a.code}</span>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {matchedArticles.length > 0 && (
                <div className="space-y-1.5">
                  <div className="font-mono text-[10px] uppercase tracking-widest text-steel">TRACK & SKY ARTICLES</div>
                  {matchedArticles.map(art => (
                    <button
                      key={art.id}
                      onClick={() => { navigate({ view: art.section }); onClose(); }}
                      className="w-full p-2.5 rounded-lg bg-carbon border border-graphite hover:border-scarlet text-left"
                    >
                      <div className="font-mono text-[10px] uppercase text-scarlet">{String(art.section || 'track').toUpperCase()} • {art.tag}</div>
                      <div className="text-xs font-semibold text-offwhite mt-0.5">{art.title}</div>
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 8. MAIN APPLICATION COMPONENT
    // =========================================================================
    function Mach1App() {
      const [teams, setTeams] = useState(() => {
        try {
          const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (s?.teams?.length) return s.teams;
        } catch (e) {}
        return INITIAL_TEAMS;
      });

      const [drivers, setDrivers] = useState(() => {
        try {
          const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (s?.drivers?.length) return s.drivers;
        } catch (e) {}
        return INITIAL_DRIVERS;
      });

      const [airliners, setAirliners] = useState(() => {
        try {
          const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (s?.airliners?.length) return s.airliners;
        } catch (e) {}
        return INITIAL_AIRLINERS;
      });

      const [articles, setArticles] = useState(() => {
        try {
          const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (s?.articles?.length) return s.articles;
        } catch (e) {}
        return INITIAL_ARTICLES;
      });

      const [raceSummary, setRaceSummary] = useState(() => {
        try {
          const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (s?.raceSummary?.standings) return s.raceSummary;
        } catch (e) {}
        return INITIAL_RACE_SUMMARY;
      });

      const [route, setRoute] = useState({ view: 'home' });
      const [driverSeriesFilter, setDriverSeriesFilter] = useState('F1');
      const [standingsSeriesFilter, setStandingsSeriesFilter] = useState('F1');
      const [activeDossier, setActiveDossier] = useState(null);
      const [compareMode, setCompareMode] = useState(false);
      const [compareSelection, setCompareSelection] = useState([]);
      const [compareKind, setCompareKind] = useState('driver');
      const [searchOpen, setSearchOpen] = useState(false);
      const [mobileOpen, setMobileOpen] = useState(false);
      const [isAdmin, setIsAdmin] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [toastMsg, setToastMsg] = useState('');
      const [githubConnected, setGithubConnected] = useState(() => Boolean(getStoredGithubToken()));
      const [theme, setTheme] = useState(() => {
        try { return localStorage.getItem('mach1_theme') || 'dark'; } catch (e) { return 'dark'; }
      });

      useEffect(() => {
        const rootEl = document.documentElement;
        if (theme === 'light') {
          rootEl.classList.add('light-theme');
          rootEl.classList.remove('dark');
        } else {
          rootEl.classList.remove('light-theme');
          rootEl.classList.add('dark');
        }
        try { localStorage.setItem('mach1_theme', theme); } catch (e) {}
      }, [theme]);

      useEffect(() => {
        const onKey = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setSearchOpen(prev => !prev);
          } else if (e.key === 'Escape') {
            setSearchOpen(false);
            setActiveDossier(null);
            setCompareSelection([]);
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      // Shareable Deep-Link URL Hash Sync
      useEffect(() => {
        const syncFromHash = () => {
          const hash = (window.location.hash || '').replace(/^#/, '');
          if (!hash) return;
          const [prefix, entityId] = hash.split('/');
          if (['home', 'track', 'sky', 'race', 'standings', 'drivers', 'f1', 'f2', 'fe', 'airliners', 'admin'].includes(prefix)) {
            setRoute({ view: prefix });
          } else if (prefix === 'driver' && entityId) {
            const found = drivers.find(d => d.id === entityId);
            if (found) {
              setRoute({ view: 'drivers' });
              setActiveDossier({ ...found, kind: 'driver' });
            }
          } else if (prefix === 'team' && entityId) {
            const found = teams.find(t => t.id === entityId);
            if (found) {
              setRoute({ view: found.series.toLowerCase() });
              setActiveDossier({ ...found, kind: 'team' });
            }
          } else if (prefix === 'airliner' && entityId) {
            const found = airliners.find(a => a.id === entityId);
            if (found) {
              setRoute({ view: 'airliners' });
              setActiveDossier({ ...found, kind: 'airliner' });
            }
          }
        };
        syncFromHash();
        window.addEventListener('hashchange', syncFromHash);
        return () => window.removeEventListener('hashchange', syncFromHash);
      }, [drivers, teams, airliners]);

      // Pull public GitHub data.json on initial load
      useEffect(() => {
        fetchPublicGithubData().then(remote => {
          if (remote) {
            if (Array.isArray(remote.teams) && remote.teams.length) setTeams(remote.teams);
            if (Array.isArray(remote.drivers) && remote.drivers.length) setDrivers(remote.drivers);
            if (Array.isArray(remote.airliners) && remote.airliners.length) setAirliners(remote.airliners);
            if (Array.isArray(remote.articles) && remote.articles.length) setArticles(remote.articles);
            if (remote.raceSummary && remote.raceSummary.standings) setRaceSummary(remote.raceSummary);
          }
        });
      }, []);

      const notify = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3400);
      };

      const navigate = (next) => {
        setRoute(next);
        setCompareSelection([]);
        try { window.history.replaceState(null, '', `#${next.view}`); } catch (e) {}
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const openDossierWithHash = (dossierObj) => {
        setActiveDossier(dossierObj);
        try { window.history.replaceState(null, '', `#${dossierObj.kind}/${dossierObj.id}`); } catch (e) {}
      };

      const closeDossierWithHash = () => {
        setActiveDossier(null);
        try { window.history.replaceState(null, '', `#${route.view}`); } catch (e) {}
      };

      const handleShareDossier = (item) => {
        const shareUrl = `${window.location.origin}${window.location.pathname}#${item.kind}/${item.id}`;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(shareUrl).then(() => {
            notify('Direct shareable link copied to clipboard!');
          }).catch(() => notify(shareUrl));
        } else {
          notify(shareUrl);
        }
      };

      const toggleCompareCube = (item, kind) => {
        setCompareKind(kind);
        setCompareSelection(prev => {
          const exists = prev.some(x => x.id === item.id);
          if (exists) return prev.filter(x => x.id !== item.id);
          return prev.length >= 2 ? [prev[1], item] : [...prev, item];
        });
      };

      const saveAllData = async (nextTeams, nextDrivers, nextAirliners, nextArticles, nextRace) => {
        const payload = {
          teams: nextTeams,
          drivers: nextDrivers,
          airliners: nextAirliners,
          articles: nextArticles,
          raceSummary: nextRace,
          updatedAt: new Date().toISOString()
        };
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); } catch (e) {}
        const res = await pushToGithubRepo(payload);
        if (res.ok) {
          setGithubConnected(true);
          notify('Saved locally & synced to GitHub data.json!');
        } else if (!res.noToken && res.error) {
          notify(`Saved locally (GitHub sync note: ${res.error})`);
        } else {
          notify('Saved to local browser storage!');
        }
      };

      // =====================================================================
      // CUBE RENDERERS (WITH SPECIAL WORLD CHAMPION GOLD STYLING)
      // =====================================================================
      const renderDriverCube = (drv) => {
        const isSelected = compareMode && compareSelection.some(x => x.id === drv.id);
        const isChamp = Boolean(drv.isChampion);
        const accentHex = isChamp ? CHAMPION_GOLD : drv.color;

        return (
          <button
            key={drv.id}
            onClick={() => (compareMode ? toggleCompareCube(drv, 'driver') : openDossierWithHash({ ...drv, kind: 'driver' }))}
            style={{
              borderColor: isSelected ? '#FF6B00' : isChamp ? CHAMPION_GOLD : `${drv.color}65`,
              borderLeftWidth: '4px',
              borderLeftColor: accentHex
            }}
            className={`telemetry-cube p-4 rounded-xl bg-charcoal border flex flex-col justify-between text-left ${
              isChamp ? 'champion-gold-card' : ''
            } ${isSelected ? 'ring-2 ring-papaya' : ''}`}
          >
            <div>
              <div className="flex items-center justify-between w-full font-mono text-xs gap-1">
                <span className={`truncate ${isChamp ? 'text-champion font-semibold' : 'text-steel'}`}>
                  {isChamp ? '👑 ' : ''}{drv.team}
                </span>
                <div className="flex items-center gap-1.5 shrink-0">
                  {compareMode && (
                    <span className={`px-1.5 py-0.5 rounded text-[9px] font-bold ${isSelected ? 'bg-papaya text-carbon' : 'bg-carbon text-steel border border-graphite'}`}>
                      {isSelected ? 'VS ✓' : '+ VS'}
                    </span>
                  )}
                  <span className="font-bold" style={{ color: accentHex }}>
                    #{drv.number}
                  </span>
                </div>
              </div>

              <div className="flex items-center justify-between gap-2 mt-1">
                <h3 className="text-base sm:text-lg font-bold text-offwhite leading-snug">
                  {drv.name}
                </h3>
                {isChamp && (
                  <span className="px-1.5 py-0.5 rounded bg-champion text-carbon font-mono text-[9px] font-extrabold uppercase shrink-0">
                    WDC
                  </span>
                )}
              </div>
              <div className="font-mono text-[11px] text-steel mt-0.5">
                {drv.nationality || drv.flag || drv.series} • <span style={{ color: isChamp ? CHAMPION_GOLD : undefined }}>{drv.points ?? 0} PTS</span>
              </div>
            </div>

            <div className="w-full h-px bg-graphite my-3"></div>

            <div className="grid grid-cols-4 gap-1.5 w-full font-mono text-center">
              <div className="py-1.5 px-1 rounded-md bg-carbon border border-graphite/80">
                <div className="text-[9px] text-steel">POLES</div>
                <div className="text-xs font-bold text-offwhite mt-0.5">{drv.poles ?? '—'}</div>
              </div>
              <div className="py-1.5 px-1 rounded-md bg-carbon border border-graphite/80">
                <div className="text-[9px] text-steel">PODS</div>
                <div className="text-xs font-bold text-offwhite mt-0.5">{drv.podiums ?? '—'}</div>
              </div>
              <div className="py-1.5 px-1 rounded-md bg-carbon border border-graphite/80">
                <div className="text-[9px] text-steel">WINS</div>
                <div className="text-xs font-bold text-offwhite mt-0.5">{drv.wins ?? '—'}</div>
              </div>
              <div className="py-1.5 px-1 rounded-md bg-carbon border border-graphite/80">
                <div className="text-[9px] text-steel">LAST</div>
                <div className="text-xs font-bold text-offwhite mt-0.5">{drv.last ?? '—'}</div>
              </div>
            </div>
          </button>
        );
      };

      const renderTeamCube = (team) => {
        const isSelected = compareMode && compareSelection.some(x => x.id === team.id);
        const isChamp = Boolean(team.isChampion);
        const accentHex = isChamp ? CHAMPION_GOLD : team.color;

        return (
          <button
            key={team.id}
            onClick={() => (compareMode ? toggleCompareCube(team, 'team') : openDossierWithHash({ ...team, kind: 'team' }))}
            style={{
              borderColor: isSelected ? '#FF6B00' : isChamp ? CHAMPION_GOLD : `${team.color}70`,
              borderTopWidth: '4px',
              borderTopColor: accentHex
            }}
            className={`telemetry-cube aspect-square p-5 rounded-xl bg-charcoal border flex flex-col justify-between text-left ${
              isChamp ? 'champion-gold-card' : ''
            } ${isSelected ? 'ring-2 ring-papaya' : ''}`}
          >
            <div className="flex items-center justify-between w-full font-mono text-xs">
              <span
                className="px-2 py-0.5 rounded bg-carbon border font-bold"
                style={{ color: accentHex, borderColor: isChamp ? CHAMPION_GOLD : 'var(--border-graphite)' }}
              >
                {isChamp ? `👑 ${team.code}` : team.code}
              </span>
              <div className="flex items-center gap-1.5">
                {compareMode && (
                  <span className={`px-1.5 py-0.5 rounded text-[9px] font-bold ${isSelected ? 'bg-papaya text-carbon' : 'bg-carbon text-steel border border-graphite'}`}>
                    {isSelected ? 'VS ✓' : '+ VS'}
                  </span>
                )}
                <span className="font-bold" style={{ color: isChamp ? CHAMPION_GOLD : 'var(--text-steel)' }}>
                  P{team.rank}
                </span>
              </div>
            </div>

            <div className="my-auto py-1">
              <div className="flex items-center justify-between gap-2">
                <span className="font-mono text-[10px] uppercase tracking-widest text-steel">{team.chassis}</span>
                <FormulaSilhouetteSVG color={accentHex} className="w-16 h-5 opacity-90" />
              </div>
              <h3 className="text-lg sm:text-xl font-bold text-offwhite leading-snug mt-1">
                {team.name}
              </h3>
              <div className="text-xs text-steel truncate mt-1">{team.powerUnit}</div>
            </div>

            <div className="w-full pt-3 border-t border-graphite/70 flex items-center justify-between font-mono text-[11px]">
              <span className="font-bold" style={{ color: isChamp ? CHAMPION_GOLD : 'var(--text-offwhite)' }}>
                {team.points} PTS {isChamp ? '• WCC' : ''}
              </span>
              <span className="text-steel">{compareMode ? 'Select' : 'Dossier →'}</span>
            </div>
          </button>
        );
      };

      const renderAirlinerCube = (ac) => {
        const isSelected = compareMode && compareSelection.some(x => x.id === ac.id);
        const isSupersonic = String(ac.cruiseSpeed || '').includes('1.7') || String(ac.code || '') === 'OVTR';
        return (
          <button
            key={ac.id}
            onClick={() => (compareMode ? toggleCompareCube(ac, 'airliner') : openDossierWithHash({ ...ac, kind: 'airliner' }))}
            style={{
              borderColor: isSelected ? '#FF6B00' : `${ac.color}70`,
              borderTopWidth: '4px',
              borderTopColor: ac.color
            }}
            className={`telemetry-cube aspect-square p-5 rounded-xl bg-charcoal border flex flex-col justify-between text-left ${
              isSelected ? 'ring-2 ring-papaya' : ''
            }`}
          >
            <div className="flex items-center justify-between w-full font-mono text-xs">
              <span className="px-2 py-0.5 rounded bg-carbon border border-graphite text-offwhite font-bold">
                {ac.code}
              </span>
              <div className="flex items-center gap-1.5">
                {compareMode && (
                  <span className={`px-1.5 py-0.5 rounded text-[9px] font-bold ${isSelected ? 'bg-papaya text-carbon' : 'bg-carbon text-steel border border-graphite'}`}>
                    {isSelected ? 'VS ✓' : '+ VS'}
                  </span>
                )}
                <span className="text-[10px] uppercase text-papaya font-semibold">{ac.status}</span>
              </div>
            </div>

            <div className="my-auto py-1">
              <div className="flex items-center justify-between gap-2">
                <span className="font-mono text-[11px] uppercase tracking-wider text-steel">{ac.manufacturer}</span>
                <AirlinerSilhouetteSVG color={ac.color} isSupersonic={isSupersonic} className="w-16 h-6 opacity-90" />
              </div>
              <h3 className="text-lg sm:text-xl font-bold text-offwhite leading-snug mt-0.5">
                {ac.model}
              </h3>
              <div className="font-mono text-xs text-papaya mt-1.5">{ac.cruiseSpeed}</div>
            </div>

            <div className="w-full pt-3 border-t border-graphite/70 flex items-center justify-between font-mono text-[11px]">
              <span className="text-offwhite font-bold">{ac.range}</span>
              <span className="text-steel">{compareMode ? 'Select to Compare' : 'Specs →'}</span>
            </div>
          </button>
        );
      };

      // =====================================================================
      // CHAMPIONSHIP STANDINGS PAGE (DRIVERS' & CONSTRUCTORS' WITH GOLD P1)
      // =====================================================================
      const renderStandingsPage = () => {
        const seriesDrivers = [...drivers]
          .filter(d => d.series === standingsSeriesFilter)
          .sort((a, b) => Number(b.points || 0) - Number(a.points || 0));

        const seriesTeams = [...teams]
          .filter(t => t.series === standingsSeriesFilter)
          .sort((a, b) => Number(b.points || 0) - Number(a.points || 0));

        return (
          <div className="space-y-8">
            <div className="border-b border-graphite pb-6 flex flex-col md:flex-row md:items-end justify-between gap-4">
              <div>
                <div className="font-mono text-xs uppercase tracking-[0.25em] text-champion font-bold">
                  WORLD CHAMPIONSHIP STANDINGS // WDC & WCC
                </div>
                <h1 className="text-3xl sm:text-4xl font-bold text-offwhite mt-1">
                  {standingsSeriesFilter} Championship Standings
                </h1>
                <p className="text-sm text-steel mt-1.5">
                  Live Drivers’ and Constructors’ points tables with World Champion Gold highlighting for reigning and leading champions.
                </p>
              </div>

              <div className="flex gap-2">
                {['F1', 'F2', 'FE'].map(code => (
                  <button
                    key={code}
                    onClick={() => setStandingsSeriesFilter(code)}
                    className={`px-4 py-2 rounded-lg font-mono text-xs font-bold uppercase border transition-colors ${
                      standingsSeriesFilter === code
                        ? 'bg-champion text-carbon border-champion'
                        : 'bg-charcoal border-graphite text-steel hover:text-offwhite'
                    }`}
                  >
                    {code} Standings
                  </button>
                ))}
              </div>
            </div>

            <div className="grid grid-cols-1 xl:grid-cols-12 gap-6 items-start">
              {/* Drivers' Championship Table */}
              <section className="xl:col-span-7 rounded-xl bg-charcoal border border-graphite overflow-hidden">
                <div className="px-5 py-3.5 border-b border-graphite flex items-center justify-between">
                  <h2 className="font-mono text-xs uppercase tracking-[0.2em] text-offwhite font-semibold">
                    DRIVERS’ CHAMPIONSHIP ({seriesDrivers.length})
                  </h2>
                  <span className="font-mono text-[10px] text-champion font-bold">👑 GOLD = WORLD CHAMPION</span>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="border-b border-graphite bg-carbon/60 font-mono text-[10px] uppercase text-steel">
                        <th className="py-3 px-4">POS</th>
                        <th className="py-3 px-4">DRIVER</th>
                        <th className="py-3 px-4">CONSTRUCTOR</th>
                        <th className="py-3 px-4">WINS</th>
                        <th className="py-3 px-4 text-right">PTS</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-graphite/60 text-sm">
                      {seriesDrivers.map((drv, idx) => {
                        const isChamp = Boolean(drv.isChampion);
                        return (
                          <tr
                            key={drv.id}
                            onClick={() => openDossierWithHash({ ...drv, kind: 'driver' })}
                            style={isChamp ? { backgroundColor: 'rgba(212, 175, 55, 0.13)' } : undefined}
                            className="cursor-pointer hover:bg-carbon/60 transition-colors"
                          >
                            <td className="py-3 px-4 font-mono font-extrabold" style={{ color: isChamp ? CHAMPION_GOLD : 'var(--text-offwhite)' }}>
                              {idx + 1}
                            </td>
                            <td className="py-3 px-4 font-bold text-offwhite">
                              <span className="inline-block w-2.5 h-2.5 rounded-full mr-2" style={{ backgroundColor: isChamp ? CHAMPION_GOLD : drv.color }}></span>
                              {drv.name}
                              {isChamp && (
                                <span className="ml-2 px-1.5 py-0.5 rounded bg-champion text-carbon font-mono text-[9px] font-extrabold uppercase">
                                  👑 WDC
                                </span>
                              )}
                            </td>
                            <td className="py-3 px-4 text-xs text-steel">{drv.team}</td>
                            <td className="py-3 px-4 font-mono text-xs text-steel">{drv.wins ?? '—'}</td>
                            <td className="py-3 px-4 font-mono text-sm font-extrabold text-right" style={{ color: isChamp ? CHAMPION_GOLD : '#FF6B00' }}>
                              {drv.points ?? 0}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </section>

              {/* Constructors' Championship Table */}
              <section className="xl:col-span-5 rounded-xl bg-charcoal border border-graphite overflow-hidden">
                <div className="px-5 py-3.5 border-b border-graphite flex items-center justify-between">
                  <h2 className="font-mono text-xs uppercase tracking-[0.2em] text-offwhite font-semibold">
                    CONSTRUCTORS’ CHAMPIONSHIP ({seriesTeams.length})
                  </h2>
                  <span className="font-mono text-[10px] text-champion font-bold">WCC</span>

    // =========================================================================

    function AdminCMSPanel({
      teams, setTeams,
      drivers, setDrivers,
      airliners, setAirliners,
      articles, setArticles,
      raceSummary, setRaceSummary,
      saveAllData, notify,
      githubConnected, setGithubConnected,
      onLogout
    }) {
      const [tab, setTab] = useState('race');
      const [ghToken, setGhToken] = useState(() => getStoredGithubToken());
      const [showGhBox, setShowGhBox] = useState(false);

      // Article Form

      const [drvPodiums, setDrvPodiums] = useState('—');
      const [drvWins, setDrvWins] = useState('—');
      const [drvLast, setDrvLast] = useState('—');
      const [drvBio, setDrvBio] = useState('');

      // Team Cube Form (Add & Edit)
      const [editingTeamId, setEditingTeamId] = useState(null);
      const [teamSeries, setTeamSeries] = useState('F1');
      const [teamCode, setTeamCode] = useState('');
      const [teamName, setTeamName] = useState('');
      const [teamChassis, setTeamChassis] = useState('');
      const [teamPU, setTeamPU] = useState('');
      const [teamBase, setTeamBase] = useState('');
      const [teamColor, setTeamColor] = useState('#FF8000');
      const [teamRank, setTeamRank] = useState('1');
      const [teamPoints, setTeamPoints] = useState('0');
      const [teamIsChampion, setTeamIsChampion] = useState(false);
      const [teamBio, setTeamBio] = useState('');

      // Airliner Cube Form (Add & Edit)
      const [editingAirlinerId, setEditingAirlinerId] = useState(null);
      const [airMfg, setAirMfg] = useState('Airbus');
      const [airModel, setAirModel] = useState('');
      const [airCode, setAirCode] = useState('');
      const [airColor, setAirColor] = useState('#005EB8');
      const [airStatus, setAirStatus] = useState('IN SERVICE');
      const [airSpeed, setAirSpeed] = useState('Mach 0.85');
      const [airRange, setAirRange] = useState('');
      const [airEngines, setAirEngines] = useState('');
      const [airMtow, setAirMtow] = useState('250,000 kg');
      const [airCeiling, setAirCeiling] = useState('43,100 ft');
      const [airBio, setAirBio] = useState('');

      // Race Summary Editor State
      const [savedRaces, setSavedRaces] = useState(() => {
        try {
          const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (Array.isArray(s?.savedRaces) && s.savedRaces.length) return s.savedRaces;
        } catch (e) {}
        return [{ id: 'race-initial', series: 'Formula 1', circuit: 'Circuit of the Americas', status: 'OFFICIAL CLASSIFICATION', activeOnTicker: true, ...raceSummary }];
      });
      const [editingRaceId, setEditingRaceId] = useState(null);
      const [raceName, setRaceName] = useState(raceSummary.raceName || '');
      const [raceShortTitle, setRaceShortTitle] = useState(raceSummary.shortTitle || 'Race');
      const [raceFlag, setRaceFlag] = useState(raceSummary.flag || '🏁');
      const [raceSeries, setRaceSeries] = useState(raceSummary.series || 'Formula 1');
      const [raceCircuit, setRaceCircuit] = useState(raceSummary.circuit || 'Circuit of the Americas');
      const [raceWeather, setRaceWeather] = useState(raceSummary.weather || 'Dry • Track 34°C / Air 26°C');
      const [raceStatus, setRaceStatus] = useState(raceSummary.status || 'OFFICIAL CLASSIFICATION');
      const [raceFastest, setRaceFastest] = useState(raceSummary.fastestLap || '');
      const [raceDebrief, setRaceDebrief] = useState(raceSummary.debrief || '');
      const [displayOnTicker, setDisplayOnTicker] = useState(true);

      const [standingRows, setStandingRows] = useState(() =>
        (raceSummary.standings || []).map((r, i) => ({
          id: `st-${i}-${Date.now()}`,
          pos: r.pos || String(i + 1),
          name: r.name || '',
          code: r.code || '',
          team: r.team || '',
          color: r.color || '#E10600',
          interval: r.interval || (i === 0 ? 'WINNER' : '+0.000s'),
          tyresStr: Array.isArray(r.tires) ? r.tires.join(',') : (r.tyresStr || 'M'),
          pits: String(r.pits ?? 1),
          points: String(r.points ?? 0)
        }))
      );

      const [dnfRows, setDnfRows] = useState(() =>
        (raceSummary.dnfs || []).map((d, i) => ({
          id: `dnf-${i}`,
          code: d.code || '',
          name: d.name || '',
          status: d.status || 'DNF',
          lap: d.lap || 'Lap 1',
          reason: d.reason || ''
        }))
      );

      const [penRows, setPenRows] = useState(() =>
        (raceSummary.penalties || []).map((p, i) => ({
          id: `pen-${i}`,
          code: p.code || '',
          name: p.name || '',
          penalty: p.penalty || '+5s Time Penalty',
          reason: p.reason || ''
        }))
      );

      const [flagRows, setFlagRows] = useState(() =>
        (raceSummary.flags || []).map((f, i) => ({
          id: `flg-${i}`,
          type: f.type || 'GREEN FLAG',
          lap: f.lap || 'Lap 1',
          note: f.note || ''
        }))
      );

      const loadRaceIntoForm = (r) => {
        setEditingRaceId(r.id || null);
        setRaceName(r.raceName || '');
        setRaceShortTitle(r.shortTitle || 'Race');
        setRaceFlag(r.flag || '🏁');
        setRaceSeries(r.series || 'Formula 1');
        setRaceCircuit(r.circuit || '');
        setRaceWeather(r.weather || '');
        setRaceStatus(r.status || 'OFFICIAL CLASSIFICATION');
        setRaceFastest(r.fastestLap || '');
        setRaceDebrief(r.debrief || '');
        setDisplayOnTicker(r.activeOnTicker !== false);
        setStandingRows(
          (r.standings || []).map((row, i) => ({
            id: `st-${i}-${Date.now()}`,
            pos: row.pos || String(i + 1),
            name: row.name || '',
            code: row.code || '',
            team: row.team || '',
            color: row.color || '#E10600',
            interval: row.interval || '',
            tyresStr: Array.isArray(row.tires) ? row.tires.join(',') : 'M',
            pits: String(row.pits ?? 1),
            points: String(row.points ?? 0)
          }))
        );
        setDnfRows((r.dnfs || []).map((d, i) => ({ id: `dnf-${i}`, ...d })));
        setPenRows((r.penalties || []).map((p, i) => ({ id: `pen-${i}`, ...p })));
        setFlagRows((r.flags || []).map((f, i) => ({ id: `flg-${i}`, ...f })));
      };

      const handleUpdateStandingRow = (idx, field, val) => {
        setStandingRows(prev => prev.map((row, i) => {
          if (i !== idx) return row;
          const updated = { ...row, [field]: val };
          if (field === 'name') {
            const matched = drivers.find(d => d.name.toLowerCase() === val.trim().toLowerCase());
            if (matched) {
              updated.code = matched.code;
              updated.team = matched.team;
              updated.color = matched.color;
            }
          }
          if (field === 'code') {
            const matched = drivers.find(d => d.code.toLowerCase() === val.trim().toLowerCase());
            if (matched) {
              if (!updated.name) updated.name = matched.name;
              updated.team = matched.team;
              updated.color = matched.color;
            }
          }
          return updated;
        }));
      };

      const handleAutoSyncStandingsFromRaces = () => {
        const teamBonus = {};
        const driverBonus = {};
        savedRaces.forEach(sr => {
          (sr.standings || []).forEach(st => {
            const pts = Number(st.points || 0);
            if (!pts) return;
            const matchedTeam = teams.find(
              t => t.name.toLowerCase().includes(String(st.team || '').toLowerCase()) ||
                   String(st.team || '').toLowerCase().includes(t.code.toLowerCase())
            );
            if (matchedTeam) {
              teamBonus[matchedTeam.id] = (teamBonus[matchedTeam.id] || 0) + pts;
            }
            const matchedDriver = drivers.find(
              d => d.code.toLowerCase() === String(st.code || '').toLowerCase() ||
                   d.name.toLowerCase() === String(st.name || '').toLowerCase()
            );
            if (matchedDriver) {
              driverBonus[matchedDriver.id] = (driverBonus[matchedDriver.id] || 0) + pts;
            }
          });
        });

        const updatedTeams = teams.map(tm =>
          teamBonus[tm.id] ? { ...tm, points: teamBonus[tm.id] } : tm
        );
        const updatedDrivers = drivers.map(dr =>
          driverBonus[dr.id] ? { ...dr, points: driverBonus[dr.id] } : dr
        );
        setTeams(updatedTeams);
        setDrivers(updatedDrivers);
        saveAllData(updatedTeams, updatedDrivers, airliners, articles, raceSummary);
        notify('Synced Drivers’ & Constructors’ points from Saved Races!');
      };

      const handleSaveRace = (e) => {
        e.preventDefault();
        const formattedStandings = standingRows
          .filter(r => r.name.trim() || r.code.trim())
          .map((r, i) => {
            const matched = drivers.find(
              d => d.code.toLowerCase() === r.code.trim().toLowerCase() || d.name.toLowerCase() === r.name.trim().toLowerCase()
            );
            return {
              pos: r.pos.trim() || String(i + 1),
              code: (r.code.trim() || r.name.trim().slice(0, 3) || 'DRV').toUpperCase(),
              name: r.name.trim() || matched?.name || 'Driver',
              team: r.team.trim() || matched?.team || 'Constructor',
              color: r.color || matched?.color || '#E10600',
              interval: r.interval.trim() || (i === 0 ? 'WINNER' : '+0.000s'),
              tires: (r.tyresStr || 'M').split(',').map(t => t.trim().toUpperCase()).filter(Boolean),
              pits: Number(r.pits || 0),
              points: Number(r.points || 0)
            };
          });

        const formattedDnfs = dnfRows.filter(d => d.name.trim() || d.code.trim()).map(d => ({
          code: d.code.trim().toUpperCase() || 'DNF',
          name: d.name.trim() || 'Driver',
          status: d.status.trim() || 'DNF',
          lap: d.lap.trim() || 'Lap 1',
          reason: d.reason.trim()
        }));

        const formattedPens = penRows.filter(p => p.name.trim() || p.code.trim()).map(p => ({
          code: p.code.trim().toUpperCase() || 'PEN',
          name: p.name.trim() || 'Driver',
          penalty: p.penalty.trim() || '+5s Time Penalty',
          reason: p.reason.trim()
        }));

        const formattedFlags = flagRows.filter(f => f.type.trim() || f.note.trim()).map(f => ({
          type: f.type.trim().toUpperCase() || 'GREEN FLAG',
          lap: f.lap.trim() || 'Lap 1',
          note: f.note.trim()
        }));

        const raceRecord = {
          id: editingRaceId || `race-${Date.now()}`,
          raceName: raceName.trim() || 'Grand Prix Classification',
          shortTitle: raceShortTitle.trim() || 'Race',
          flag: raceFlag.trim() || '🏁',
          series: raceSeries,
          circuit: raceCircuit.trim(),
          date: new Date().toISOString().slice(0, 10),
          laps: raceSummary.laps || 'Official Race Distance',
          weather: raceWeather.trim() || 'Dry • 24°C',
          status: raceStatus,
          fastestLap: raceFastest.trim(),
          debrief: raceDebrief.trim(),
          activeOnTicker: displayOnTicker,
          standings: formattedStandings,
          dnfs: formattedDnfs,
          penalties: formattedPens,
          flags: formattedFlags
        };

        const nextSaved = editingRaceId
          ? savedRaces.map(item => (item.id === editingRaceId ? raceRecord : (displayOnTicker ? { ...item, activeOnTicker: false } : item)))
          : [raceRecord, ...savedRaces.map(item => (displayOnTicker ? { ...item, activeOnTicker: false } : item))];

        setSavedRaces(nextSaved);
        const nextActiveRace = displayOnTicker ? raceRecord : raceSummary;
        setRaceSummary(nextActiveRace);
        try {
          const existing = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...existing, savedRaces: nextSaved, raceSummary: nextActiveRace }));
        } catch (err) {}
        saveAllData(teams, drivers, airliners, articles, nextActiveRace);
      };

      return (
        <div className="space-y-8">
          <div className="border-b border-graphite pb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <div className="font-mono text-xs uppercase tracking-[0.2em] text-scarlet">MACH1 EDITORIAL & TELEMETRY CMS</div>
              <h1 className="text-3xl font-bold text-offwhite mt-1">Content & Race Control</h1>
            </div>
            <div className="flex flex-wrap gap-2">
              <button
                onClick={handleAutoSyncStandingsFromRaces}
                className="px-3.5 py-2 rounded-lg bg-charcoal border border-emerald-500/60 font-mono text-xs text-emerald-400"
                title="Recalculate driver & constructor points from Saved Races"
              >
                ↻ Sync Standings Points
              </button>
              <button
                onClick={() => setShowGhBox(prev => !prev)}
                className="px-3.5 py-2 rounded-lg bg-charcoal border border-papaya/60 font-mono text-xs text-papaya"

              <button
                onClick={onLogout}

                Lock CMS

          {showGhBox && (
            <div className="p-5 rounded-xl bg-charcoal border border-papaya/50 space-y-3">
              <div className="font-mono text-xs font-bold uppercase text-papaya">
                DIRECT GITHUB REPOSITORY SYNC ({GITHUB_REPO_OWNER}/{GITHUB_REPO_NAME} → {GITHUB_DATA_FILE})
              </div>
              <p className="text-xs text-steel">

                </div>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <input type="text" value={airMfg} onChange={e => setAirMfg(e.target.value)} placeholder="Manufacturer (Airbus, Boeing...)" className="px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite" />
                  <input type="text" value={airModel} onChange={e => setAirModel(e.target.value)} placeholder="Aircraft Model (e.g. A350-1000)" className="px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite" />
                  <input type="text" value={airCode} onChange={e => setAirCode(e.target.value)} placeholder="ICAO Code (A35K)" className="px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite" />
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <input type="text" value={airSpeed} onChange={e => setAirSpeed(e.target.value)} placeholder="Cruise Speed (Mach 0.85)" className="px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite" />
                  <input type="text" value={airRange} onChange={e => setAirRange(e.target.value)} placeholder="Range (16,100 km)" className="px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite" />
                  <input type="text" value={airEngines} onChange={e => setAirEngines(e.target.value)} placeholder="Engines (Trent XWB-97)" className="px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite" />
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-4 gap-3 items-center">
                  <div className="flex items-center gap-2">
                    <input type="color" value={airColor} onChange={e => setAirColor(e.target.value)} className="h-9 w-12 rounded bg-carbon border border-graphite" />
                    <input type="text" value={airColor} onChange={e => setAirColor(e.target.value)} placeholder="#005EB8" className="flex-1 px-3 py-2 rounded bg-carbon border border-graphite font-mono text-xs text-offwhite" />
                  </div>
                  <input type="text" value={airStatus} onChange={e => setAirStatus(e.target.value)} placeholder="Status (IN SERVICE)" className="px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite" />
                  <input type="text" value={airMtow} onChange={e => setAirMtow(e.target.value)} placeholder="MTOW (280,000 kg)" className="px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite" />
                  <input type="text" value={airCeiling} onChange={e => setAirCeiling(e.target.value)} placeholder="Ceiling (43,100 ft)" className="px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite" />
                </div>
                <textarea rows={3} value={airBio} onChange={e => setAirBio(e.target.value)} placeholder="Aerodynamic & Propulsion Technical Overview..." className="w-full p-3 rounded bg-carbon border border-graphite text-xs text-offwhite" />
                <button type="submit" className="px-5 py-2.5 rounded-lg bg-papaya text-carbon font-mono text-xs font-bold uppercase">
                  {editingAirlinerId ? 'Save Airliner Cube Changes' : 'Add Airliner Cube'}
                </button>
              </form>

              <div className="p-6 rounded-xl bg-charcoal border border-graphite space-y-2.5 max-h-[34rem] overflow-y-auto">
                <h3 className="font-mono text-xs uppercase text-steel">EDIT OR DELETE AIRLINER CUBES ({airliners.length})</h3>
                {airliners.map(ac => (
                  <div key={ac.id} className="p-2.5 rounded-lg bg-carbon border border-graphite flex items-center justify-between gap-2">
                    <div className="min-w-0">
                      <div className="font-mono text-[10px]" style={{ color: ac.color }}>{ac.manufacturer} • {ac.code}</div>
                      <div className="text-xs font-semibold text-offwhite truncate">{ac.model}</div>
                    </div>
                    <div className="flex items-center gap-2 shrink-0">
                      <button
                        onClick={() => {
                          setEditingAirlinerId(ac.id);
                          setAirMfg(ac.manufacturer || 'Airbus');
                          setAirModel(ac.model || '');
                          setAirCode(ac.code || '');
                          setAirColor(ac.color || '#005EB8');
                          setAirStatus(ac.status || 'IN SERVICE');
                          setAirSpeed(ac.cruiseSpeed || 'Mach 0.85');
                          setAirRange(ac.range || '');
                          setAirEngines(ac.engines || '');
                          setAirMtow(ac.mtow || '250,000 kg');
                          setAirCeiling(ac.ceiling || '43,100 ft');
                          setAirBio(ac.bio || '');
                        }}
                        className="font-mono text-[10px] text-papaya hover:underline"
                      >
                        Edit
                      </button>
                      <button
                        onClick={() => {
                          const next = airliners.filter(item => item.id !== ac.id);
                          setAirliners(next);
                          saveAllData(teams, drivers, next, articles, raceSummary);
                        }}
                        className="font-mono text-[10px] text-scarlet hover:underline"
                      >
                        Delete
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Mach1App />);
  </script>
</body>
</html>
