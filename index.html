    :root {

      --text-offwhite: #EAEAEA;

    }

    html.light-theme {
      --bg-carbon: #F4F4F6;
      --bg-charcoal: #FFFFFF;
      --border-graphite: #D6D8DF;
      --text-steel: #585D68;
      --text-offwhite: #121316;
      --grid-line: rgba(10, 10, 12, 0.055);
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-carbon);
      color: var(--text-offwhite);
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .engineering-grid {
      background-size: 44px 44px;
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
    }

    /* Telemetry Pulse Streaks aligned with the 44px grid */
    @keyframes pulseHorizontal {
      0% { transform: translateX(-180px); opacity: 0; }
      15% { opacity: 0.75; }
      85% { opacity: 0.75; }
      100% { transform: translateX(calc(100vw + 180px)); opacity: 0; }
    }

    @keyframes pulseVertical {
      0% { transform: translateY(-180px); opacity: 0; }
      15% { opacity: 0.65; }
      85% { opacity: 0.65; }
      100% { transform: translateY(calc(100vh + 180px)); opacity: 0; }
    }

    .telemetry-h-scarlet {
      position: fixed;
      height: 1px;
      width: 140px;
      background: linear-gradient(90deg, transparent, #E10600, transparent);
      animation: pulseHorizontal 8s linear infinite;
      pointer-events: none;
    }

    .telemetry-h-papaya {
      position: fixed;
      height: 1px;
      width: 160px;
      background: linear-gradient(90deg, transparent, #FF6B00, transparent);
      animation: pulseHorizontal 9.5s linear infinite;
      pointer-events: none;
    }

    .telemetry-v-scarlet {
      position: fixed;
      width: 1px;
      height: 140px;
      background: linear-gradient(180deg, transparent, #E10600, transparent);
      animation: pulseVertical 9s linear infinite;
      pointer-events: none;
    }

    .telemetry-v-papaya {
      position: fixed;
      width: 1px;
      height: 150px;
      background: linear-gradient(180deg, transparent, #FF6B00, transparent);
      animation: pulseVertical 10.5s linear infinite;
      pointer-events: none;
    }

    /* Opening Motion Intro Animations — Clean Telemetry Horizon Reveal */
    @keyframes scanScarlet {
      0% { transform: scaleX(0); opacity: 0; }
      35% { transform: scaleX(1); opacity: 1; }
      75% { transform: scaleX(1); opacity: 0.35; }
      100% { transform: scaleX(1); opacity: 0; }
    }

    @keyframes scanPapaya {
      0% { transform: scaleX(0); opacity: 0; }
      40% { transform: scaleX(1); opacity: 1; }
      75% { transform: scaleX(1); opacity: 0.35; }
      100% { transform: scaleX(1); opacity: 0; }
    }

    @keyframes cleanLogoReveal {
      0% { opacity: 0; transform: translateY(10px) scale(0.96); }
      22% { opacity: 1; transform: translateY(0) scale(1); }
      82% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-6px) scale(0.99); }
    }

    @keyframes introFadeOut {
      0%, 84% { opacity: 1; }
      100% { opacity: 0; }
    }

    .animate-scan-scarlet {
      transform-origin: left center;
      animation: scanScarlet 1.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .animate-scan-papaya {
      transform-origin: right center;
      animation: scanPapaya 1.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .animate-badge-reveal {
      animation: cleanLogoReveal 1.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-intro-overlay {
      animation: introFadeOut 1.95s ease-out forwards;
    }

    /* Live Race Classification Ticker */
    @keyframes raceTickerScroll {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }

    .animate-race-ticker {
      display: flex;
      width: max-content;
      animation: raceTickerScroll 34s linear infinite;
    }

      width: 6px;

    }

      background: var(--border-graphite);
      border-radius: 3px;
    }

    const FIREBASE_CFG_KEY = 'mach1_firebase_config_v1';

    // Optional: Paste your Firebase Web App Config object here to hardcode cloud sync for all visitors
    const EMBEDDED_FIREBASE_CONFIG = null;

    let firestoreDb = null;

    const getStoredFirebaseConfig = () => {
      if (EMBEDDED_FIREBASE_CONFIG && EMBEDDED_FIREBASE_CONFIG.projectId) {
        return EMBEDDED_FIREBASE_CONFIG;
      }
      try {
        const raw = localStorage.getItem(FIREBASE_CFG_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.projectId && parsed.apiKey) return parsed;
        }
      } catch (e) {}
      return null;
    };

    const initFirebaseCloud = (customConfig = null) => {
      try {
        const cfg = customConfig || getStoredFirebaseConfig();
        if (!cfg || !window.firebase) {
          firestoreDb = null;
          return false;
        }
        if (!firebase.apps.length) {
          firebase.initializeApp(cfg);
        }
        firestoreDb = firebase.firestore();
        if (firebase.auth) {
          firebase.auth().signInAnonymously().catch(() => {});
        }
        return true;
      } catch (e) {
        firestoreDb = null;
        return false;
      }
    };

    const syncCloudCollection = async (collectionName, itemsArray) => {
      if (!firestoreDb) return false;
      try {
        const batch = firestoreDb.batch();
        const colRef = firestoreDb.collection(collectionName);
        const existingSnap = await colRef.get();
        const keepIds = new Set(itemsArray.map(item => item.id));

        existingSnap.forEach(doc => {
          if (!keepIds.has(doc.id)) {
            batch.delete(doc.ref);
          }
        });

        itemsArray.forEach(item => {
          if (item && item.id) {
            batch.set(colRef.doc(item.id), { ...item, _updatedAt: Date.now() }, { merge: true });
          }
        });

        await batch.commit();
        return true;
      } catch (e) {
        return false;
      }
    };

    const persistDatabase = (nextEntities, nextArticles, nextWeeklyLogs, nextRaceResults = []) => {
      let localSaved = false;
      try {
        localStorage.setItem(

          JSON.stringify({
            entities: nextEntities,
            articles: nextArticles,
            weeklyLogs: nextWeeklyLogs,
            raceResults: nextRaceResults
          })
        );
        localSaved = true;
      } catch (e) {
        localSaved = false;
      }

      if (firestoreDb) {
        Promise.all([
          syncCloudCollection('entities', nextEntities),
          syncCloudCollection('articles', nextArticles),
          syncCloudCollection('weeklyLogs', nextWeeklyLogs),
          syncCloudCollection('raceResults', nextRaceResults)
        ]).catch(() => {});

    function SearchModal({ isOpen, onClose, entities, articles, navigate }) {
      const [query, setQuery] = useState('');

      useEffect(() => {
        if (isOpen) setQuery('');
      }, [isOpen]);

      if (!isOpen) return null;

      const q = query.trim().toLowerCase();
      const matchedEntities = q
        ? entities.filter(
            e =>
              e.name.toLowerCase().includes(q) ||
              (e.fullName && e.fullName.toLowerCase().includes(q)) ||
              (e.teamName && e.teamName.toLowerCase().includes(q)) ||
              (e.companyName && e.companyName.toLowerCase().includes(q))
          )
        : [];

      const matchedArticles = q
        ? articles.filter(
            a =>
              a.headline.toLowerCase().includes(q) ||
              (a.summary && a.summary.toLowerCase().includes(q))
          )
        : [];

      return (
        <div className="fixed inset-0 z-50 bg-black/75 flex items-start justify-center pt-20 px-4" onClick={onClose}>
          <div
            className="w-full max-w-2xl rounded-lg bg-charcoal border border-graphite overflow-hidden"
            onClick={e => e.stopPropagation()}
          >
            <div className="flex items-center border-b border-graphite px-4 py-3.5 gap-3">
              <span className="font-mono text-scarlet text-sm">⌕</span>
              <input
                type="text"
                autoFocus
                value={query}
                onChange={e => setQuery(e.target.value)}
                placeholder="Search F1/F2/FE teams, drivers, Airbus, Boeing, aircraft models, or briefings..."
                className="flex-1 bg-transparent text-sm text-offwhite placeholder-steel focus:outline-none"
              />
              <button onClick={onClose} className="font-mono text-xs text-steel hover:text-offwhite">ESC</button>
            </div>

            <div className="max-h-96 overflow-y-auto p-4 space-y-5">
              {!q && (
                <div className="text-center py-8 font-mono text-xs text-steel">
                  Type to search across all Track & Sky entities, drivers, aircraft, and editorial briefings.
                </div>
              )}

              {q && matchedEntities.length === 0 && matchedArticles.length === 0 && (
                <div className="text-center py-8 font-mono text-xs text-steel">
                  No matching records found for “{query}”.
                </div>
              )}

              {matchedEntities.length > 0 && (
                <div className="space-y-2">
                  <div className="font-mono text-[10px] uppercase tracking-widest text-steel">
                    ENTITIES, DRIVERS & AIRCRAFT ({matchedEntities.length})
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    {matchedEntities.slice(0, 12).map(ent => (
                      <button
                        key={ent.id}
                        onClick={() => {
                          navigate({ view: 'entity', entityId: ent.id });
                          onClose();
                        }}
                        style={{ borderColor: ent.primaryColor || '#24262A' }}
                        className="p-3 rounded bg-carbon border text-left hover:bg-charcoal transition-colors flex items-center justify-between"
                      >
                        <div>
                          <div className="text-sm font-semibold text-offwhite">{ent.name}</div>
                          <div className="font-mono text-[10px] uppercase text-steel">
                            {CATEGORIES[ent.category]?.name} • {ent.type}
                          </div>
                        </div>
                        <span className="font-mono text-xs text-steel">→</span>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {matchedArticles.length > 0 && (
                <div className="space-y-2">
                  <div className="font-mono text-[10px] uppercase tracking-widest text-steel">
                    EDITORIAL BRIEFINGS ({matchedArticles.length})

                    >

                    </button>

    function Mach1App() {
      const [entities, setEntities] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved && Array.isArray(saved.entities) && saved.entities.length > 0) {
            return saved.entities;
          }
        } catch (e) {}
        return INITIAL_ENTITIES;
      });

      const [articles, setArticles] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved && Array.isArray(saved.articles)) {
            return saved.articles;
          }
        } catch (e) {}
        return INITIAL_ARTICLES;
      });

      const [weeklyLogs, setWeeklyLogs] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved && Array.isArray(saved.weeklyLogs)) {
            return saved.weeklyLogs;
          }
        } catch (e) {}
        return INITIAL_WEEKLY_LOGS;
      });

      const [raceResults, setRaceResults] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved && Array.isArray(saved.raceResults)) {
            return saved.raceResults;
          }
        } catch (e) {}
        return INITIAL_RACE_RESULTS;
      });

      const [route, setRoute] = useState({ view: 'home' });
      const [isAdmin, setIsAdmin] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [searchOpen, setSearchOpen] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [toastMsg, setToastMsg] = useState('');
      const [showIntro, setShowIntro] = useState(true);
      const [introKey, setIntroKey] = useState(0);
      const [wireFilter, setWireFilter] = useState('all');
      const [cloudConnected, setCloudConnected] = useState(false);
      const [lastCloudSync, setLastCloudSync] = useState(null);
      const isRemoteSnapshotRef = useRef(false);

      const [theme, setTheme] = useState(() => {
        try {
          return localStorage.getItem('mach1_theme') || 'dark';
        } catch (e) {
          return 'dark';
        }
      });

      useEffect(() => {
        const rootEl = document.documentElement;
        if (theme === 'light') {
          rootEl.classList.add('light-theme');
          rootEl.classList.remove('dark');
        } else {
          rootEl.classList.remove('light-theme');
          rootEl.classList.add('dark');
        }
        try {
          localStorage.setItem('mach1_theme', theme);
        } catch (e) {}
      }, [theme]);

      const notify = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3200);
      };

      const navigate = (nextRoute) => {
        setRoute(nextRoute);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // Keyboard shortcut Cmd/Ctrl + K for Search
      useEffect(() => {
        const onKeyDown = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setSearchOpen(prev => !prev);
          } else if (e.key === 'Escape') {
            setSearchOpen(false);
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, []);

      // Persist database changes to localStorage & Firestore
      useEffect(() => {
        if (isRemoteSnapshotRef.current) {
          isRemoteSnapshotRef.current = false;
          return;
        }
        persistDatabase(entities, articles, weeklyLogs, raceResults);
      }, [entities, articles, weeklyLogs, raceResults]);

      // Attach Firebase Firestore Real-Time Listeners
      const attachFirestoreListeners = () => {
        if (!firestoreDb) return () => {};
        setCloudConnected(true);

        const unsubArticles = firestoreDb.collection('articles').onSnapshot(
          snap => {
            if (!snap.empty) {
              const cloudArticles = snap.docs.map(d => d.data());
              cloudArticles.sort((a, b) => (b._updatedAt || 0) - (a._updatedAt || 0));
              isRemoteSnapshotRef.current = true;
              setArticles(cloudArticles);
              setLastCloudSync(new Date().toLocaleTimeString());
            }
          },
          () => setCloudConnected(false)
        );

        const unsubWeekly = firestoreDb.collection('weeklyLogs').onSnapshot(
          snap => {
            if (!snap.empty) {
              const cloudLogs = snap.docs.map(d => d.data());
              cloudLogs.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
              isRemoteSnapshotRef.current = true;
              setWeeklyLogs(cloudLogs);
              setLastCloudSync(new Date().toLocaleTimeString());
            }
          },
          () => {}
        );

        const unsubRaces = firestoreDb.collection('raceResults').onSnapshot(
          snap => {
            if (!snap.empty) {
              const cloudRaces = snap.docs.map(d => d.data());
              cloudRaces.sort((a, b) => (b._updatedAt || 0) - (a._updatedAt || 0));
              isRemoteSnapshotRef.current = true;
              setRaceResults(cloudRaces);
              setLastCloudSync(new Date().toLocaleTimeString());
            }
          },
          () => {}
        );

        const unsubEntities = firestoreDb.collection('entities').onSnapshot(
          snap => {
            if (!snap.empty) {
              const cloudEnts = snap.docs.map(d => d.data());
              isRemoteSnapshotRef.current = true;
              setEntities(prev => {
                const map = new Map(prev.map(e => [e.id, e]));
                cloudEnts.forEach(ce => map.set(ce.id, ce));
                return Array.from(map.values());
              });
              setLastCloudSync(new Date().toLocaleTimeString());
            }
          },
          () => {}
        );

        return () => {
          unsubArticles();
          unsubWeekly();
          unsubRaces();
          unsubEntities();
        };
      };

      useEffect(() => {
        const ready = initFirebaseCloud();
        if (ready) {
          return attachFirestoreListeners();
        }
      }, []);

      const forceCloudPull = async () => {
        if (!firestoreDb) {
          notify('Local Fallback Mode active — configure Firebase in CMS to sync cloud');
          return;
        }
        try {
          const [artSnap, wkSnap, entSnap, raceSnap] = await Promise.all([
            firestoreDb.collection('articles').get(),
            firestoreDb.collection('weeklyLogs').get(),
            firestoreDb.collection('entities').get(),
            firestoreDb.collection('raceResults').get()
          ]);
          isRemoteSnapshotRef.current = true;
          if (!artSnap.empty) setArticles(artSnap.docs.map(d => d.data()));
          if (!wkSnap.empty) setWeeklyLogs(wkSnap.docs.map(d => d.data()));
          if (!raceSnap.empty) setRaceResults(raceSnap.docs.map(d => d.data()));
          if (!entSnap.empty) {
            const cloudEnts = entSnap.docs.map(d => d.data());
            setEntities(prev => {
              const map = new Map(prev.map(e => [e.id, e]));
              cloudEnts.forEach(ce => map.set(ce.id, ce));
              return Array.from(map.values());
            });
          }
          setLastCloudSync(new Date().toLocaleTimeString());
          notify('Latest data synced from Firebase Cloud');
        } catch (err) {
          notify('Cloud sync check failed — verify Firestore rules');
        }
      };

      const handleResetDatabase = () => {
        setEntities(INITIAL_ENTITIES);
        setArticles(INITIAL_ARTICLES);
        setWeeklyLogs(INITIAL_WEEKLY_LOGS);
        setRaceResults(INITIAL_RACE_RESULTS);
        persistDatabase(INITIAL_ENTITIES, INITIAL_ARTICLES, INITIAL_WEEKLY_LOGS, INITIAL_RACE_RESULTS);
        notify('Database restored to clean default structure');

      // VIEW RENDERERS

        <nav className="flex flex-wrap items-center gap-2 font-mono text-[11px] uppercase tracking-wider text-steel mb-6">

      // 1. HOMEPAGE

                    >

                    </button>

      // 2. DIVISION VIEW (TRACK OR SKY)

              <div className="font-mono text-xs uppercase tracking-[0.25em] text-scarlet">
                {division === 'track' ? 'MOTORSPORT ENGINEERING DIVISION' : 'AVIATION & AEROSPACE DIVISION'}
              </div>
              <h1 className="text-3xl sm:text-4xl font-bold text-offwhite mt-1 capitalize">

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
              {divCats.map(cat => (

                >
                  <div>
                    <div className="font-mono text-[11px] text-steel mb-2">{cat.code}</div>
                    <h2 className="text-xl font-bold text-offwhite">{cat.name}</h2>

                    Explore {cat.name} →
                  </div>
                </button>
              ))}

            {division === 'sky' && (
              <section className="space-y-4 pt-4 border-t border-graphite">
                <div className="flex items-center justify-between">
                  <div>
                    <span className="font-mono text-[10px] uppercase tracking-[0.25em] text-papaya">AEROSPACE PRIMES & OEMs</span>

        return (

      // 4. ENTITY DOSSIER (TEAM, DRIVER, COMPANY, AIRCRAFT, OR FIA)

        const linkedArticles = articles.filter(a => Array.isArray(a.entityIds) && a.entityIds.includes(entity.id));

        return (

              { label: 'Home', onClick: () => navigate({ view: 'home' }) },

                      <div>
                        <div className="font-mono text-xs" style={{ color: accent }}>#{drv.number} • {drv.nationality}</div>

                <span className="text-graphite">•</span>

              <h1 className="text-3xl sm:text-4xl font-bold text-offwhite leading-tight">{art.headline}</h1>

      // 6. TECHNICAL ANALYSIS, WEEKLY UPGRADE TRACKER, RACES & ABOUT

              { label: 'Home', onClick: () => navigate({ view: 'home' }) },

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {analysisArticles.map(art => (
                  <button
                    key={art.id}

                    className="p-6 rounded-lg bg-charcoal border border-graphite hover:border-papaya text-left transition-all"

                    <div className="font-mono text-[10px] uppercase text-papaya">{art.categoryLabel} • {art.date}</div>
                    <h2 className="text-lg font-bold text-offwhite mt-1">{art.headline}</h2>

      const renderRaces = (selectedRaceId = null) => {

          const c = compound.trim().toUpperCase();
          if (c.startsWith('S')) return { bg: '#E10600', label: 'S', name: 'SOFT' };
          if (c.startsWith('M')) return { bg: '#FFD700', label: 'M', name: 'MEDIUM' };
          if (c.startsWith('H')) return { bg: '#EAEAEA', label: 'H', name: 'HARD' };
          if (c.startsWith('I')) return { bg: '#22C55E', label: 'I', name: 'INTER' };

                        onClick={() => navigate({ view: 'races', raceId: r.id })}

                  <div className="space-y-6">
                    {/* Header & Race Flag / Weather Telemetry Strip */}

                      <div>
                        <div className="flex flex-wrap items-center gap-2 font-mono text-xs uppercase">

                              <div
                                key={i}

      const [driverCatFilter, setDriverCatFilter] = useState('f1');
      const driverEntities = entities.filter(e => e.type === 'driver' && e.category === driverCatFilter);
      const [selectedDriverId, setSelectedDriverId] = useState(() => driverEntities[0]?.id || '');

      useEffect(() => {
        const list = entities.filter(e => e.type === 'driver' && e.category === driverCatFilter);
        if (list.length > 0 && !list.some(d => d.id === selectedDriverId)) {
          setSelectedDriverId(list[0].id);
        }
      }, [driverCatFilter, entities]);

      const activeDriver = entities.find(e => e.id === selectedDriverId);

      // Aircraft Models Editor State
      const aircraftEntities = entities.filter(e => e.type === 'aircraft');
      const skyCompanies = entities.filter(e => e.division === 'sky' && e.type === 'manufacturer');
      const [selectedAircraftId, setSelectedAircraftId] = useState(() => aircraftEntities[0]?.id || '');
      const activeAircraft = entities.find(e => e.id === selectedAircraftId);

      // Teams & Identity Colours State
      const orgEntities = entities.filter(e => e.type === 'team' || e.type === 'manufacturer' || e.type === 'governing');
      const [selectedOrgId, setSelectedOrgId] = useState(() => orgEntities[0]?.id || '');
      const activeOrg = entities.find(e => e.id === selectedOrgId);

      const handleSaveRace = (e) => {
        e.preventDefault();
        if (!raceName.trim()) {
          notify('Race name is required');
          return;
        }
        const cleanStandings = raceStandings
          .filter(r => r.driver && r.driver.trim() !== '')
          .map((r, idx) => ({
            pos: r.pos || String(idx + 1),
            driver: r.driver.trim(),
            team: (r.team || '').trim(),
            gap: (r.gap || '').trim(),
            points: (r.points || '').trim()
          }));

        const raceObj = {
          id: editingRaceId || 'race-' + Date.now(),
          series: raceSeries,
          round: raceRound.trim() || 'ROUND',
          raceName: raceName.trim(),
          circuit: raceCircuit.trim(),
          date: raceDate,
          fastestLap: raceFastestLap.trim(),
          summary: raceSummary.trim(),
          standings: cleanStandings,
          isTickerActive: true,
          _updatedAt: Date.now()
        };

        const cleared = raceResults.map(r => ({ ...r, isTickerActive: false }));
        const nextRaces = editingRaceId
          ? cleared.map(r => (r.id === editingRaceId ? raceObj : r))
          : [raceObj, ...cleared];

        setRaceResults(nextRaces);
        persistDatabase(entities, articles, weeklyLogs, nextRaces);
        setEditingRaceId(null);
        setRaceRound('');
        setRaceName('');
        setRaceCircuit('');
        setRaceFastestLap('');
        setRaceSummary('');
        setRaceStandings([
          { pos: '1', driver: '', team: '', gap: 'WINNER', points: '25' },
          { pos: '2', driver: '', team: '', gap: '', points: '18' },
          { pos: '3', driver: '', team: '', gap: '', points: '15' }
        ]);
        notify('Race classification published to top ticker & Races page!');
      };

      const handlePublishArticle = (e) => {
        e.preventDefault();
        if (!headline.trim()) {
          notify('Headline is required');
          return;
        }
        const cat = CATEGORIES[categoryId] || CATEGORIES.f1;
        const newArt = {
          id: 'art-' + Date.now(),
          division: cat.division,
          categoryId: cat.id,
          categoryLabel: cat.name,
          headline: headline.trim(),
          summary: summary.trim(),
          body: body.trim(),
          verdict: verdict.trim(),
          imageUrl: imageUrl.trim(),
          isAnalysis,
          entityIds: selectedEntityIds,
          date: new Date().toISOString().slice(0, 10),
          author: 'MACH1 Editorial Desk',
          _updatedAt: Date.now()
        };
        const nextArticles = [newArt, ...articles];
        setArticles(nextArticles);
        persistDatabase(entities, nextArticles, weeklyLogs, raceResults);
        setHeadline('');
        setSummary('');
        setBody('');
        setVerdict('');
        setImageUrl('');
        setSelectedEntityIds([]);
        notify('Article published & synced across all tagged entities!');
      };

      const handleAddWeeklyLog = (e) => {
        e.preventDefault();
        if (!wkTitle.trim()) return;
        const newLog = {
          id: 'wk-' + Date.now(),
          division: wkDivision,
          organisation: wkOrg.trim() || 'General',
          title: wkTitle.trim(),
          significance: wkSig.trim(),
          date: new Date().toISOString().slice(0, 10)
        };
        const nextLogs = [newLog, ...weeklyLogs];
        setWeeklyLogs(nextLogs);
        persistDatabase(entities, articles, nextLogs, raceResults);
        setWkOrg('');
        setWkTitle('');
        setWkSig('');
        notify('Weekly upgrade entry added!');
      };

      const updateDriverField = (field, value) => {
        setEntities(prev => {
          const next = prev.map(ent => {
            if (ent.id !== selectedDriverId) return ent;
            if (field === 'name') {
              return { ...ent, name: value, fullName: value };
            }
            if (field === 'teamId') {
              const team = prev.find(t => t.id === value);
              return {
                ...ent,
                teamId: value,
                teamName: team ? team.name : ent.teamName,
                primaryColor: team ? team.primaryColor : ent.primaryColor
              };
            }
            return { ...ent, [field]: value };
          });
          persistDatabase(next, articles, weeklyLogs, raceResults);
          return next;
        });
      };

      const updateDriverStatValue = (label, value) => {
        setEntities(prev => {
          const next = prev.map(ent => {
            if (ent.id !== selectedDriverId) return ent;
            const currentStats = Array.isArray(ent.stats) ? [...ent.stats] : makeEmptyDriverStats();
            const idx = currentStats.findIndex(s => s.label === label);
            if (idx >= 0) {
              currentStats[idx] = { ...currentStats[idx], value };
            } else {
              currentStats.push({ label, value });
            }
            return { ...ent, stats: currentStats };
          });
          persistDatabase(next, articles, weeklyLogs, raceResults);
          return next;
        });
      };

      const handleAddDriver = () => {
        const seriesTeams = entities.filter(e => e.type === 'team' && e.category === driverCatFilter);
        const defaultTeam = seriesTeams[0];
        const newId = `drv-${driverCatFilter}-${Date.now()}`;
        const newDriver = {
          id: newId,
          division: 'track',
          category: driverCatFilter,
          type: 'driver',
          name: 'New Driver',
          fullName: 'New Driver',
          number: '99',
          teamId: defaultTeam?.id || '',
          teamName: defaultTeam?.name || 'Independent',
          primaryColor: defaultTeam?.primaryColor || '#E10600',
          nationality: '',
          overview: '',
          stats: makeEmptyDriverStats()
        };
        setEntities(prev => {
          const next = [...prev, newDriver];
          persistDatabase(next, articles, weeklyLogs, raceResults);
          return next;
        });
        setSelectedDriverId(newId);
        notify('New driver card added — edit name & stats below');
      };

      const updateAircraftField = (field, value) => {
        setEntities(prev => {
          const next = prev.map(ent => {
            if (ent.id !== selectedAircraftId) return ent;
            if (field === 'name') return { ...ent, name: value, fullName: value };
            if (field === 'companyId') {
              const comp = prev.find(c => c.id === value);
              return {
                ...ent,
                companyId: value,
                companyName: comp ? comp.name : ent.companyName,
                category: comp ? comp.category : ent.category,
                primaryColor: comp ? comp.primaryColor : ent.primaryColor
              };
            }
            return { ...ent, [field]: value };
          });
          persistDatabase(next, articles, weeklyLogs, raceResults);
          return next;
        });
      };

      const updateAircraftStatValue = (label, value) => {
        setEntities(prev => {
          const next = prev.map(ent => {
            if (ent.id !== selectedAircraftId) return ent;
            const currentStats = Array.isArray(ent.stats) ? [...ent.stats] : makeEmptyAircraftSpecs();
            const idx = currentStats.findIndex(s => s.label === label);
            if (idx >= 0) {
              currentStats[idx] = { ...currentStats[idx], value };
            } else {
              currentStats.push({ label, value });
            }
            return { ...ent, stats: currentStats };
          });
          persistDatabase(next, articles, weeklyLogs, raceResults);
          return next;
        });
      };

      const handleAddAircraft = () => {
        const defaultComp = skyCompanies[0];
        const newId = `ac-${Date.now()}`;
        const newAc = {
          id: newId,
          division: 'sky',
          category: defaultComp?.category || 'commercial',
          type: 'aircraft',
          name: 'New Aircraft Model',
          fullName: 'New Aircraft Model',
          code: 'NEW',
          companyId: defaultComp?.id || 'sky-airbus',
          companyName: defaultComp?.name || 'Airbus',
          outlineType: 'widebody',
          primaryColor: defaultComp?.primaryColor || '#005EB8',
          overview: '',
          stats: makeEmptyAircraftSpecs()
        };
        setEntities(prev => {
          const next = [...prev, newAc];
          persistDatabase(next, articles, weeklyLogs, raceResults);
          return next;
        });
        setSelectedAircraftId(newId);
        notify('New aircraft model added under ' + (defaultComp?.name || 'Airbus'));
      };

      return (
        <div className="space-y-8">
          <div className="border-b border-graphite pb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <div className="flex flex-wrap items-center gap-2.5 font-mono text-xs uppercase tracking-[0.2em]">
                <span className="text-scarlet">PERSISTENT RELATIONAL CONTENT MANAGEMENT</span>
                <span className="text-graphite">|</span>
                {cloudConnected ? (
                  <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded bg-carbon border border-emerald-500/40 text-emerald-400 text-[10px]">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    Cloud Sync Active (Firebase){lastCloudSync ? ` • ${lastCloudSync}` : ''}
                  </span>
                ) : (
                  <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded bg-carbon border border-papaya/40 text-papaya text-[10px]">
                    <span className="w-1.5 h-1.5 rounded-full bg-papaya"></span>
                    Local Fallback Mode
                  </span>
                )}
              </div>
              <h1 className="text-3xl font-bold text-offwhite mt-1">MACH1 Editorial CMS</h1>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <button
                type="button"
                onClick={onForceCloudSync}
                className="px-3.5 py-2 rounded bg-charcoal border border-graphite hover:border-offwhite font-mono text-xs text-offwhite transition-colors"
              >
                ↻ Sync Now
              </button>
              <button
                type="button"
                onClick={() => setShowCloudSetup(prev => !prev)}
                className="px-3.5 py-2 rounded bg-charcoal border border-papaya/60 hover:border-papaya font-mono text-xs text-papaya transition-colors"
              >
                {cloudConnected ? 'Cloud Config' : '+ Connect Firebase Cloud'}
              </button>
              <button
                type="button"
                onClick={handleResetDatabase}
                className="px-3.5 py-2 rounded bg-charcoal border border-graphite hover:border-steel font-mono text-xs text-steel hover:text-offwhite"
              >
                Reset Default Data
              </button>
              <button
                type="button"
                onClick={onLogout}
                className="px-3.5 py-2 rounded bg-charcoal border border-scarlet/60 font-mono text-xs text-offwhite"
              >
                Lock CMS
              </button>
            </div>
          </div>

          {/* Firebase Cloud Sync Drawer */}
          {showCloudSetup && (
            <div className="p-5 rounded-lg bg-charcoal border border-papaya/50 space-y-3">
              <div className="flex items-center justify-between">
                <span className="font-mono text-xs font-semibold uppercase tracking-wider text-papaya">
                  FIREBASE FIRESTORE LIVE CLOUD SYNC CONFIGURATION
                </span>
                <button type="button" onClick={() => setShowCloudSetup(false)} className="font-mono text-xs text-steel">✕</button>
              </div>
              <p className="text-xs text-steel leading-relaxed">
                Paste your Firebase Web App JSON config (<code className="text-offwhite">{"{\"apiKey\":\"...\",\"projectId\":\"...\"}"}</code>) so every article, race classification, driver stat, aircraft model, and weekly update syncs live across all devices.
              </p>
              <div className="flex flex-col sm:flex-row gap-2">
                <input
                  type="text"
                  value={firebaseConfigInput}
                  onChange={e => setFirebaseConfigInput(e.target.value)}
                  placeholder='{"apiKey":"AIza...","authDomain":"...","projectId":"..."}'
                  className="flex-1 px-3.5 py-2 rounded bg-carbon border border-graphite font-mono text-xs text-offwhite focus:border-papaya focus:outline-none"
                />
                <button
                  type="button"
                  onClick={() => {
                    try {
                      const parsed = JSON.parse(firebaseConfigInput);
                      onConnectFirebase(parsed);
                      setShowCloudSetup(false);
                    } catch (err) {
                      notify('Please paste valid JSON from Firebase Project Settings');
                    }
                  }}
                  className="px-4 py-2 rounded bg-papaya text-carbon font-mono text-xs font-bold uppercase"
                >
                  Save & Connect Cloud
                </button>
              </div>
            </div>
          )}

          {/* CMS Tabs */}
          <div className="flex flex-wrap gap-2 border-b border-graphite pb-4">
            {[
              { id: 'races', label: `Race Results & Ticker (${raceResults.length})` },
              { id: 'articles', label: `Articles (${articles.length})` },
              { id: 'drivers', label: 'Driver Stats & Names' },
              { id: 'aircraft', label: `Aircraft Models (${aircraftEntities.length})` },
              { id: 'teams', label: 'Teams & Identity Colours' },
              { id: 'weekly', label: `Weekly Tracker (${weeklyLogs.length})` }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`px-4 py-2 rounded font-mono text-xs uppercase border transition-colors ${
                  activeTab === tab.id
                    ? 'bg-scarlet/15 border-scarlet text-offwhite font-semibold'
                    : 'bg-charcoal border-graphite text-steel hover:text-offwhite'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </div>

          {/* TAB 0: RACE RESULTS & LIVE TICKER */}
          {activeTab === 'races' && (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  if (!raceName.trim()) {
                    notify('Race name is required');
                    return;
                  }
                  const cleanStandings = raceStandings
                    .filter(r => r.driver && r.driver.trim() !== '')
                    .map((r, idx) => ({
                      pos: r.pos || String(idx + 1),
                      code: (r.code || r.driver.trim().split(' ').pop().slice(0, 3)).toUpperCase(),
                      driver: r.driver.trim(),
                      team: (r.team || '').trim(),
                      gap: (r.gap || '').trim(),
                      tires: (r.tires || '').trim(),
                      pits: (r.pits || '').trim(),
                      points: (r.points || '').trim()
                    }));

                  const raceObj = {
                    id: editingRaceId || 'race-' + Date.now(),
                    series: raceSeries,
                    flag: raceFlag.trim() || '🏁',
                    shortTitle: raceShortTitle.trim() || 'Race',
                    round: raceRound.trim() || 'ROUND',
                    raceName: raceName.trim(),
                    circuit: raceCircuit.trim(),
                    date: raceDate,
                    laps: raceLaps.trim(),
                    weather: raceWeather.trim(),
                    raceStatus: raceStatus.trim(),
                    fastestLap: raceFastestLap.trim(),
                    summary: raceSummary.trim(),
                    standings: cleanStandings,
                    dnfs: raceDnfs.filter(d => d.driver && d.driver.trim()),
                    penalties: racePenalties.filter(p => p.driver && p.driver.trim()),
                    flags: raceFlags.filter(f => f.note && f.note.trim()),
                    isTickerActive: true,
                    _updatedAt: Date.now()
                  };

                  const cleared = raceResults.map(r => ({ ...r, isTickerActive: false }));
                  const nextRaces = editingRaceId
                    ? cleared.map(r => (r.id === editingRaceId ? raceObj : r))
                    : [raceObj, ...cleared];

                  setRaceResults(nextRaces);
                  persistDatabase(entities, articles, weeklyLogs, nextRaces);
                  setEditingRaceId(null);
                  notify('Race classification, tyres, penalties & ticker published!');
                }}
                className="lg:col-span-2 p-6 rounded-lg bg-charcoal border border-graphite space-y-5"
              >
                <div className="flex items-center justify-between">
                  <h2 className="text-lg font-bold text-offwhite">
                    {editingRaceId ? 'Edit Race Classification & Summary' : 'Publish Race Summary & Live Ticker'}
                  </h2>
                  {editingRaceId && (
                    <button
                      type="button"
                      onClick={() => setEditingRaceId(null)}
                      className="font-mono text-xs text-steel hover:text-offwhite"
                    >
                      + New Race
                    </button>
                  )}
                </div>

                {/* Event Metadata */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  <div>
                    <label className="block font-mono text-[10px] uppercase text-steel mb-1">Series</label>
                    <select
                      value={raceSeries}
                      onChange={e => setRaceSeries(e.target.value)}
                      className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                    >
                      <option value="F1">F1</option>
                      <option value="F2">F2</option>
                      <option value="FE">FE</option>
                    </select>
                  </div>
                  <div>
                    <label className="block font-mono text-[10px] uppercase text-steel mb-1">Country Flag</label>
                    <input
                      type="text"
                      value={raceFlag}
                      onChange={e => setRaceFlag(e.target.value)}
                      placeholder="🇺🇸 / 🇦🇺 / 🇮🇹"
                      className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                    />
                  </div>
                  <div>
                    <label className="block font-mono text-[10px] uppercase text-steel mb-1">Ticker Label</label>
                    <input
                      type="text"
                      value={raceShortTitle}
                      onChange={e => setRaceShortTitle(e.target.value)}
                      placeholder="Race / Sprint"
                      className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                    />
                  </div>
                  <div>
                    <label className="block font-mono text-[10px] uppercase text-steel mb-1">Round</label>
                    <input
                      type="text"
                      value={raceRound}
                      onChange={e => setRaceRound(e.target.value)}
                      placeholder="ROUND 01"
                      className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div className="sm:col-span-2">
                    <label className="block font-mono text-[10px] uppercase text-steel mb-1">Grand Prix / Race Name *</label>
                    <input
                      type="text"
                      value={raceName}
                      onChange={e => setRaceName(e.target.value)}
                      placeholder="e.g. UNITED STATES GRAND PRIX"
                      className="w-full px-3.5 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                    />
                  </div>
                  <div>
                    <label className="block font-mono text-[10px] uppercase text-steel mb-1">Date</label>
                    <input
                      type="date"
                      value={raceDate}
                      onChange={e => setRaceDate(e.target.value)}
                      className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div>
                    <label className="block font-mono text-[10px] uppercase text-steel mb-1">Circuit</label>
                    <input
                      type="text"
                      value={raceCircuit}
                      onChange={e => setRaceCircuit(e.target.value)}
                      placeholder="Circuit of The Americas"
                      className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                    />
                  </div>
                  <div>
                    <label className="block font-mono text-[10px] uppercase text-steel mb-1">Laps & Weather</label>
                    <input
                      type="text"
                      value={raceWeather}
                      onChange={e => setRaceWeather(e.target.value)}
                      placeholder="56 Laps • Dry 28°C"
                      className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                    />
                  </div>
                  <div>
                    <label className="block font-mono text-[10px] uppercase text-steel mb-1">Race Flag Status</label>
                    <input
                      type="text"
                      value={raceStatus}
                      onChange={e => setRaceStatus(e.target.value)}
                      placeholder="FINISHED // CHEQUERED FLAG"
                      className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                    />
                  </div>
                </div>

                <div>
                  <label className="block font-mono text-[10px] uppercase text-steel mb-1">Fastest Lap</label>
                  <input
                    type="text"
                    value={raceFastestLap}
                    onChange={e => setRaceFastestLap(e.target.value)}
                    placeholder="e.g. L. Norris — 1:35.412 (Lap 49)"
                    className="w-full px-3.5 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                  />
                </div>

                {/* Positions, Intervals, Tyres & Pits Editor */}
                <div className="space-y-2 pt-2 border-t border-graphite">
                  <div className="flex items-center justify-between">
                    <label className="font-mono text-[10px] uppercase text-papaya font-semibold">
                      Finishing Positions, Intervals, Tyres (S/M/H/I/W) & Pits
                    </label>
                    <button
                      type="button"
                      onClick={() =>
                        setRaceStandings(prev => [
                          ...prev,
                          { pos: String(prev.length + 1), code: '', driver: '', team: '', gap: '', tires: 'M-H', pits: '1', points: '0' }
                        ])
                      }
                      className="px-2.5 py-1 rounded bg-carbon border border-graphite hover:border-papaya font-mono text-[11px] text-offwhite"
                    >
                      + Add Position
                    </button>
                  </div>

                  {raceStandings.map((row, idx) => (
                    <div key={idx} className="grid grid-cols-12 gap-1.5 items-center">
                      <input
                        type="text"
                        value={row.pos}
                        onChange={e => setRaceStandings(prev => prev.map((r, i) => (i === idx ? { ...r, pos: e.target.value } : r)))}
                        placeholder="Pos"
                        className="col-span-1 px-1.5 py-1.5 rounded bg-carbon border border-graphite font-mono text-xs text-offwhite text-center"
                      />
                      <input
                        type="text"
                        value={row.code}
                        onChange={e => setRaceStandings(prev => prev.map((r, i) => (i === idx ? { ...r, code: e.target.value.toUpperCase() } : r)))}
                        placeholder="VER"
                        maxLength={3}
                        className="col-span-1 px-1.5 py-1.5 rounded bg-carbon border border-graphite font-mono text-xs text-offwhite text-center uppercase"
                      />
                      <input
                        type="text"
                        value={row.driver}
                        onChange={e => setRaceStandings(prev => prev.map((r, i) => (i === idx ? { ...r, driver: e.target.value } : r)))}
                        placeholder="Driver Name"
                        className="col-span-3 px-2 py-1.5 rounded bg-carbon border border-graphite text-xs text-offwhite"
                      />
                      <input
                        type="text"
                        value={row.team}
                        onChange={e => setRaceStandings(prev => prev.map((r, i) => (i === idx ? { ...r, team: e.target.value } : r)))}
                        placeholder="Team"
                        className="col-span-2 px-2 py-1.5 rounded bg-carbon border border-graphite text-xs text-offwhite"
                      />
                      <input
                        type="text"
                        value={row.gap}
                        onChange={e => setRaceStandings(prev => prev.map((r, i) => (i === idx ? { ...r, gap: e.target.value } : r)))}
                        placeholder="+4.2s"
                        className="col-span-2 px-2 py-1.5 rounded bg-carbon border border-graphite font-mono text-[11px] text-offwhite"
                      />
                      <input
                        type="text"
                        value={row.tires}
                        onChange={e => setRaceStandings(prev => prev.map((r, i) => (i === idx ? { ...r, tires: e.target.value.toUpperCase() } : r)))}

                    </div>

                    <div>
                      <label className="block font-mono text-[10px] uppercase text-steel mb-1">Aircraft Name</label>
                      <input
                        type="text"
                        value={activeAircraft.name}
                        onChange={e => updateAircraftField('name', e.target.value)}
                        className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                      />
                    </div>

                    <div>
                      <label className="block font-mono text-[10px] uppercase text-steel mb-1">Parent Aviation Company</label>
                      <select
                        value={activeAircraft.companyId || ''}
                        onChange={e => updateAircraftField('companyId', e.target.value)}
                        className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                      >
                        {skyCompanies.map(c => (
                          <option key={c.id} value={c.id}>{c.name}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block font-mono text-[10px] uppercase text-steel mb-1">Configuration Outline Schematic</label>
                      <select
                        value={activeAircraft.outlineType || 'widebody'}
                        onChange={e => updateAircraftField('outlineType', e.target.value)}
                        className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                      >
                        <option value="widebody">Widebody Twin-Aisle Airliner</option>
                        <option value="narrowbody">Narrowbody Single-Aisle Airliner</option>
                        <option value="bizjet">Rear-Engined Business Jet</option>
                        <option value="fighter">Stealth Delta Tactical Fighter</option>
                        <option value="supersonic">Supersonic / Orbital Vehicle</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-mono text-[10px] uppercase text-steel mb-1">Programme Overview</label>
                      <input
                        type="text"
                        value={activeAircraft.overview || ''}
                        onChange={e => updateAircraftField('overview', e.target.value)}
                        placeholder="General aerodynamic & programme summary..."
                        className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    {[
                      'Operating Empty Weight (OEW)',
                      'Max Takeoff Weight (MTOW)',
                      'Fuel Consumption Rate',
                      'Airframe Materials',
                      'Manufacturing / EIS Year',
                      'Propulsion & Range'
                    ].map(specLabel => {
                      const val = activeAircraft.stats?.find(s => s.label === specLabel)?.value || '';
                      return (
                        <div key={specLabel} className="p-3 rounded bg-carbon border border-graphite">
                          <label className="block font-mono text-[10px] uppercase text-steel mb-1">{specLabel}</label>
                          <input
                            type="text"
                            value={val}
                            onChange={e => updateAircraftStatValue(specLabel, e.target.value)}
                            placeholder="Enter value..."
                            className="w-full px-2.5 py-1.5 rounded bg-charcoal border border-graphite font-mono text-xs text-offwhite"
                          />
                        </div>
                      );
                    })}
                  </div>

                  <div className="flex justify-end">
                    <button
                      type="button"
                      onClick={() => {
                        persistDatabase(entities, articles, weeklyLogs, raceResults);
                        notify(`Saved specifications for ${activeAircraft.name}`);
                      }}
                      className="px-5 py-2 rounded bg-papaya text-carbon font-mono text-xs font-bold uppercase"
                    >
                      Save Aircraft Specs
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* TAB 4: TEAMS & IDENTITY COLOURS */}
          {activeTab === 'teams' && (
            <div className="p-6 rounded-lg bg-charcoal border border-graphite space-y-5">
              <h2 className="text-lg font-bold text-offwhite">Configure Team / Manufacturer Identity Colours & Profiles</h2>
              {activeOrg && (
                <div className="space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                      <label className="block font-mono text-[10px] uppercase text-steel mb-1">Select Organisation</label>
                      <select
                        value={selectedOrgId}
                        onChange={e => setSelectedOrgId(e.target.value)}
                        className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                      >
                        {orgEntities.map(o => (
                          <option key={o.id} value={o.id}>{o.name} ({CATEGORIES[o.category]?.name})</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block font-mono text-[10px] uppercase text-steel mb-1">Display Name</label>
                      <input
                        type="text"
                        value={activeOrg.name}
                        onChange={e => {
                          const val = e.target.value;
                          setEntities(prev => {
                            const next = prev.map(ent => (ent.id === activeOrg.id ? { ...ent, name: val, fullName: val } : ent));
                            persistDatabase(next, articles, weeklyLogs, raceResults);
                            return next;
                          });
                        }}
                        className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                      />
                    </div>
                    <div>
                      <label className="block font-mono text-[10px] uppercase text-steel mb-1">Livery Outline Colour</label>
                      <div className="flex items-center gap-2">
                        <input
                          type="color"
                          value={activeOrg.primaryColor || '#E10600'}
                          onChange={e => {
                            const col = e.target.value;
                            setEntities(prev => {
                              const next = prev.map(ent =>
                                ent.id === activeOrg.id || ent.teamId === activeOrg.id || ent.companyId === activeOrg.id
                                  ? { ...ent, primaryColor: col }
                                  : ent
                              );
                              persistDatabase(next, articles, weeklyLogs, raceResults);
                              return next;
                            });
                          }}
                          className="h-9 w-14 rounded bg-carbon border border-graphite cursor-pointer"
                        />
                        <span className="font-mono text-xs text-offwhite">{activeOrg.primaryColor}</span>
                      </div>
                    </div>
                  </div>

                  <div>
                    <label className="block font-mono text-[10px] uppercase text-steel mb-1">Organisation Overview</label>
                    <textarea
                      rows="3"
                      value={activeOrg.overview || ''}
                      onChange={e => {
                        const ov = e.target.value;
                        setEntities(prev => {
                          const next = prev.map(ent => (ent.id === activeOrg.id ? { ...ent, overview: ov } : ent));
                          persistDatabase(next, articles, weeklyLogs, raceResults);
                          return next;
                        });
                      }}
                      placeholder="Technical profile, headquarters, and engineering focus..."
                      className="w-full px-3.5 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                    />
                  </div>
                </div>
              )}
            </div>
          )}

          {/* TAB 5: WEEKLY TRACKER */}
          {activeTab === 'weekly' && (
            <form onSubmit={handleAddWeeklyLog} className="p-6 rounded-lg bg-charcoal border border-graphite space-y-4 max-w-2xl">
              <h2 className="text-lg font-bold text-offwhite">Add Weekly Upgrade / Evolution Log Entry</h2>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block font-mono text-[10px] uppercase text-steel mb-1">Division</label>
                  <select
                    value={wkDivision}
                    onChange={e => setWkDivision(e.target.value)}
                    className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                  >
                    <option value="track">TRACK (Motorsport Upgrades)</option>
                    <option value="sky">SKY (Aviation & Sustainable Propulsion)</option>
                  </select>
                </div>
                <div>
                  <label className="block font-mono text-[10px] uppercase text-steel mb-1">Team / Manufacturer</label>
                  <input
                    type="text"
                    value={wkOrg}
                    onChange={e => setWkOrg(e.target.value)}
                    placeholder="e.g. McLaren, Ferrari, Airbus, Rolls-Royce..."
                    className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                  />
                </div>
              </div>
              <div>
                <label className="block font-mono text-[10px] uppercase text-steel mb-1">Development Title *</label>
                <input
                  type="text"
                  value={wkTitle}
                  onChange={e => setWkTitle(e.target.value)}
                  placeholder="e.g. Revised front wing endplate / 100% SAF test flight..."
                  className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                />
              </div>
              <div>
                <label className="block font-mono text-[10px] uppercase text-steel mb-1">Technical Significance</label>
                <textarea
                  rows="3"
                  value={wkSig}
                  onChange={e => setWkSig(e.target.value)}
                  placeholder="Aerodynamic, efficiency, or emissions impact..."
                  className="w-full px-3 py-2 rounded bg-carbon border border-graphite text-xs text-offwhite"
                />
              </div>
              <button
                type="submit"
                className="px-5 py-2.5 rounded bg-scarlet text-white font-mono text-xs font-bold uppercase"
              >
                + Save Weekly Entry
              </button>
            </form>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Mach1App />);
  </script>
</body>
</html>
